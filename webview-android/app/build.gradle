plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wynndev.furina.webview'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wynndev.furina.webview'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
