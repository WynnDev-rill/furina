plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def buildNumber = (System.getenv('FURINA_BUILD_NUMBER') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
def gitSha = (System.getenv('FURINA_GIT_SHA') ?: System.getenv('GITHUB_SHA') ?: '').replaceAll('[^0-9a-fA-F]', '').toLowerCase()
def evidenceEnrollmentToken = (System.getenv('FURINA_EVIDENCE_ENROLLMENT_TOKEN') ?: '').replaceAll('[^0-9a-fA-F]', '').toLowerCase()

def releaseKeystore = file('furina-release.jks')
def releaseStorePassword = System.getenv('FURINA_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('FURINA_KEY_ALIAS')
def releaseKeyPassword = System.getenv('FURINA_KEY_PASSWORD')
def releaseSigningReady = releaseKeystore.exists() &&
        releaseStorePassword?.trim() &&
        releaseKeyAlias?.trim() &&
        releaseKeyPassword?.trim()

android {
    namespace 'com.wynndev.furina'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wynndev.furina'
        minSdk 33
        targetSdk 35
        versionCode buildNumber
        versionName "5.0.${buildNumber}"
        buildConfigField 'String', 'GIT_SHA', "\"${gitSha}\""
        buildConfigField 'String', 'EVIDENCE_ENROLLMENT_TOKEN', "\"${evidenceEnrollmentToken}\""
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            // Release signing material is injected by trusted CI/local environment only.
            // An unsigned release configuration is intentionally allowed for untrusted
            // fork validation, which never receives repository secrets.
            if (releaseSigningReady) {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.includeAndroidResources = true }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        // llama.cpp discovers optimized CPU backends by enumerating
        // applicationInfo.nativeLibraryDir. Legacy packaging extracts the
        // bundled .so files there instead of leaving them inside the APK.
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    implementation files('libs/llama-android.aar')
    implementation platform('androidx.compose:compose-bom:2026.05.00')
    implementation 'androidx.activity:activity-ktx:1.12.2'
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
