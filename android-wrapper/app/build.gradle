plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

aandroid {
    namespace 'com.wynndev.furina'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wynndev.furina'
        minSdk 24
        targetSdk 35
        versionCode = buildNumber
        versionName = "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile file('../furina-release.jks')
            storePassword System.getenv('FURINA_KEYSTORE_PASSWORD') ?: 'FurinaRelease2026!'
            keyAlias 'furina'
            keyPassword System.getenv('FURINA_KEY_PASSWORD') ?: 'FurinaRelease2026!'
        }
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
