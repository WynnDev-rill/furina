plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

android {
    namespace 'com.wynndev.furina'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wynndev.furina'
        minSdk 24
        targetSdk 35
        versionCode = buildNumber
        versionName = "3.0.${buildNumber}"
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.browser:browser:1.8.0'
}
