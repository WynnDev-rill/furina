plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
def gitSha = (System.getenv('FURINA_GIT_SHA') ?: System.getenv('GITHUB_SHA') ?: '').replaceAll('[^0-9a-fA-F]', '').toLowerCase()

android {
    namespace 'com.wynndev.furina'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wynndev.furina'
        minSdk 33
        targetSdk 35
        versionCode buildNumber
        versionName "4.0.${buildNumber}"
        buildConfigField 'String', 'GIT_SHA', "\"${gitSha}\""
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file('furina-release.jks')
            storePassword System.getenv('FURINA_KEYSTORE_PASSWORD') ?: 'furina-stable-2026'
            keyAlias System.getenv('FURINA_KEY_ALIAS') ?: 'furina'
            keyPassword System.getenv('FURINA_KEY_PASSWORD') ?: 'furina-stable-2026'
        }
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        // llama.cpp discovers optimized CPU backends by enumerating
        // applicationInfo.nativeLibraryDir. Legacy packaging extracts the
        // bundled .so files there instead of leaving them inside the APK.
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation files('libs/llama-android.aar')
    implementation 'androidx.activity:activity-ktx:1.12.2'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
