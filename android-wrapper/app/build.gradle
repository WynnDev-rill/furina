plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

android {
    namespace 'com.wynndev.furina'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.wynndev.furina'
        minSdk 24
        targetSdk 35
        versionCode = buildNumber
        versionName = "1.0.${buildNumber}"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3'
                arguments '-DANDROID_STL=c++_shared', '-DGGML_OPENMP=OFF', '-DGGML_NATIVE=OFF'
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../shared']
        }
    }

    signingConfigs {
        release {
            storeFile file('../furina-release.jks')
            storePassword System.getenv('FURINA_KEYSTORE_PASSWORD') ?: 'FurinaRelease2026!'
            keyAlias 'furina'
            keyPassword System.getenv('FURINA_KEY_PASSWORD') ?: 'FurinaRelease2026!'
        }
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.1'
}
