<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Furina</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#eef7ff}body{min-height:100vh;background-image:linear-gradient(180deg,rgba(3,12,24,.18),rgba(3,12,24,.76)),url('furina-background.jpg');background-size:cover;background-position:center top;background-attachment:fixed}
    .shell{min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}.brand{font-size:20px;font-weight:750;letter-spacing:.2px}.badge{padding:8px 12px;border-radius:999px;background:rgba(10,29,50,.68);border:1px solid rgba(160,220,255,.18);font-size:12px;color:#bfe8ff;backdrop-filter:blur(18px)}
    main{flex:1;display:flex;align-items:flex-end;padding-bottom:22px}.panel{width:100%;padding:20px;border:1px solid rgba(180,225,255,.18);border-radius:24px;background:linear-gradient(180deg,rgba(8,25,44,.72),rgba(5,17,32,.88));box-shadow:0 24px 70px rgba(0,0,0,.4);backdrop-filter:blur(22px)}
    h1{font-size:25px;line-height:1.18;margin:0 0 10px}p{margin:0;color:#b8c9d9;line-height:1.55;font-size:14px}.actions{display:grid;gap:10px;margin-top:18px}.primary,.secondary{width:100%;min-height:50px;border-radius:16px;font-size:15px;font-weight:700}.primary{border:0;background:linear-gradient(135deg,#41b9ff,#4e72ff);color:white}.secondary{border:1px solid rgba(180,225,255,.22);background:rgba(10,28,48,.75);color:#eaf7ff}.note{margin-top:14px;font-size:12px;color:#8da6ba}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand">Furina</div><div class="badge">Mode lokal tersedia</div></header>
    <main>
      <section class="panel">
        <h1>Furina tetap dapat dibuka tanpa jaringan.</h1>
        <p>Fondasi antarmuka lokal sudah tersimpan di dalam APK. Tampilan lengkap Smart Dashboard akan dipasang pada sesi berikutnya.</p>
        <div class="actions">
          <button class="primary" onclick="location.href='https://furina-pi.vercel.app/'">Buka Furina Online</button>
          <button class="secondary" onclick="window.FurinaNative&&window.FurinaNative.openModelManager()">Kelola Model Offline</button>
        </div>
        <div class="note">Background ini adalah file asli yang disimpan sebagai aset lokal, bukan gambar hasil pembuatan ulang.</div>
      </section>
    </main>
  </div>
</body>
</html>
