name: Build Furina Agent Final Candidate

on:
  push:
    branches:
      - experiment/furina-agent-termux
      - feat/furina-mind-universal-agent-rc5
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-bridge-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-agent-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAG: furina-agent-v1.0.0-rc5
      APK_NAME: Furina-Agent-Bridge-v1.0.0-rc5.apk
      EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4

      - name: Reassemble and layer Furina Mind RC5
        shell: bash
        run: |
          set -euo pipefail
          SRC_META="experiments/furina-agent-final"
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$SRC_META"/source-*.b64; do
            base64 --decode "$chunk" >> "$ARCHIVE"
          done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json; print(json.load(open("experiments/furina-agent-final/manifest.json"))["source_sha256"])')" = "$EXPECTED_SOURCE_SHA"

          rm -rf /tmp/furina-agent-src
          mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          patch -p0 -d /tmp/furina-agent-src < "$SRC_META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$SRC_META/patches/runtime-online-agent.patch"

          # Only the stable selector + IME bridge primitives are taken from the
          # legacy generation. RC5 replaces the old app-specific core entirely.
          python3 "$SRC_META/overrides/apply-bridge-primitives-rc5.py" /tmp/furina-agent-src/termux

          python3 - "$SRC_META/overrides" /tmp/furina-agent-src/termux <<'PY'
          import hashlib, json, pathlib, sys
          override_root = pathlib.Path(sys.argv[1]).resolve()
          termux_root = pathlib.Path(sys.argv[2]).resolve()
          manifest_raw = (override_root / 'manifest.json').read_bytes()
          manifest = json.loads(manifest_raw.decode('utf-8'))
          assert manifest.get('revision') == 'companion-v3'
          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          for item in manifest['files']:
              source = (override_root / item['path']).resolve()
              target = (termux_root / item['target']).resolve()
              assert override_root in source.parents
              assert termux_root in target.parents
              data = source.read_bytes()
              assert blob_sha(data) == item['git_blob_sha'], (source, blob_sha(data), item['git_blob_sha'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

          python3 "$SRC_META/overrides/apply-bridge-rc4.py" /tmp/furina-agent-src/termux
          python3 "$SRC_META/overrides/apply-universal-agent-rc5.py" /tmp/furina-agent-src/termux

          cp "$SRC_META/overrides/tests/test_final_contract.py" /tmp/furina-agent-src/termux/tests/test_final_contract.py
          cp "$SRC_META/overrides/tests/test_final_release_contract.py" /tmp/furina-agent-src/termux/tests/test_final_release_contract.py

          ROOT=/tmp/furina-agent-src/termux
          test -f "$ROOT/core/furina_agent/memory.py"
          test -f "$ROOT/core/furina_agent/response.py"
          test -f "$ROOT/core/furina_agent/vision.py"
          grep -q 'TaskContract' "$ROOT/core/furina_agent/agent.py"
          grep -q '_verify_goal' "$ROOT/core/furina_agent/agent.py"
          grep -q '_with_vision' "$ROOT/core/furina_agent/agent.py"
          grep -q 'CREATE TABLE IF NOT EXISTS beliefs' "$ROOT/core/furina_agent/memory.py"
          grep -q 'CREATE TABLE IF NOT EXISTS episodes' "$ROOT/core/furina_agent/memory.py"
          grep -q 'DIALOGUE_ANCHORS' "$ROOT/core/furina_agent/persona.py"
          grep -q 'choose_profile' "$ROOT/core/furina_agent/response.py"
          grep -q 'FURINA MIND' "$ROOT/core/furina_agent/tui.py"
          grep -q 'tanpa konfirmasi kedua' "$ROOT/core/furina_agent/tui.py"
          grep -q 'free = low.endswith(":free") or bool(' "$ROOT/core/furina_agent/providers.py"
          grep -q 'reasoning_effort.*none' "$ROOT/core/furina_agent/providers.py"
          grep -q 'selectorScore' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'ACTION_IME_ENTER' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'case "long_press"' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'case "scroll_node"' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'ACTION_PASTE' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'BridgeUpdater' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/MainActivity.java"
          grep -q 'versionCode 10005' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc5'" "$ROOT/bridge/app/build.gradle"

      - name: Validate installer, Python core, and RC5 regressions
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh upgrade.sh uninstall.sh "$GITHUB_WORKSPACE/experiments/furina-agent-final/install.sh"
          PYTHONPATH=core python3 -m compileall -q core tests
          PYTHONPATH=core python3 -m unittest discover -s tests -v
          PYTHONPATH=core python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from furina_agent.companion import _obvious_device_intent
          from furina_agent.memory import MemoryStore
          from furina_agent.persona import build_system_prompt
          from furina_agent.providers import ModelInfo, OpenAICompatibleProvider
          from furina_agent.config import Config

          provider = OpenAICompatibleProvider('groq', 'test-key', Config())
          info = provider._model_info({'id': 'plain-chat-model', 'pricing': {}})
          assert info is not None and type(info.free) is bool and info.free is False
          malformed = ModelInfo('same-score-a', {}, free={})
          normal = ModelInfo('same-score-b', {}, free=False)
          assert len(provider._rank_models([malformed, normal])) == 2

          assert _obvious_device_intent('buka Tokopedia lalu cari laptop')
          assert _obvious_device_intent('buka Discord dan cari Wynn lalu kirim pesan')
          assert not _obvious_device_intent('bagaimana cara buka Tokopedia')
          prompt = build_system_prompt('Furina', 'Wynn')
          assert 'DIALOGUE' in prompt and 'customer-service' in prompt

          with TemporaryDirectory() as td:
              store = MemoryStore(Path(td) / 'mind.db')
              store.add_memory('Wynn suka percakapan natural', 'preference', 0.8, confidence=0.9)
              assert store.search('percakapan natural')
              store.upsert_belief('preference', 'suka percakapan natural', 0.8)
              assert store.beliefs('preference', 0.5)
          print('RC5 Furina Mind regressions: PASS')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable Bridge signing identity
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks
          test -s bridge/app/furina-agent-release.jks

      - name: Build signed release Bridge
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-src/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FURINA_KEYSTORE_PASSWORD"
          test -n "$FURINA_KEY_ALIAS"
          test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:lintRelease :bridge:app:assembleRelease

      - name: Verify APK identity, version, signer, and create manifest
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK=/tmp/furina-agent-src/termux/bridge/app/build/outputs/apk/release/app-release.apk
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer 2>/dev/null | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)"
          CERT_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK_NAME")"
          PACKAGE="$($APKANALYZER manifest application-id "$APK_NAME" | tr -d '\r')"
          VERSION_CODE="$($APKANALYZER manifest version-code "$APK_NAME" | tr -d '\r')"
          VERSION_NAME="$($APKANALYZER manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          SIGNER="$(printf '%s\n' "$CERT_OUTPUT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = "com.wynndev.furinaagentbridge"
          test "$VERSION_CODE" = "10005"
          test "$VERSION_NAME" = "1.0.0-rc5"
          test "${#SHA256}" -eq 64
          test "${#SIGNER}" -eq 64
          export PACKAGE VERSION_CODE VERSION_NAME SHA256 SIGNER
          python3 - <<'PY'
          import json, os
          tag = 'furina-agent-v1.0.0-rc5'
          name = 'Furina-Agent-Bridge-v1.0.0-rc5.apk'
          data = {
              'version': os.environ['VERSION_NAME'],
              'version_code': int(os.environ['VERSION_CODE']),
              'package_name': os.environ['PACKAGE'],
              'sha256': os.environ['SHA256'],
              'signer_sha256': os.environ['SIGNER'],
              'apk_url': f'https://github.com/WynnDev-rill/furina/releases/download/{tag}/{name}',
          }
          with open('bridge.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          cat bridge.json

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Agent-Final-v1.0.0-rc5
          path: |
            Furina-Agent-Bridge-v1.0.0-rc5.apk
            bridge.json
          if-no-files-found: error

      - name: Publish isolated prerelease
        if: github.ref == 'refs/heads/experiment/furina-agent-termux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" bridge.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" bridge.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Furina Agent 1.0.0 RC5 — By Wynn" \
              --notes "RC5: Furina Mind layered memory, adaptive dialogue personality, universal Accessibility observe-act-verify controller, independent goal verifier, long-press/scroll/text fallbacks, and optional multimodal screenshot grounding using configured providers. Remains isolated from the main Furina APK." \
              --prerelease
          fi
