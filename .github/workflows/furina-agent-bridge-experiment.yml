name: Build Furina Agent RC14 + Bridge RC8

on:
  push:
    branches:
      - experiment/furina-agent-termux
      - feature/furina-direct-device-control-rc13
      - feature/furina-unbounded-chat-input-rc14
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-bridge-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-agent-rc14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAG: furina-agent-v1.0.0-rc8
      APK_NAME: Furina-Agent-Bridge-v1.0.0-rc8.apk
      EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

    steps:
      - name: Checkout experiment source
        uses: actions/checkout@v4

      - name: Reassemble and layer Furina RC14
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["source_sha256"])')" = "$EXPECTED_SOURCE_SHA"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc14"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc8"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])')" = "10008"

          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"

          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('revision')=='companion-v8'
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              source=(src/item['path']).resolve(); target=(dst/item['target']).resolve()
              assert src in source.parents and dst in target.parents
              data=source.read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc14"' "$ROOT/core/furina_agent/version.py"
          grep -q 'config_revision: int = 10' "$ROOT/core/furina_agent/config.py"
          grep -q 'device_control_mode: str = "normal"' "$ROOT/core/furina_agent/config.py"
          test -f "$ROOT/core/furina_agent/direct_control.py"
          test -f "$ROOT/core/furina_agent/long_input.py"
          grep -q 'class DirectDeviceControl' "$ROOT/core/furina_agent/direct_control.py"
          grep -q 'direct = self.session.try_direct(text)' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'max_length=0' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'prepare_long_message' "$ROOT/core/furina_agent/chat.py"
          grep -q 'router_view(text)' "$ROOT/core/furina_agent/companion.py"
          ! grep -q 'self.reminders.start()' "$ROOT/core/furina_agent/companion.py"
          grep -q '"Kontrol perangkat"' "$ROOT/core/furina_agent/tui.py"
          grep -q 'versionCode 10008' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc8'" "$ROOT/bridge/app/build.gradle"
          grep -q 'dev.rikka.shizuku:api:13.1.5' "$ROOT/bridge/app/build.gradle"
          grep -q 'android.useAndroidX=true' "$ROOT/gradle.properties"
          grep -q 'rikka.shizuku.ShizukuProvider' "$ROOT/bridge/app/src/main/AndroidManifest.xml"
          grep -q 'SCHEDULE_EXACT_ALARM' "$ROOT/bridge/app/src/main/AndroidManifest.xml"
          grep -q 'Shizuku.bindUserService' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedControl.java"
          grep -q 'ReminderScheduler.restoreAll' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/BootReceiver.java"
          grep -q '"/control/status"' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/LocalBridgeServer.java"
          grep -q '"/control"' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/LocalBridgeServer.java"

      - name: Validate installer and Core RC14
        shell: bash
        run: |
          set -euo pipefail
          META="$GITHUB_WORKSPACE/experiments/furina-agent-final"
          ROOT=/tmp/furina-agent-src/termux
          python3 -m pip install --quiet 'rich>=13.9,<15' 'textual==8.2.8'
          bash -n "$META/install.sh"
          grep -q 'run_quiet "Memasang Furina Core RC14"' "$META/install.sh"
          grep -q 'apply-core-rc13.py' "$META/install.sh"
          grep -q 'apply-bridge-rc8.py' "$META/install.sh"
          grep -q 'apply-core-rc14.py' "$META/install.sh"
          grep -q "CORE_RC13_TRANSFORM_BLOB=\"$(git hash-object "$META/overrides/apply-core-rc13.py")\"" "$META/install.sh"
          grep -q "BRIDGE_RC8_TRANSFORM_BLOB=\"$(git hash-object "$META/overrides/apply-bridge-rc8.py")\"" "$META/install.sh"
          grep -q "CORE_RC14_TRANSFORM_BLOB=\"$(git hash-object "$META/overrides/apply-core-rc14.py")\"" "$META/install.sh"
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from textual.widgets import Input
          from furina_agent.prospective import extract_prospectives
          from furina_agent.long_input import prepare_long_message, router_view, history_view
          from furina_agent.memory import MemoryStore

          now=1_700_000_000
          due=extract_prospectives('ingatkan aku minum 5 menit lagi', now=now)[0][1]
          assert 299 <= due-now <= 301
          assert Input(max_length=0).max_length == 0

          class Cfg:
              routing_mode='local'; context_size=4096
          class LLM:
              def __init__(self): self.calls=[]
              def chat(self,messages,**kwargs):
                  self.calls.append(messages[-1]['content'])
                  return 'note-' + str(len(self.calls))
          raw='START\n' + ('0123456789 long-input detail\n' * 3500) + 'END'
          llm=LLM(); prepared=prepare_long_message(raw,Cfg(),llm)
          assert prepared.chunked and prepared.chunks > 5
          assert len(llm.calls) >= prepared.chunks
          assert 'START' in prepared.model_text and 'END' in prepared.model_text
          assert len(router_view(raw)) < len(raw) and len(history_view(raw)) < len(raw)
          with tempfile.TemporaryDirectory() as td:
              store=MemoryStore(Path(td)/'furina.db')
              store.add_message('user', raw)
              assert store.recent_messages(1)[0]['content'] == raw
          print('RC14_CORE_CONTRACT_OK')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable Bridge signing identity
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed Bridge RC8
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-src/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FURINA_KEYSTORE_PASSWORD" && test -n "$FURINA_KEY_ALIAS" && test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify APK and create update manifest
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-src/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          CERT="$($APKSIGNER verify --verbose --print-certs "$APK_NAME")"
          PACKAGE="$($APKANALYZER manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$($APKANALYZER manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$($APKANALYZER manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10008
          test "$NAME" = 1.0.0-rc8
          test "${#SHA}" -eq 64 && test "${#SIGNER}" -eq 64
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            'version':os.environ['NAME'],
            'version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],
            'sha256':os.environ['SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'apk_url':'https://github.com/WynnDev-rill/furina/releases/download/furina-agent-v1.0.0-rc8/Furina-Agent-Bridge-v1.0.0-rc8.apk'
          }
          open('bridge.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Agent-Core-RC14-Bridge-RC8
          path: |
            Furina-Agent-Bridge-v1.0.0-rc8.apk
            bridge.json
          if-no-files-found: error

      - name: Publish isolated RC8 prerelease
        if: github.ref == 'refs/heads/experiment/furina-agent-termux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" bridge.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" bridge.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Furina Agent Bridge 1.0.0 RC8 — By Wynn" \
              --notes "Bridge RC8 provides Android-owned reminders and Normal/Shizuku/Root device control. Core RC14 keeps those capabilities and removes the chat composer character cap while adapting oversized messages to finite model context without truncating the stored original." \
              --prerelease
          fi