name: Build Furina Agent RC19 + Bridge RC10

on:
  push:
    branches:
      - experiment/furina-agent-termux
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-bridge-experiment.yml'
  pull_request:
    branches:
      - experiment/furina-agent-termux
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-bridge-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-agent-rc19-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAG: furina-agent-v1.0.0-rc10
      APK_NAME: Furina-Agent-Bridge-v1.0.0-rc10.apk
      EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

    steps:
      - name: Checkout experiment source
        uses: actions/checkout@v4

      - name: Reassemble and layer Furina RC19
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["source_sha256"])')" = "$EXPECTED_SOURCE_SHA"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc19"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc10"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])')" = "10010"

          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"

          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('revision')=='companion-v8'
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              source=(src/item['path']).resolve(); target=(dst/item['target']).resolve()
              assert src in source.parents and dst in target.parents
              data=source.read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          for f in \
            apply-bridge-rc4.py \
            apply-universal-agent-rc5.py \
            apply-core-rc6.py \
            apply-core-rc6-postfix.py \
            apply-bridge-rc6.py \
            apply-core-rc7.py \
            apply-bridge-rc7.py \
            apply-core-rc8.py \
            apply-core-rc8-postfix.py \
            apply-core-rc9.py \
            apply-ui-rc10.py \
            apply-ui-rc10-hotfix.py \
            apply-core-rc11.py \
            apply-ui-rc12.py \
            apply-ui-rc12-postfix.py \
            apply-core-rc13.py \
            apply-bridge-rc8.py \
            apply-core-rc14.py \
            apply-core-rc15.py \
            apply-core-rc16.py \
            apply-core-rc17-hotfix.py \
            apply-bridge-rc9.py \
            apply-core-rc18.py \
            apply-ui-performance-bridge-rc10.py \
            apply-ui-performance-rc19.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc19"' "$ROOT/core/furina_agent/version.py"
          grep -q 'config_revision: int = 11' "$ROOT/core/furina_agent/config.py"
          grep -q 'class FurinaMind' "$ROOT/core/furina_agent/mind_v2.py"
          grep -q 'class CognitionRouter' "$ROOT/core/furina_agent/cognition.py"
          grep -q 'def _sync_termux_session' "$ROOT/core/furina_agent/events.py"
          grep -q 'def _compile_ui_sequence' "$ROOT/core/furina_agent/agent.py"
          grep -q 'def _try_ui_sequence' "$ROOT/core/furina_agent/agent.py"
          grep -q 'run_ui_sequence' "$ROOT/core/furina_agent/agent.py"
          grep -q 'tap_text' "$ROOT/core/furina_agent/direct_control.py"
          grep -q 'scroll_best' "$ROOT/core/furina_agent/direct_control.py"
          grep -q 'runUiSequence' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'TYPE_WINDOW_CONTENT_CHANGED' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'EVENT_LOCK.notifyAll' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'versionCode 10010' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc10'" "$ROOT/bridge/app/build.gradle"
          grep -q 'dev.rikka.shizuku:api:13.1.5' "$ROOT/bridge/app/build.gradle"
          grep -q 'android.useAndroidX=true' "$ROOT/gradle.properties"

      - name: Validate installer and RC19 contract
        shell: bash
        run: |
          set -euo pipefail
          META="$GITHUB_WORKSPACE/experiments/furina-agent-final"
          ROOT=/tmp/furina-agent-src/termux
          python3 -m pip install --quiet 'rich>=13.9,<15' 'textual==8.2.8'
          bash -n "$META/install.sh"
          grep -q 'run_quiet "Memasang Furina Core RC19"' "$META/install.sh"
          grep -q 'apply-ui-performance-bridge-rc10.py' "$META/install.sh"
          grep -q 'apply-ui-performance-rc19.py' "$META/install.sh"
          grep -q "UI_PERF_BRIDGE_RC10_BLOB=\"$(git hash-object "$META/overrides/apply-ui-performance-bridge-rc10.py")\"" "$META/install.sh"
          grep -q "UI_PERF_RC19_BLOB=\"$(git hash-object "$META/overrides/apply-ui-performance-rc19.py")\"" "$META/install.sh"
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          import re
          from furina_agent.agent import AndroidAgent
          from furina_agent.direct_control import _SIMPLE_OPEN
          assert _SIMPLE_OPEN.match('buka apk YouTube')
          assert _SIMPLE_OPEN.match('tolong bukakan YouTube')
          assert hasattr(AndroidAgent, '_compile_ui_sequence')
          assert hasattr(AndroidAgent, '_try_ui_sequence')
          print('RC19_UI_SEQUENCE_CONTRACT_OK')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable Bridge signing identity
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed Bridge RC10
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-src/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FURINA_KEYSTORE_PASSWORD" && test -n "$FURINA_KEY_ALIAS" && test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify APK and create update manifest
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-src/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          CERT="$($APKSIGNER verify --verbose --print-certs "$APK_NAME")"
          PACKAGE="$($APKANALYZER manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$($APKANALYZER manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$($APKANALYZER manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10010
          test "$NAME" = 1.0.0-rc10
          test "${#SHA}" -eq 64 && test "${#SIGNER}" -eq 64
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            'version':os.environ['NAME'],
            'version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],
            'sha256':os.environ['SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'apk_url':'https://github.com/WynnDev-rill/furina/releases/download/furina-agent-v1.0.0-rc10/Furina-Agent-Bridge-v1.0.0-rc10.apk'
          }
          open('bridge.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Agent-Core-RC19-Bridge-RC10
          path: |
            Furina-Agent-Bridge-v1.0.0-rc10.apk
            bridge.json
          if-no-files-found: error

      - name: Publish isolated RC10 prerelease
        if: github.ref == 'refs/heads/experiment/furina-agent-termux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" bridge.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" bridge.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Furina Agent Bridge 1.0.0 RC10 — By Wynn" \
              --notes "RC10 adds a bounded event-driven UI sequence executor. RC19 keeps ordinary tap, type, scroll and app transitions inside Bridge after one plan, while the existing universal planner remains the recovery path." \
              --prerelease
          fi
