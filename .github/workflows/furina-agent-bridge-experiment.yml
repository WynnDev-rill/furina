name: Build Furina Agent Final Candidate

on:
  push:
    branches:
      - experiment/furina-agent-termux
      - feat/furina-rc6-cognition-control
      - fix/furina-rc6-review-p2
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-bridge-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-agent-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAG: furina-agent-v1.0.0-rc6
      APK_NAME: Furina-Agent-Bridge-v1.0.0-rc6.apk
      EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4

      - name: Reassemble and layer Furina RC6
        shell: bash
        run: |
          set -euo pipefail
          META="experiments/furina-agent-final"
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["source_sha256"])')" = "$EXPECTED_SOURCE_SHA"
          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" /tmp/furina-agent-src/termux

          python3 - "$META/overrides" /tmp/furina-agent-src/termux <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('revision')=='companion-v4'
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              source=(src/item['path']).resolve(); target=(dst/item['target']).resolve()
              assert src in source.parents and dst in target.parents
              data=source.read_bytes(); assert sha(data)==item['git_blob_sha'], (source,sha(data),item['git_blob_sha'])
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          python3 "$META/overrides/apply-bridge-rc4.py" /tmp/furina-agent-src/termux
          python3 "$META/overrides/apply-universal-agent-rc5.py" /tmp/furina-agent-src/termux
          python3 "$META/overrides/apply-core-rc6.py" /tmp/furina-agent-src/termux
          python3 "$META/overrides/apply-core-rc6-postfix.py" /tmp/furina-agent-src/termux
          python3 "$META/overrides/apply-bridge-rc6.py" /tmp/furina-agent-src/termux
          cp "$META/overrides/tests/test_final_contract.py" /tmp/furina-agent-src/termux/tests/test_final_contract.py
          cp "$META/overrides/tests/test_final_release_contract.py" /tmp/furina-agent-src/termux/tests/test_final_release_contract.py

          ROOT=/tmp/furina-agent-src/termux
          grep -q 'VERSION = "1.0.0-rc6"' "$ROOT/core/furina_agent/version.py"
          grep -q 'config_revision: int = 6' "$ROOT/core/furina_agent/config.py"
          grep -q 'defaults\["event_port"\] = 8767' "$ROOT/core/furina_agent/config.py"
          grep -q 'TaskContract' "$ROOT/core/furina_agent/agent.py"
          grep -q '_deterministic_gate' "$ROOT/core/furina_agent/agent.py"
          grep -q 'agent_cancelled_user_return' "$ROOT/core/furina_agent/agent.py"
          grep -q 'LEARNED SKILL HINTS' "$ROOT/core/furina_agent/agent.py"
          grep -q 'contract.target_package' "$ROOT/core/furina_agent/agent.py"
          grep -q 'CREATE TABLE IF NOT EXISTS memory_vectors' "$ROOT/core/furina_agent/memory.py"
          grep -q 'CREATE TABLE IF NOT EXISTS learned_skills' "$ROOT/core/furina_agent/memory.py"
          grep -q 'query_vec = self._embed_text(query)' "$ROOT/core/furina_agent/memory.py"
          grep -q 'compact_goal = ("app="' "$ROOT/core/furina_agent/memory.py"
          ! grep -q 'compact_goal = " ".join(str(goal).split())' "$ROOT/core/furina_agent/memory.py"
          grep -q 'DeviceEventDaemon' "$ROOT/core/furina_agent/companion.py"
          grep -q 'LocalVision' "$ROOT/core/furina_agent/routing.py"
          grep -q 'finally:' "$ROOT/core/furina_agent/local_vision.py"
          grep -q 'DIALOGUE_ANCHORS' "$ROOT/core/furina_agent/persona.py"
          grep -q 'FURINA MIND' "$ROOT/core/furina_agent/tui.py"
          grep -q 'hybrid semantic' "$ROOT/core/furina_agent/tui.py"
          grep -q 'selectorScore' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'case "scroll_global"' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'verified_text' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'dispatchGestureAwait' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'recent_events' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'versionCode 10006' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc6'" "$ROOT/bridge/app/build.gradle"

      - name: Validate installer and RC6 regression suite
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh upgrade.sh uninstall.sh "$GITHUB_WORKSPACE/experiments/furina-agent-final/install.sh"
          PYTHONPATH=core python3 -m compileall -q core tests
          PYTHONPATH=core python3 -m unittest discover -s tests -v

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable Bridge signing identity
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed release Bridge
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-src/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FURINA_KEYSTORE_PASSWORD" && test -n "$FURINA_KEY_ALIAS" && test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:lintRelease :bridge:app:assembleRelease

      - name: Verify APK and create update manifest
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-src/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          CERT="$($APKSIGNER verify --verbose --print-certs "$APK_NAME")"
          PACKAGE="$($APKANALYZER manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$($APKANALYZER manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$($APKANALYZER manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10006
          test "$NAME" = 1.0.0-rc6
          test "${#SHA}" -eq 64 && test "${#SIGNER}" -eq 64
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            'version':os.environ['NAME'],'version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],'sha256':os.environ['SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'apk_url':'https://github.com/WynnDev-rill/furina/releases/download/furina-agent-v1.0.0-rc6/Furina-Agent-Bridge-v1.0.0-rc6.apk'
          }
          open('bridge.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Agent-Final-v1.0.0-rc6
          path: |
            Furina-Agent-Bridge-v1.0.0-rc6.apk
            bridge.json
          if-no-files-found: error

      - name: Publish isolated prerelease
        if: github.ref == 'refs/heads/experiment/furina-agent-termux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" bridge.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" bridge.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Furina Agent 1.0.0 RC6 — By Wynn" \
              --notes "RC6: verified text/gesture execution, cancel-on-return-to-Termux, local hybrid vector+FTS memory, event-driven device context, local multimodal perception, learned action skills, and post-review privacy/lifecycle fixes." \
              --prerelease
          fi
