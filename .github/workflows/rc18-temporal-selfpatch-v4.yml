name: RC18 temporal installer self-patch v4

on:
  push:
    branches:
      - agent/rc18-temporal-session-fix
    paths:
      - '.github/workflows/rc18-temporal-selfpatch-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc18-temporal-session-fix
          fetch-depth: 0

      - name: Patch installer and manifest only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old,new,1)

          install=Path('experiments/furina-agent-final/install.sh')
          s=install.read_text(encoding='utf-8')
          s=once(s,'VERSION="1.0.0-rc17"','VERSION="1.0.0-rc18"','installer version')
          rc17='CORE_RC17_TRANSFORM_URL="$BASE/overrides/apply-core-rc17-hotfix.py"\nCORE_RC17_TRANSFORM_BLOB="4ec514a512758ded6e9d263ef4e8bbbd12bcf2dc"\n'
          added=rc17 + 'BRIDGE_RC9_TRANSFORM_URL="$BASE/overrides/apply-bridge-rc9.py"\nBRIDGE_RC9_TRANSFORM_BLOB="b70d131d977e1fc0698c2f4201133feb1a11858f"\nCORE_RC18_TRANSFORM_URL="$BASE/overrides/apply-core-rc18.py"\nCORE_RC18_TRANSFORM_BLOB="d02464851749fb36b1016d58c048342435efe194"\n'
          s=once(s,rc17,added,'installer transform vars')
          s=once(s,
              '    "$CORE_RC17_TRANSFORM_URL|$CORE_RC17_TRANSFORM_BLOB|apply-core-rc17.py"; do\n',
              '    "$CORE_RC17_TRANSFORM_URL|$CORE_RC17_TRANSFORM_BLOB|apply-core-rc17.py" \\\n    "$BRIDGE_RC9_TRANSFORM_URL|$BRIDGE_RC9_TRANSFORM_BLOB|apply-bridge-rc9.py" \\\n    "$CORE_RC18_TRANSFORM_URL|$CORE_RC18_TRANSFORM_BLOB|apply-core-rc18.py"; do\n',
              'installer transform loop')
          s=once(s,'  grep -q \'VERSION = "1.0.0-rc17"\' "$SRC/core/furina_agent/version.py"','  grep -q \'VERSION = "1.0.0-rc18"\' "$SRC/core/furina_agent/version.py"','installer core check')
          s=once(s,'  grep -q \'versionCode 10008\' "$SRC/bridge/app/build.gradle" || { echo "Bridge staging bukan RC8 (versionCode)." >&2; return 1; }','  grep -q \'versionCode 10009\' "$SRC/bridge/app/build.gradle" || { echo "Bridge staging bukan RC9 (versionCode)." >&2; return 1; }','installer bridge code')
          s=once(s,'  grep -q "versionName \'1.0.0-rc8\'" "$SRC/bridge/app/build.gradle" || { echo "Bridge staging bukan RC8 (versionName)." >&2; return 1; }','  grep -q "versionName \'1.0.0-rc9\'" "$SRC/bridge/app/build.gradle" || { echo "Bridge staging bukan RC9 (versionName)." >&2; return 1; }','installer bridge name')
          s=once(s,'run_quiet "Memasang Furina Core RC17" 44 prepare_core','run_quiet "Memasang Furina Core RC18" 44 prepare_core','installer label')
          s=once(s,'  printf \'\\033[2mRC17 sudah terpasang. Jalankan:\\033[0m  \\033[1;36mfurina\\033[0m\\n\'','  printf \'\\033[2mRC18 sudah terpasang. Jalankan:\\033[0m  \\033[1;36mfurina\\033[0m\\n\'','installer final text')
          install.write_text(s,encoding='utf-8')

          manifest=Path('experiments/furina-agent-final/manifest.json')
          m=json.loads(manifest.read_text(encoding='utf-8'))
          m['version']='1.0.0-rc18'
          m['bridge_version']='1.0.0-rc9'
          m['bridge_version_code']=10009
          m['bridge_release_base']='https://github.com/WynnDev-rill/furina/releases/download/furina-agent-v1.0.0-rc9'
          manifest.write_text(json.dumps(m,indent=2)+'\n',encoding='utf-8')
          PY
          bash -n experiments/furina-agent-final/install.sh
          git diff --check

      - name: Commit installer and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wynn Dev"
          git config user.email "indonesiafilmku@gmail.com"
          git add experiments/furina-agent-final/install.sh experiments/furina-agent-final/manifest.json
          git commit -m "Wire RC18 installer and manifest"
          git push origin HEAD:agent/rc18-temporal-session-fix
