name: Validate FurinaHub RC43 + Core RC54

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - 'furinahub.png'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - 'furinahub.png'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-core-rc54-${{ github.ref }}
  cancel-in-progress: true

env:
  UPDATE_CHANNEL_TAG: furina-update-stable

jobs:
  validate-core-and-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate RC54 updater and transactional patch
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/stable-bootstrap.sh
          bash -n experiments/furina-agent-final/overrides/runtime-r24/install-body.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/rc54/apply.py \
            experiments/furina-agent-final/overrides/rc53/companion_state_v2.py \
            experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          def blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          manifest=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert manifest['version']=='1.0.0-rc54'
          assert manifest['dependency_revision']=='2026.08.18-r24'
          assert manifest['bridge_version']=='1.0.0-rc43'
          assert int(manifest['bridge_version_code'])==10043

          install=Path('experiments/furina-agent-final/install.sh').read_text()
          compat=Path('furina-agent-termux/experiments/furina-agent-final/install.sh').read_text()
          runtime=Path('experiments/furina-agent-final/overrides/runtime-r24/install-body.sh').read_text()
          assert install == compat
          assert 'FURINA_UPDATER_GENERATION="7"' in install
          assert 'BODY_BLOB="251b6cac5a57a6ca8411d7e3930843b5e12d6243"' in install
          assert 'RC54_APPLY_BLOB="0b7e0449de01fe40746230e79d93740078fc785c"' in install
          assert 'RC54_APPLY_BLOB="0b7e0449de01fe40746230e79d93740078fc785c"' in runtime
          assert blob('experiments/furina-agent-final/overrides/rc54/apply.py') == '0b7e0449de01fe40746230e79d93740078fc785c'
          assert blob('experiments/furina-agent-final/overrides/rc53/companion_state_v2.py') == '27fdb2a785bfdf28d7514ca35db1d5e73cfd5584'
          assert blob('experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py') == '05f5a5a6d5700c449f03535ec658363351e3c560'
          assert blob('experiments/furina-agent-final/overrides/runtime-r24/install-body.sh') == '251b6cac5a57a6ca8411d7e3930843b5e12d6243'
          assert 'patch pertama gagal; melakukan recovery otomatis dari RC52' in runtime
          forbidden='https://github.com/WynnDev-rill/furina/releases/latest/download'
          assert forbidden not in install and forbidden not in runtime
          print('FURINA_RC54_BINDINGS_OK')
          PY

          rm -rf /tmp/rc54-stage /tmp/rc54-patch
          mkdir -p /tmp/rc54-stage/core /tmp/rc54-patch
          cp -a experiments/furina-agent-final/overrides/core/furina_agent /tmp/rc54-stage/core/
          cp experiments/furina-agent-final/overrides/rc54/apply.py /tmp/rc54-patch/apply.py
          cp experiments/furina-agent-final/overrides/rc53/companion_state_v2.py /tmp/rc54-patch/companion_state_v2.py
          cp experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py /tmp/rc54-patch/mind_v2.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rc54-stage/core/furina_agent/version.py')
          p.write_text('VERSION = "1.0.0-rc52"\n',encoding='utf-8')
          PY
          python3 /tmp/rc54-patch/apply.py /tmp/rc54-stage
          grep -Fq 'VERSION = "1.0.0-rc54"' /tmp/rc54-stage/core/furina_agent/version.py
          grep -Fq 'LIVING COMPANION STATE:' /tmp/rc54-stage/core/furina_agent/chat.py
          grep -Fq 'LEARNED SELF / EXPERIENCE:' /tmp/rc54-stage/core/furina_agent/chat.py
          grep -Fq 'self.companion_state.after_turn(user_text, answer)' /tmp/rc54-stage/core/furina_agent/chat.py
          python3 -m compileall -q /tmp/rc54-stage/core/furina_agent

          # Simulate a retry from a syntactically valid partially-versioned RC53.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rc54-stage/core/furina_agent/version.py')
          p.write_text('VERSION = "1.0.0-rc53"\n',encoding='utf-8')
          PY
          python3 /tmp/rc54-patch/apply.py /tmp/rc54-stage
          test "$(grep -Fc 'self.companion_state = CompanionStateV2(store)' /tmp/rc54-stage/core/furina_agent/chat.py)" = 1
          test "$(grep -Fc 'self.mind = FurinaMind(store)' /tmp/rc54-stage/core/furina_agent/chat.py)" = 1
          grep -Fq 'VERSION = "1.0.0-rc54"' /tmp/rc54-stage/core/furina_agent/version.py
          python3 -m compileall -q /tmp/rc54-stage/core/furina_agent

      - name: Validate FurinaHub RC43 source chain
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/android-rc43/validate.sh
          test -f /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle
          grep -Fq "versionName '1.0.0-rc43'" /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle
          grep -Fq '"bridge_target": "1.0.0-rc43"' /tmp/furina-agent-rc43-validate/termux/core/furina_agent/hub.py

      - name: Configure Android and Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          GRADLE_DIR=/tmp/gradle-8.9
          if [[ ! -x "$GRADLE_DIR/bin/gradle" ]]; then
            curl -fL --silent --show-error --connect-timeout 15 --max-time 180 \
              --retry 4 --retry-delay 2 --retry-all-errors \
              https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
              -o /tmp/gradle-8.9-bin.zip
            rm -rf "$GRADLE_DIR"
            unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build FurinaHub RC43 compatibility APK
        working-directory: /tmp/furina-agent-rc43-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Publish RC54 Core recovery channel
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry_cmd() {
            for attempt in 1 2 3 4; do
              "$@" && return 0
              sleep $((attempt * 4))
            done
            return 1
          }

          if ! gh release view "$UPDATE_CHANNEL_TAG" >/dev/null 2>&1; then
            retry_cmd gh release create "$UPDATE_CHANNEL_TAG" --target "$GITHUB_SHA" \
              --title "Furina Update Channel" \
              --notes "Machine-readable recovery channel for FurinaHub Core." \
              --prerelease
          fi

          cp experiments/furina-agent-final/stable-bootstrap.sh furina-install.sh
          cp experiments/furina-agent-final/overrides/runtime-r24/install-body.sh furina-install-body.sh
          cp experiments/furina-agent-final/overrides/runtime-r22/install-body.sh core-r22-install-body.sh
          cp experiments/furina-agent-final/overrides/rc50/install-body.sh core-rc50-install-body.sh
          cp experiments/furina-agent-final/overrides/rc51/install-body.sh core-rc51-install-body.sh
          cp experiments/furina-agent-final/overrides/rc51/apply.py core-rc51-apply.py
          cp experiments/furina-agent-final/overrides/rc52/apply.py core-rc52-apply.py
          cp experiments/furina-agent-final/overrides/rc54/apply.py core-rc54-apply.py
          cp experiments/furina-agent-final/overrides/rc53/companion_state_v2.py core-rc54-companion-state.py
          cp experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py core-rc54-mind.py
          cp experiments/furina-agent-final/manifest.json manifest.json

          retry_cmd gh release upload "$UPDATE_CHANNEL_TAG" \
            furina-install.sh furina-install-body.sh core-r22-install-body.sh \
            core-rc50-install-body.sh core-rc51-install-body.sh \
            core-rc51-apply.py core-rc52-apply.py core-rc54-apply.py \
            core-rc54-companion-state.py core-rc54-mind.py manifest.json --clobber

          sleep 2
          retry_cmd curl -fL --silent --show-error --connect-timeout 10 --max-time 90 \
            "https://github.com/WynnDev-rill/furina/releases/download/furina-update-stable/manifest.json" \
            -o /tmp/furina-manifest-live.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/furina-manifest-live.json'))
          assert m['version']=='1.0.0-rc54'
          assert m['dependency_revision']=='2026.08.18-r24'
          assert m['bridge_version']=='1.0.0-rc43'
          print('FURINA_UPDATE_CHANNEL_RC54_LIVE_OK')
          PY
