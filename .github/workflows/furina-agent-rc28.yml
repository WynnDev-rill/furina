name: Build FurinaHub Android RC29 + Core RC46

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-android-rc29-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: furinahub-v1.0.0-rc29
  APK_NAME: FurinaHub-v1.0.0-rc29.apk

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Core RC46 and Android RC29
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/android-rc29/validate.sh
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/overrides/rc46/install-body.sh
          test "$(git hash-object experiments/furina-agent-final/overrides/rc46/apply.py)" = 6e772b638424286140f717623e3eef0e829fbe49
          test "$(git hash-object experiments/furina-agent-final/overrides/rc46/install-body.sh)" = de2b7c6acb892ce7a9049558456f418a68f4e880
          test "$(git hash-object experiments/furina-agent-final/overrides/android-rc29/apply.py)" = b772647313cbf704abeed556d5f69c92cca56264
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert manifest['version']=='1.0.0-rc46'
          assert manifest['bridge_version']=='1.0.0-rc29'
          assert int(manifest['bridge_version_code'])==10029
          assert manifest['dependency_revision']=='2026.08.15-r10'
          install=Path('experiments/furina-agent-final/install.sh').read_text()
          assert 'BODY_BLOB="de2b7c6acb892ce7a9049558456f418a68f4e880"' in install
          assert 'RC46_APPLY_BLOB="6e772b638424286140f717623e3eef0e829fbe49"' in install
          print('FURINAHUB_RC46_RC29_RELEASE_BINDINGS_OK')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build FurinaHub RC29 debug on PR
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Check immutable release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable APK release will not be overwritten."
            echo "FURINAHUB_RELEASE_EXISTS=1" >> "$GITHUB_ENV"
          else
            echo "FURINAHUB_RELEASE_EXISTS=0" >> "$GITHUB_ENV"
          fi

      - name: Restore FurinaHub signing identity
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed FurinaHub RC29
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-rc34-validate/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: |
          test -n "$FURINA_KEYSTORE_PASSWORD"
          test -n "$FURINA_KEY_ALIAS"
          test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify signed APK and publish immutable RC29
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-rc34-validate/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10029
          test "$NAME" = 1.0.0-rc29
          test "${#SHA}" = 64
          test "${#SIGNER}" = 64
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            "version":os.environ["NAME"],
            "version_code":int(os.environ["CODE"]),
            "package_name":os.environ["PACKAGE"],
            "sha256":os.environ["SHA"],
            "signer_sha256":os.environ["SIGNER"],
            "apk_url":"https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.0.0-rc29/FurinaHub-v1.0.0-rc29.apk",
          }
          open("bridge.json","w",encoding="utf-8").write(json.dumps(data,indent=2)+"\n")
          PY
          gh release create "$TAG" "$APK_NAME" bridge.json \
            --target "$GITHUB_SHA" \
            --title "FurinaHub v1.0.0-rc29" \
            --notes "FurinaHub RC29 + Core RC46: Plugin recovery no longer blocks Core updates, OpenConnector startup is hardened for Termux, Plugin failures expose actionable diagnostics, and the mobile UI is refined with cleaner typography, drawer, conversation history, chat bubbles, and update status presentation."
