name: Validate FurinaHub RC43 + Core RC58

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-core-rc58-${{ github.ref }}
  cancel-in-progress: true

env:
  UPDATE_CHANNEL_TAG: furina-update-stable

jobs:
  validate-core-and-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate RC58 updater bindings
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/stable-bootstrap.sh
          bash -n experiments/furina-agent-final/overrides/runtime-r28/install-body.sh
          bash -n experiments/furina-agent-final/overrides/rc57/vendor-install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/rc58/apply.py \
            experiments/furina-agent-final/overrides/rc58/upstream_bridge.py \
            experiments/furina-agent-final/overrides/rc58/zerochat_worker.py \
            experiments/furina-agent-final/overrides/rc58/soul_worker.py
          node --check experiments/furina-agent-final/overrides/rc58/lumimuse_worker.cjs
          node --check experiments/furina-agent-final/overrides/rc58/utsuwa_worker.cjs

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def blob(path):
              d=Path(path).read_bytes(); return hashlib.sha1(f"blob {len(d)}\0".encode()+d).hexdigest()
          m=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert m['version']=='1.0.0-rc58'
          assert m['dependency_revision']=='2026.08.18-r28'
          assert m['bridge_version']=='1.0.0-rc43'
          assert m['upstream_companion_pack']==2
          assert set(m['active_upstreams'])=={'soul_of_waifu','utsuwa','lumimuse','zerochat'}
          install=Path('experiments/furina-agent-final/install.sh').read_text()
          compat=Path('furina-agent-termux/experiments/furina-agent-final/install.sh').read_text()
          assert install==compat
          assert 'FURINA_UPDATER_GENERATION="11"' in install
          expected={
            'experiments/furina-agent-final/overrides/runtime-r28/install-body.sh':'3842248101e18012e257b757d16eeeaa6d99884c',
            'experiments/furina-agent-final/overrides/rc58/apply.py':'453ec291aed738157ac504a941614432096704be',
            'experiments/furina-agent-final/overrides/rc58/upstream_bridge.py':'ace3c3c4bc98f7400ef3b183cc508c87ace76111',
            'experiments/furina-agent-final/overrides/rc58/lumimuse_worker.cjs':'0fdd60c7b83448a9d954febef123e73cec2c477c',
            'experiments/furina-agent-final/overrides/rc58/zerochat_worker.py':'492311a1e8ac0f37a17358fe7866816eb89c338a',
            'experiments/furina-agent-final/overrides/rc58/utsuwa_worker.cjs':'83619ffba46119a58dc994bf7e9e28a1f32db735',
            'experiments/furina-agent-final/overrides/rc58/soul_worker.py':'b6caebc1b2f393500f96e78feade2195ad69e14e',
          }
          for p,h in expected.items(): assert blob(p)==h,(p,blob(p),h)
          print('FURINA_RC58_BINDINGS_OK')
          PY

      - name: Execute all four pinned upstream engines
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/furina-upstream-smoke /tmp/furina-ts
          mkdir -p \
            /tmp/furina-upstream-smoke/soul/app/utils \
            /tmp/furina-upstream-smoke/utsuwa/src/lib/engine \
            /tmp/furina-upstream-smoke/lumi/src/lib \
            /tmp/furina-upstream-smoke/zero/server/services
          get(){ curl -fL --silent --show-error --connect-timeout 10 --max-time 90 --retry 3 "$1" -o "$2"; }
          get https://raw.githubusercontent.com/jofizcd/Soul-of-Waifu/e5185eea9c4eb44990561a4bb5c2a18cf610381b/app/utils/soul_memory.py /tmp/furina-upstream-smoke/soul/app/utils/soul_memory.py
          get https://raw.githubusercontent.com/The-Lab-by-Ordinary-Company/utsuwa/24d79278cdbba714bcf94a4a06839d80f56d2827/src/lib/engine/state-updates.ts /tmp/furina-upstream-smoke/utsuwa/src/lib/engine/state-updates.ts
          get https://raw.githubusercontent.com/in30mn1a/LumiMuse/5486a545eabdceb843c4dbc01e070ce2e1ecd5f2/src/lib/memory-retrieval.ts /tmp/furina-upstream-smoke/lumi/src/lib/memory-retrieval.ts
          get https://raw.githubusercontent.com/in30mn1a/LumiMuse/5486a545eabdceb843c4dbc01e070ce2e1ecd5f2/src/lib/memory-prompt-contract.ts /tmp/furina-upstream-smoke/lumi/src/lib/memory-prompt-contract.ts
          get https://raw.githubusercontent.com/sh1nny0u/ZeroChat/d1785ded9534543c58a4861b178afe18f46bb10f/server/services/memory_service.py /tmp/furina-upstream-smoke/zero/server/services/memory_service.py
          npm install --prefix /tmp/furina-ts --no-audit --no-fund --omit=optional typescript@5 >/dev/null

          python3 - <<'PY'
          import json,subprocess,sys,tempfile
          from pathlib import Path
          base=Path('/tmp/furina-upstream-smoke'); rc=Path('experiments/furina-agent-final/overrides/rc58'); ts='/tmp/furina-ts'
          lumi={"upstream":str(base/'lumi'),"typescript_root":ts,"query":"aku suka kopi","token_budget":600,"final_top_k":6,"memories":[{"id":"m1","character_id":"furina","category":"偏好习惯","content":"User suka kopi tanpa gula","confidence":0.9,"tags":["kopi"],"source_msg_ids":[],"memory_kind":"user_preference","importance":0.8,"emotional_weight":0.4,"status":"active","pinned":False,"usage_count":1,"created_at":"2026-08-01T00:00:00+00:00","updated_at":"2026-08-01T00:00:00+00:00"}],"priority_memories":[]}
          p=subprocess.run(['node',str(rc/'lumimuse_worker.cjs')],input=json.dumps(lumi),text=True,capture_output=True,timeout=20); assert p.returncode==0,p.stderr; r=json.loads(p.stdout); assert r['ok'] and 'kopi' in r['text'].lower(),r
          uts={"upstream":str(base/'utsuwa'),"typescript_root":ts,"state":{"energy":80,"affection":100,"trust":50,"intimacy":30,"comfort":50,"respect":50,"mood":{"primary":"neutral","intensity":30,"causes":[]},"lastInteraction":"2026-08-18T00:00:00+00:00"},"hours_since":2,"sentiment":0.8,"topic_depth":"moderate","is_emotional":True,"is_question":False}
          p=subprocess.run(['node',str(rc/'utsuwa_worker.cjs')],input=json.dumps(uts),text=True,capture_output=True,timeout=20); assert p.returncode==0,p.stderr; r=json.loads(p.stdout); assert 'impact' in r and 'decay' in r,r
          with tempfile.TemporaryDirectory() as d:
              req={"op":"update","upstream":str(base/'zero'),"data_root":d,"role_id":"furina","user_text":"halo","answer":"hm","allow_summary":False}
              p=subprocess.run([sys.executable,str(rc/'zerochat_worker.py')],input=json.dumps(req)+'\n',text=True,capture_output=True,timeout=20); assert p.returncode==0,p.stderr; r=json.loads(p.stdout.strip().splitlines()[-1]); assert r['event']=='done' and r['short_term_count']==2,r
          with tempfile.TemporaryDirectory() as d:
              req={"op":"context","upstream":str(base/'soul'),"data_root":d,"mode":1,"batch":4,"character":"Furina","user":"Wynn","chat_id":"default"}
              p=subprocess.run([sys.executable,str(rc/'soul_worker.py')],input=json.dumps(req)+'\n',text=True,capture_output=True,timeout=20); assert p.returncode==0,p.stderr; r=json.loads(p.stdout.strip().splitlines()[-1]); assert r['event']=='done',r
          print('FURINA_RC58_FOUR_UPSTREAM_EXECUTION_OK')
          PY

      - name: Exercise RC52 to RC58 migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rc58-stage /tmp/rc55-patch /tmp/rc56-patch /tmp/rc57-patch /tmp/rc58-patch
          mkdir -p /tmp/rc58-stage/core /tmp/rc55-patch /tmp/rc56-patch /tmp/rc57-patch /tmp/rc58-patch
          cp -a experiments/furina-agent-final/overrides/core/furina_agent /tmp/rc58-stage/core/
          python3 - <<'PY'
          import ast
          from pathlib import Path
          v=Path('/tmp/rc58-stage/core/furina_agent/version.py'); v.write_text('VERSION = "1.0.0-rc52"\n',encoding='utf-8')
          p=Path('/tmp/rc58-stage/core/furina_agent/chat.py'); text=p.read_text(encoding='utf-8'); tree=ast.parse(text); target=None
          for node in tree.body:
              if isinstance(node,ast.ClassDef) and node.name=='FurinaChat':
                  for item in node.body:
                      if isinstance(item,(ast.FunctionDef,ast.AsyncFunctionDef)) and item.name=='_background': target=item; break
          if target:
              lines=text.splitlines(keepends=True); del lines[target.lineno-1:target.end_lineno]; p.write_text(''.join(lines),encoding='utf-8')
          PY
          cp experiments/furina-agent-final/overrides/rc55/apply.py /tmp/rc55-patch/apply.py
          cp experiments/furina-agent-final/overrides/rc53/companion_state_v2.py /tmp/rc55-patch/companion_state_v2.py
          cp experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py /tmp/rc55-patch/mind_v2.py
          python3 /tmp/rc55-patch/apply.py /tmp/rc58-stage
          cp experiments/furina-agent-final/overrides/rc56/*.py /tmp/rc56-patch/
          python3 /tmp/rc56-patch/apply.py /tmp/rc58-stage
          cp experiments/furina-agent-final/overrides/rc57/{apply.py,upstream_bridge.py,soul_worker.py,persona.py,utsuwa_worker.mjs} /tmp/rc57-patch/
          python3 /tmp/rc57-patch/apply.py /tmp/rc58-stage
          cp experiments/furina-agent-final/overrides/rc58/{apply.py,upstream_bridge.py,zerochat_worker.py,soul_worker.py,lumimuse_worker.cjs,utsuwa_worker.cjs} /tmp/rc58-patch/
          python3 /tmp/rc58-patch/apply.py /tmp/rc58-stage
          grep -Fq 'VERSION = "1.0.0-rc58"' /tmp/rc58-stage/core/furina_agent/version.py
          grep -Fq 'self.upstream_bridge.context(user_text)' /tmp/rc58-stage/core/furina_agent/chat.py
          grep -Fq '_lumimuse_context' /tmp/rc58-stage/core/furina_agent/upstream_bridge.py
          grep -Fq '_run_zerochat' /tmp/rc58-stage/core/furina_agent/upstream_bridge.py
          test -f /tmp/rc58-stage/core/furina_agent/upstream_runtime/lumimuse_worker.cjs
          test -f /tmp/rc58-stage/core/furina_agent/upstream_runtime/zerochat_worker.py
          test -f /tmp/rc58-stage/core/furina_agent/upstream_runtime/utsuwa_worker.cjs
          python3 -m compileall -q /tmp/rc58-stage/core/furina_agent
          echo FURINA_RC58_MIGRATION_OK

      - name: Validate FurinaHub RC43 source chain
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/android-rc43/validate.sh
          test -f /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle
          grep -Fq "versionName '1.0.0-rc43'" /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle

      - name: Configure Android and Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          GRADLE_DIR=/tmp/gradle-8.9
          if [[ ! -x "$GRADLE_DIR/bin/gradle" ]]; then
            curl -fL --silent --show-error --connect-timeout 15 --max-time 180 --retry 4 --retry-delay 2 --retry-all-errors https://downloads.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
            rm -rf "$GRADLE_DIR"; unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Build FurinaHub RC43 compatibility APK
        working-directory: /tmp/furina-agent-rc43-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Publish RC58 recovery channel
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry_cmd(){ for attempt in 1 2 3 4; do "$@" && return 0; sleep $((attempt*4)); done; return 1; }
          if ! gh release view "$UPDATE_CHANNEL_TAG" >/dev/null 2>&1; then
            retry_cmd gh release create "$UPDATE_CHANNEL_TAG" --target "$GITHUB_SHA" --title "Furina Update Channel" --notes "Machine-readable FurinaHub Core recovery channel." --prerelease
          fi
          cp experiments/furina-agent-final/stable-bootstrap.sh furina-install.sh
          cp experiments/furina-agent-final/overrides/runtime-r28/install-body.sh furina-install-body.sh
          cp experiments/furina-agent-final/overrides/runtime-r27/install-body.sh furina-runtime-r27.sh
          cp experiments/furina-agent-final/upstreams.lock.json upstreams.lock.json
          cp experiments/furina-agent-final/overrides/rc57/vendor-install.sh core-rc57-vendor-install.sh
          cp experiments/furina-agent-final/overrides/rc58/apply.py core-rc58-apply.py
          cp experiments/furina-agent-final/overrides/rc58/upstream_bridge.py core-rc58-upstream-bridge.py
          cp experiments/furina-agent-final/overrides/rc58/lumimuse_worker.cjs core-rc58-lumimuse-worker.cjs
          cp experiments/furina-agent-final/overrides/rc58/zerochat_worker.py core-rc58-zerochat-worker.py
          cp experiments/furina-agent-final/overrides/rc58/utsuwa_worker.cjs core-rc58-utsuwa-worker.cjs
          cp experiments/furina-agent-final/overrides/rc58/soul_worker.py core-rc58-soul-worker.py
          cp experiments/furina-agent-final/manifest.json manifest.json
          retry_cmd gh release upload "$UPDATE_CHANNEL_TAG" \
            furina-install.sh furina-install-body.sh furina-runtime-r27.sh upstreams.lock.json core-rc57-vendor-install.sh \
            core-rc58-apply.py core-rc58-upstream-bridge.py core-rc58-lumimuse-worker.cjs core-rc58-zerochat-worker.py \
            core-rc58-utsuwa-worker.cjs core-rc58-soul-worker.py manifest.json --clobber
          sleep 2
          retry_cmd curl -fL --silent --show-error --connect-timeout 10 --max-time 90 "https://github.com/WynnDev-rill/furina/releases/download/furina-update-stable/manifest.json" -o /tmp/furina-manifest-live.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/furina-manifest-live.json'))
          assert m['version']=='1.0.0-rc58'
          assert m['dependency_revision']=='2026.08.18-r28'
          assert set(m['active_upstreams'])=={'soul_of_waifu','utsuwa','lumimuse','zerochat'}
          print('FURINA_UPDATE_CHANNEL_RC58_LIVE_OK')
          PY
