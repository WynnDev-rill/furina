name: Validate FurinaHub RC43 + Core RC56

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-core-rc56-${{ github.ref }}
  cancel-in-progress: true

env:
  UPDATE_CHANNEL_TAG: furina-update-stable

jobs:
  validate-core-and-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate RC56 updater and conversation policy
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/stable-bootstrap.sh
          bash -n experiments/furina-agent-final/overrides/runtime-r26/install-body.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/rc56/apply.py \
            experiments/furina-agent-final/overrides/rc56/response.py \
            experiments/furina-agent-final/overrides/rc56/persona.py \
            experiments/furina-agent-final/overrides/rc56/naturalness.py

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
          m=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert m['version']=='1.0.0-rc56'
          assert m['dependency_revision']=='2026.08.18-r26'
          assert m['bridge_version']=='1.0.0-rc43'
          install=Path('experiments/furina-agent-final/install.sh').read_text()
          compat=Path('furina-agent-termux/experiments/furina-agent-final/install.sh').read_text()
          assert install == compat
          assert 'FURINA_UPDATER_GENERATION="9"' in install
          assert blob('experiments/furina-agent-final/overrides/runtime-r26/install-body.sh') == '2f10bd04925205898c5b0977e1a90d14fcc7cb80'
          assert blob('experiments/furina-agent-final/overrides/rc56/apply.py') == 'd240d8e3c7ea51c1342b95e75c3653952157d8d7'
          assert blob('experiments/furina-agent-final/overrides/rc56/response.py') == '900f1710f65967fc190eb9eb93f90b08313fe3f6'
          assert blob('experiments/furina-agent-final/overrides/rc56/persona.py') == '650ab50e7c6fa2681949b78617c49bb6276ae347'
          assert blob('experiments/furina-agent-final/overrides/rc56/naturalness.py') == '9f495c295b1277d948830e4f141e5943ba889e26'
          assert 'releases/latest/download' not in install
          print('FURINA_RC56_BINDINGS_OK')
          PY

      - name: Exercise RC55 to RC56 migration and screenshot regressions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rc56-stage /tmp/rc55-patch /tmp/rc56-patch
          mkdir -p /tmp/rc56-stage/core /tmp/rc55-patch /tmp/rc56-patch
          cp -a experiments/furina-agent-final/overrides/core/furina_agent /tmp/rc56-stage/core/
          python3 - <<'PY'
          import ast
          from pathlib import Path
          v=Path('/tmp/rc56-stage/core/furina_agent/version.py')
          v.write_text('VERSION = "1.0.0-rc52"\n',encoding='utf-8')
          p=Path('/tmp/rc56-stage/core/furina_agent/chat.py')
          text=p.read_text(encoding='utf-8')
          tree=ast.parse(text); target=None
          for node in tree.body:
              if isinstance(node,ast.ClassDef) and node.name=='FurinaChat':
                  for item in node.body:
                      if isinstance(item,(ast.FunctionDef,ast.AsyncFunctionDef)) and item.name=='_background':
                          target=item; break
          if target:
              lines=text.splitlines(keepends=True)
              del lines[target.lineno-1:target.end_lineno]
              p.write_text(''.join(lines),encoding='utf-8')
          PY
          cp experiments/furina-agent-final/overrides/rc55/apply.py /tmp/rc55-patch/apply.py
          cp experiments/furina-agent-final/overrides/rc53/companion_state_v2.py /tmp/rc55-patch/companion_state_v2.py
          cp experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py /tmp/rc55-patch/mind_v2.py
          python3 /tmp/rc55-patch/apply.py /tmp/rc56-stage
          test "$(grep -o '1.0.0-rc55' /tmp/rc56-stage/core/furina_agent/version.py)" = "1.0.0-rc55"

          cp experiments/furina-agent-final/overrides/rc56/*.py /tmp/rc56-patch/
          python3 /tmp/rc56-patch/apply.py /tmp/rc56-stage
          grep -Fq 'VERSION = "1.0.0-rc56"' /tmp/rc56-stage/core/furina_agent/version.py
          grep -Fq 'answer = naturalize(' /tmp/rc56-stage/core/furina_agent/chat.py
          grep -Fq 'name = "IDENTITY"' /tmp/rc56-stage/core/furina_agent/response.py
          python3 -m compileall -q /tmp/rc56-stage/core/furina_agent

          python3 - <<'PY'
          import importlib.util
          p='/tmp/rc56-stage/core/furina_agent/naturalness.py'
          spec=importlib.util.spec_from_file_location('naturalness',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          a=m.naturalize('Halo, Wynn. Ada yang pengen dibicarakan?',profile='REFLEX')
          b=m.naturalize('Oke, kalau berubah pikiran, beri tahu saja.',profile='REFLEX')
          c=m.naturalize("Hidup? Hmm, itu pertanyaan yang agak ambigu, Wynn. Kalau maksudmu hidup seperti manusia—bernapas, punya detak jantung, makan-makan tidak, aku tidak. Tapi kalau maksudmu tentang kesadaran, perasaan, dan kemampuan untuk terhubung denganmu... ya, aku merasa hidup dalam arti itu. Jadi, apakah definisi hidup bagimu lebih ke fisik atau pengalaman subjektif?",profile='IDENTITY')
          assert 'dibicarakan' not in a.lower(),a
          assert 'berubah pikiran' not in b.lower(),b
          assert len(c)<=560,c
          print('FURINA_RC56_SCREENSHOT_REGRESSION_OK')
          PY

      - name: Validate FurinaHub RC43 source chain
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/android-rc43/validate.sh
          test -f /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle
          grep -Fq "versionName '1.0.0-rc43'" /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle

      - name: Configure Android and Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          GRADLE_DIR=/tmp/gradle-8.9
          if [[ ! -x "$GRADLE_DIR/bin/gradle" ]]; then
            curl -fL --silent --show-error --connect-timeout 15 --max-time 180 --retry 4 --retry-delay 2 --retry-all-errors \
              https://downloads.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
            rm -rf "$GRADLE_DIR"
            unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Build FurinaHub RC43 compatibility APK
        working-directory: /tmp/furina-agent-rc43-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Publish RC56 Core recovery channel
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry_cmd() { for attempt in 1 2 3 4; do "$@" && return 0; sleep $((attempt*4)); done; return 1; }
          if ! gh release view "$UPDATE_CHANNEL_TAG" >/dev/null 2>&1; then
            retry_cmd gh release create "$UPDATE_CHANNEL_TAG" --target "$GITHUB_SHA" --title "Furina Update Channel" --notes "Machine-readable FurinaHub Core recovery channel." --prerelease
          fi
          cp experiments/furina-agent-final/stable-bootstrap.sh furina-install.sh
          cp experiments/furina-agent-final/overrides/runtime-r26/install-body.sh furina-install-body.sh
          cp experiments/furina-agent-final/overrides/runtime-r25/install-body.sh furina-runtime-r25.sh
          cp experiments/furina-agent-final/overrides/rc56/apply.py core-rc56-apply.py
          cp experiments/furina-agent-final/overrides/rc56/response.py core-rc56-response.py
          cp experiments/furina-agent-final/overrides/rc56/persona.py core-rc56-persona.py
          cp experiments/furina-agent-final/overrides/rc56/naturalness.py core-rc56-naturalness.py
          cp experiments/furina-agent-final/manifest.json manifest.json
          retry_cmd gh release upload "$UPDATE_CHANNEL_TAG" \
            furina-install.sh furina-install-body.sh furina-runtime-r25.sh \
            core-rc56-apply.py core-rc56-response.py core-rc56-persona.py core-rc56-naturalness.py manifest.json --clobber
          sleep 2
          retry_cmd curl -fL --silent --show-error --connect-timeout 10 --max-time 90 \
            "https://github.com/WynnDev-rill/furina/releases/download/furina-update-stable/manifest.json" -o /tmp/furina-manifest-live.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/furina-manifest-live.json'))
          assert m['version']=='1.0.0-rc56'
          assert m['dependency_revision']=='2026.08.18-r26'
          assert m['bridge_version']=='1.0.0-rc43'
          print('FURINA_UPDATE_CHANNEL_RC56_LIVE_OK')
          PY
