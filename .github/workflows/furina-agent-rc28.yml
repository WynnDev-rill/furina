name: Build FurinaHub Android RC34 + Core RC50

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-android-rc34-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: furinahub-v1.0.0-rc34
  APK_NAME: FurinaHub-v1.0.0-rc34.apk

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Core RC50 and Android RC34
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/rc50/validate.sh
          bash experiments/furina-agent-final/overrides/android-rc34/validate.sh
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/overrides/rc50/install-body.sh
          test "$(git hash-object experiments/furina-agent-final/overrides/rc50/apply.py)" = 7dfe9aab1b7bfa5c70191b00679acc17b17192c0
          test "$(git hash-object experiments/furina-agent-final/overrides/rc50/install-body.sh)" = 37fe2fef1debe5cd04404fd37e16bd710466b2db
          test "$(git hash-object experiments/furina-agent-final/overrides/android-rc34/apply.py)" = 4fd58cff62f846d1806048eb5d88a3878aa59910
          python3 - <<'PY'
          import json
          from pathlib import Path
          stage=Path('/tmp/furina-agent-rc34-validate/termux')
          manifest=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert manifest['version']=='1.0.0-rc50'
          assert manifest['dependency_revision']=='2026.08.17-r16'
          assert manifest['bridge_version']=='1.0.0-rc34'
          assert int(manifest['bridge_version_code'])==10034
          assert 'VERSION = "1.0.0-rc50"' in (stage/'core/furina_agent/version.py').read_text()
          assert "versionName '1.0.0-rc34'" in (stage/'bridge/app/build.gradle').read_text()
          install=Path('experiments/furina-agent-final/install.sh').read_text()
          assert 'BODY_URL="$BASE/overrides/rc50/install-body.sh"' in install
          assert 'BODY_BLOB="37fe2fef1debe5cd04404fd37e16bd710466b2db"' in install
          print('FURINAHUB_RC50_R16_RC34_RELEASE_BINDINGS_OK')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build FurinaHub RC34 debug on PR
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Check immutable release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable APK release will not be overwritten."
            echo "FURINAHUB_RELEASE_EXISTS=1" >> "$GITHUB_ENV"
          else
            echo "FURINAHUB_RELEASE_EXISTS=0" >> "$GITHUB_ENV"
          fi

      - name: Restore FurinaHub signing identity
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed FurinaHub RC34
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-rc34-validate/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: |
          test -n "$FURINA_KEYSTORE_PASSWORD"
          test -n "$FURINA_KEY_ALIAS"
          test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify signed APK and publish immutable RC34
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-rc34-validate/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10034
          test "$NAME" = 1.0.0-rc34
          test "${#SHA}" = 64
          test "${#SIGNER}" = 64
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            "version":os.environ["NAME"],
            "version_code":int(os.environ["CODE"]),
            "package_name":os.environ["PACKAGE"],
            "sha256":os.environ["SHA"],
            "signer_sha256":os.environ["SIGNER"],
            "apk_url":"https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.0.0-rc34/FurinaHub-v1.0.0-rc34.apk",
          }
          open("bridge.json","w",encoding="utf-8").write(json.dumps(data,indent=2)+"\n")
          PY
          gh release create "$TAG" "$APK_NAME" bridge.json \
            --target "$GITHUB_SHA" \
            --title "FurinaHub v1.0.0-rc34" \
            --notes "RC34 makes FurinaHub more companion-first: image understanding is grounded by vision but answered through Furina's normal personalized conversation pipeline; a collapsible live Berfikir activity indicator shows safe high-level stages without exposing private model reasoning; conversations receive short automatic titles and support pin/rename/delete from long-press; Settings uses one unified update surface for Core/dependencies and APK; and image selection/editor UX is rebuilt around Android Photo Picker, explicit editing, cleaner previews, aspect ratios, rotate, flip, and optional drawing. Core RC50/r16 adds the matching progress, title, pin, and persona-aware image runtime."
