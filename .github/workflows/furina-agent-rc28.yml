name: Build FurinaHub Android RC37 + Core RC51

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-android-rc37-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: furinahub-v1.0.0-rc37
  APK_NAME: FurinaHub-v1.0.0-rc37.apk
  UPDATE_CHANNEL_TAG: furina-update-stable

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Core RC51 r18 and Android RC37
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/android-rc37/validate.sh
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/overrides/rc51/install-body.sh
          test "$(git hash-object experiments/furina-agent-final/install.sh)" = 86ed1c17ed9cb07e09b13cda6a1c4b6b9aba5007
          test "$(git hash-object experiments/furina-agent-final/overrides/rc51/apply.py)" = 736555772589d692a165ad60fac8c8c4d458e23b
          test "$(git hash-object experiments/furina-agent-final/overrides/rc51/install-body.sh)" = 72d32cd80c95f0fcd9225ccb18b483bd8ff20b30
          test "$(git hash-object experiments/furina-agent-final/overrides/android-rc37/apply.py)" = f3e50c98ef974dec8421a327fd251cfe7fd5802e
          python3 - <<'PY'
          import json
          from pathlib import Path
          stage=Path('/tmp/furina-agent-rc37-validate/termux')
          manifest=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert manifest['version']=='1.0.0-rc51'
          assert manifest['dependency_revision']=='2026.08.17-r18'
          assert manifest['bridge_version']=='1.0.0-rc37'
          assert int(manifest['bridge_version_code'])==10037
          assert 'VERSION = "1.0.0-rc51"' in (stage/'core/furina_agent/version.py').read_text()
          assert '"bridge_target": "1.0.0-rc37"' in (stage/'core/furina_agent/hub.py').read_text()
          assert "versionName '1.0.0-rc37'" in (stage/'bridge/app/build.gradle').read_text()
          install=Path('experiments/furina-agent-final/install.sh').read_text()
          body=Path('experiments/furina-agent-final/overrides/rc51/install-body.sh').read_text()
          assert 'FURINA_INSTALLER_ID="furinahub-core-bootstrap-v2"' in install
          assert 'BODY_BLOB="72d32cd80c95f0fcd9225ccb18b483bd8ff20b30"' in install
          assert 'releases/download/furina-update-stable' in install
          assert 'api.github.com/repos/WynnDev-rill/furina/contents/experiments/furina-agent-final' in install
          assert 'FURINA_RESILIENT_UPDATE_WRAPPER_V2' in body
          assert 'DEPENDENCY_REVISION="2026.08.17-r18"' in body
          assert 'furina update' in body
          print('FURINAHUB_RC51_R18_RC37_RELEASE_BINDINGS_OK')
          PY

      - name: Configure preinstalled Android + pinned Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          GRADLE_DIR=/tmp/gradle-8.9
          if [[ ! -x "$GRADLE_DIR/bin/gradle" ]]; then
            curl -fL --silent --show-error \
              --connect-timeout 15 --max-time 180 \
              --retry 4 --retry-delay 2 --retry-all-errors \
              https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
              -o /tmp/gradle-8.9-bin.zip
            rm -rf "$GRADLE_DIR"
            unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          fi
          test -x "$GRADLE_DIR/bin/gradle"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version
          "$GRADLE_DIR/bin/gradle" --version

      - name: Build FurinaHub RC37 debug on PR
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-rc37-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Check immutable release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable APK release will not be overwritten."
            echo "FURINAHUB_RELEASE_EXISTS=1" >> "$GITHUB_ENV"
          else
            echo "FURINAHUB_RELEASE_EXISTS=0" >> "$GITHUB_ENV"
          fi

      - name: Restore FurinaHub signing identity
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc37-validate/termux
        shell: bash
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed FurinaHub RC37
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc37-validate/termux
        shell: bash
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-rc37-validate/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: |
          test -n "$FURINA_KEYSTORE_PASSWORD"
          test -n "$FURINA_KEY_ALIAS"
          test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify signed APK and publish RC37 + stable update channel
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-rc37-validate/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10037
          test "$NAME" = 1.0.0-rc37
          test "${#SHA}" = 64
          test "${#SIGNER}" = 64
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            "version":os.environ["NAME"],
            "version_code":int(os.environ["CODE"]),
            "package_name":os.environ["PACKAGE"],
            "sha256":os.environ["SHA"],
            "signer_sha256":os.environ["SIGNER"],
            "apk_url":"https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.0.0-rc37/FurinaHub-v1.0.0-rc37.apk",
          }
          open("bridge.json","w",encoding="utf-8").write(json.dumps(data,indent=2)+"\n")
          PY

          gh release create "$TAG" "$APK_NAME" bridge.json \
            --target "$GITHUB_SHA" \
            --title "FurinaHub v1.0.0-rc37" \
            --notes "RC37 makes the normal update flows authoritative again: Termux uses only 'furina update', and FurinaHub uses its built-in update check. Both prefer a stable GitHub Release channel, then fall back to the GitHub Contents API and legacy transports."

          cp experiments/furina-agent-final/install.sh furina-install.sh
          cp experiments/furina-agent-final/overrides/rc51/install-body.sh furina-install-body.sh
          cp experiments/furina-agent-final/overrides/rc50/install-body.sh core-rc50-install-body.sh
          cp experiments/furina-agent-final/overrides/rc51/apply.py core-rc51-apply.py
          cp experiments/furina-agent-final/manifest.json manifest.json

          if ! gh release view "$UPDATE_CHANNEL_TAG" >/dev/null 2>&1; then
            gh release create "$UPDATE_CHANNEL_TAG" \
              --target "$GITHUB_SHA" \
              --title "Furina Update Channel" \
              --notes "Machine-readable update transport for Furina Core and FurinaHub." \
              --prerelease
          fi
          gh release upload "$UPDATE_CHANNEL_TAG" \
            furina-install.sh \
            furina-install-body.sh \
            core-rc50-install-body.sh \
            core-rc51-apply.py \
            manifest.json \
            bridge.json \
            --clobber
