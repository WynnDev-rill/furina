name: Build FurinaHub Android RC32 + Core RC49

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-android-rc32-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: furinahub-v1.0.0-rc32
  APK_NAME: FurinaHub-v1.0.0-rc32.apk

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Core RC49 and Android RC32
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/rc49/validate.sh
          bash experiments/furina-agent-final/overrides/android-rc32/validate.sh
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/overrides/rc49/install-body.sh
          test "$(git hash-object experiments/furina-agent-final/overrides/rc49/apply.py)" = c16461e87230f8560f7e6093b90a7cc4e8aab909
          test "$(git hash-object experiments/furina-agent-final/overrides/rc49/harden.py)" = 5b8d67a938774652f4169a1733b8cd3fbab32b5f
          test "$(git hash-object experiments/furina-agent-final/overrides/rc49/install-body.sh)" = f5a852aae4d0aa57c19c724aef8d3a9752f1a098
          test "$(git hash-object experiments/furina-agent-final/overrides/android-rc32/apply.py)" = 4843fc8b9f77b88509046c031b9a58f16c7b46de
          python3 - <<'PY'
          import json
          from pathlib import Path
          stage=Path('/tmp/furina-agent-rc34-validate/termux')
          manifest=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert manifest['version']=='1.0.0-rc49'
          assert manifest['dependency_revision']=='2026.08.16-r15'
          assert manifest['bridge_version']=='1.0.0-rc32'
          assert int(manifest['bridge_version_code'])==10032
          assert 'VERSION = "1.0.0-rc49"' in (stage/'core/furina_agent/version.py').read_text()
          assert "versionName '1.0.0-rc32'" in (stage/'bridge/app/build.gradle').read_text()
          install=Path('experiments/furina-agent-final/install.sh').read_text()
          body=Path('experiments/furina-agent-final/overrides/rc49/install-body.sh').read_text()
          assert 'BODY_URL="$BASE/overrides/rc49/install-body.sh"' in install
          assert 'BODY_BLOB="f5a852aae4d0aa57c19c724aef8d3a9752f1a098"' in install
          for marker in (
              'OOMOL_CONNECT_ENCRYPTION_KEY="$key"',
              'OOMOL_CONNECT_ADMIN_TOKEN="$token"',
              'OOMOL_CONNECT_RUNTIME_TOKEN="$token"',
              'OOMOL_CONNECT_BLOCKED_PROXIES="*"',
              'NODE_ENV=production',
          ):
              assert marker in body, marker
          print('FURINAHUB_RC49_R15_RC32_RELEASE_BINDINGS_OK')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build FurinaHub RC32 debug on PR
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Check immutable release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable APK release will not be overwritten."
            echo "FURINAHUB_RELEASE_EXISTS=1" >> "$GITHUB_ENV"
          else
            echo "FURINAHUB_RELEASE_EXISTS=0" >> "$GITHUB_ENV"
          fi

      - name: Restore FurinaHub signing identity
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed FurinaHub RC32
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-rc34-validate/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: |
          test -n "$FURINA_KEYSTORE_PASSWORD"
          test -n "$FURINA_KEY_ALIAS"
          test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify signed APK and publish immutable RC32
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-rc34-validate/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10032
          test "$NAME" = 1.0.0-rc32
          test "${#SHA}" = 64
          test "${#SIGNER}" = 64
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            "version":os.environ["NAME"],
            "version_code":int(os.environ["CODE"]),
            "package_name":os.environ["PACKAGE"],
            "sha256":os.environ["SHA"],
            "signer_sha256":os.environ["SIGNER"],
            "apk_url":"https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.0.0-rc32/FurinaHub-v1.0.0-rc32.apk",
          }
          open("bridge.json","w",encoding="utf-8").write(json.dumps(data,indent=2)+"\n")
          PY
          gh release create "$TAG" "$APK_NAME" bridge.json \
            --target "$GITHUB_SHA" \
            --title "FurinaHub v1.0.0-rc32" \
            --notes "RC32 simplifies Plugin setup by auth contract: no-auth is labeled Ready instead of Connected, API/custom credentials use provider-declared fields, OAuth opens the system browser once a local OAuth app is configured, unsupported future auth types fail closed instead of breaking the catalog, and the initial list is reduced to useful providers while search still covers the full catalog. Core RC49/r15 protects the local OpenConnector admin and runtime APIs with a persistent random token, keeps credential encryption enabled, and disables raw provider proxy access."
