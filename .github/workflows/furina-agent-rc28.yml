name: Validate FurinaHub RC43 + Core RC55

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-core-rc55-${{ github.ref }}
  cancel-in-progress: true

env:
  UPDATE_CHANNEL_TAG: furina-update-stable

jobs:
  validate-core-and-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate RC55 updater and compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/stable-bootstrap.sh
          bash -n experiments/furina-agent-final/overrides/runtime-r25/install-body.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/rc55/apply.py \
            experiments/furina-agent-final/overrides/rc53/companion_state_v2.py \
            experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py

          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert m['version']=='1.0.0-rc55'
          assert m['dependency_revision']=='2026.08.18-r25'
          assert m['bridge_version']=='1.0.0-rc43'
          install=Path('experiments/furina-agent-final/install.sh').read_text()
          compat=Path('furina-agent-termux/experiments/furina-agent-final/install.sh').read_text()
          runtime=Path('experiments/furina-agent-final/overrides/runtime-r25/install-body.sh').read_text()
          assert install == compat
          assert 'FURINA_UPDATER_GENERATION="8"' in install
          assert 'VERSION="1.0.0-rc55"' in runtime
          assert 'Background maintenance hook bersifat opsional' in runtime
          assert 'releases/latest/download' not in install
          print('FURINA_RC55_BINDINGS_OK')
          PY

          rm -rf /tmp/rc55-stage /tmp/rc55-patch
          mkdir -p /tmp/rc55-stage/core /tmp/rc55-patch
          cp -a experiments/furina-agent-final/overrides/core/furina_agent /tmp/rc55-stage/core/
          python3 - <<'PY'
          import ast
          from pathlib import Path
          v=Path('/tmp/rc55-stage/core/furina_agent/version.py')
          v.write_text('VERSION = "1.0.0-rc52"\n',encoding='utf-8')
          p=Path('/tmp/rc55-stage/core/furina_agent/chat.py')
          text=p.read_text(encoding='utf-8')
          tree=ast.parse(text)
          target=None
          for node in tree.body:
              if isinstance(node,ast.ClassDef) and node.name=='FurinaChat':
                  for item in node.body:
                      if isinstance(item,(ast.FunctionDef,ast.AsyncFunctionDef)) and item.name=='_background':
                          target=item
                          break
          if target:
              lines=text.splitlines(keepends=True)
              del lines[target.lineno-1:target.end_lineno]
              p.write_text(''.join(lines),encoding='utf-8')
          assert 'def _background(' not in p.read_text(encoding='utf-8')
          PY
          cp experiments/furina-agent-final/overrides/rc55/apply.py /tmp/rc55-patch/apply.py
          cp experiments/furina-agent-final/overrides/rc53/companion_state_v2.py /tmp/rc55-patch/companion_state_v2.py
          cp experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py /tmp/rc55-patch/mind_v2.py
          python3 /tmp/rc55-patch/apply.py /tmp/rc55-stage
          grep -Fq 'VERSION = "1.0.0-rc55"' /tmp/rc55-stage/core/furina_agent/version.py
          grep -Fq 'LIVING COMPANION STATE:' /tmp/rc55-stage/core/furina_agent/chat.py
          grep -Fq 'self.companion_state.before_user(user_text)' /tmp/rc55-stage/core/furina_agent/chat.py
          grep -Fq 'self.companion_state.after_turn(user_text, answer)' /tmp/rc55-stage/core/furina_agent/chat.py
          python3 -m compileall -q /tmp/rc55-stage/core/furina_agent
          echo FURINA_RC55_NO_BACKGROUND_REGRESSION_OK

      - name: Validate FurinaHub RC43 source chain
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/android-rc43/validate.sh
          test -f /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle
          grep -Fq "versionName '1.0.0-rc43'" /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle

      - name: Configure Android and Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          GRADLE_DIR=/tmp/gradle-8.9
          if [[ ! -x "$GRADLE_DIR/bin/gradle" ]]; then
            curl -fL --silent --show-error --connect-timeout 15 --max-time 180 \
              --retry 4 --retry-delay 2 --retry-all-errors \
              https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
              -o /tmp/gradle-8.9-bin.zip
            rm -rf "$GRADLE_DIR"
            unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Build FurinaHub RC43 compatibility APK
        working-directory: /tmp/furina-agent-rc43-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Publish RC55 Core recovery channel
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry_cmd() {
            for attempt in 1 2 3 4; do
              "$@" && return 0
              sleep $((attempt * 4))
            done
            return 1
          }
          if ! gh release view "$UPDATE_CHANNEL_TAG" >/dev/null 2>&1; then
            retry_cmd gh release create "$UPDATE_CHANNEL_TAG" --target "$GITHUB_SHA" \
              --title "Furina Update Channel" --notes "Machine-readable FurinaHub Core recovery channel." --prerelease
          fi
          cp experiments/furina-agent-final/stable-bootstrap.sh furina-install.sh
          cp experiments/furina-agent-final/overrides/runtime-r25/install-body.sh furina-install-body.sh
          cp experiments/furina-agent-final/overrides/runtime-r22/install-body.sh furina-core-r22.sh
          cp experiments/furina-agent-final/overrides/rc55/apply.py core-rc55-apply.py
          cp experiments/furina-agent-final/overrides/rc53/companion_state_v2.py core-companion-state.py
          cp experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py core-mind-v2.py
          cp experiments/furina-agent-final/manifest.json manifest.json
          retry_cmd gh release upload "$UPDATE_CHANNEL_TAG" \
            furina-install.sh furina-install-body.sh furina-core-r22.sh \
            core-rc55-apply.py core-companion-state.py core-mind-v2.py manifest.json --clobber
          sleep 2
          retry_cmd curl -fL --silent --show-error --connect-timeout 10 --max-time 90 \
            "https://github.com/WynnDev-rill/furina/releases/download/furina-update-stable/manifest.json" \
            -o /tmp/furina-manifest-live.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/furina-manifest-live.json'))
          assert m['version']=='1.0.0-rc55'
          assert m['dependency_revision']=='2026.08.18-r25'
          assert m['bridge_version']=='1.0.0-rc43'
          print('FURINA_UPDATE_CHANNEL_RC55_LIVE_OK')
          PY
