name: Build FurinaHub Android RC30 + Core RC47

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-android-rc30-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: furinahub-v1.0.0-rc30
  APK_NAME: FurinaHub-v1.0.0-rc30.apk

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Core RC47 and Android RC30
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/android-rc30/validate.sh
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/overrides/rc47/install-body.sh
          test "$(git hash-object experiments/furina-agent-final/overrides/rc47/apply.py)" = b1b97aaae22d81ac5332d6bd414f91c59563383e
          test "$(git hash-object experiments/furina-agent-final/overrides/rc47/install-body.sh)" = 477e47346f816c2e774bc8661840203426892e0e
          test "$(git hash-object experiments/furina-agent-final/overrides/android-rc30/apply.py)" = 4263953006b1c2c42c02a6304b44df2370619a61
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert manifest['version']=='1.0.0-rc47'
          assert manifest['bridge_version']=='1.0.0-rc30'
          assert int(manifest['bridge_version_code'])==10030
          assert manifest['dependency_revision']=='2026.08.15-r11'
          install=Path('experiments/furina-agent-final/install.sh').read_text()
          body=Path('experiments/furina-agent-final/overrides/rc47/install-body.sh').read_text()
          assert 'BODY_BLOB="477e47346f816c2e774bc8661840203426892e0e"' in install
          assert 'RC47_APPLY_BLOB="b1b97aaae22d81ac5332d6bd414f91c59563383e"' in install
          assert 'local to="$2"' in body
          assert 'local file="$TMP/apply-$to.py"' in body
          assert 'to: unbound variable' in body
          print('FURINAHUB_RC47_RC30_RELEASE_BINDINGS_OK')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build FurinaHub RC30 debug on PR
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Check immutable release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable APK release will not be overwritten."
            echo "FURINAHUB_RELEASE_EXISTS=1" >> "$GITHUB_ENV"
          else
            echo "FURINAHUB_RELEASE_EXISTS=0" >> "$GITHUB_ENV"
          fi

      - name: Restore FurinaHub signing identity
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed FurinaHub RC30
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        working-directory: /tmp/furina-agent-rc34-validate/termux
        shell: bash
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-rc34-validate/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: |
          test -n "$FURINA_KEYSTORE_PASSWORD"
          test -n "$FURINA_KEY_ALIAS"
          test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify signed APK and publish immutable RC30
        if: github.event_name != 'pull_request' && env.FURINAHUB_RELEASE_EXISTS != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-rc34-validate/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10030
          test "$NAME" = 1.0.0-rc30
          test "${#SHA}" = 64
          test "${#SIGNER}" = 64
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            "version":os.environ["NAME"],
            "version_code":int(os.environ["CODE"]),
            "package_name":os.environ["PACKAGE"],
            "sha256":os.environ["SHA"],
            "signer_sha256":os.environ["SIGNER"],
            "apk_url":"https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.0.0-rc30/FurinaHub-v1.0.0-rc30.apk",
          }
          open("bridge.json","w",encoding="utf-8").write(json.dumps(data,indent=2)+"\n")
          PY
          gh release create "$TAG" "$APK_NAME" bridge.json \
            --target "$GITHUB_SHA" \
            --title "FurinaHub v1.0.0-rc30" \
            --notes "FurinaHub RC30 + Core RC47: fixes the RC46 Bash updater unbound-variable failure, unifies APK and Termux dependency updates, removes duplicate WebView safe-area spacing, aligns the chat composer, makes the Plugin navigation icon inherit theme color, and adds ten working direct Agent skills backed by existing Android Bridge primitives."
