name: Validate FurinaHub RC43 + Core RC57

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc28.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-core-rc57-${{ github.ref }}
  cancel-in-progress: true

env:
  UPDATE_CHANNEL_TAG: furina-update-stable

jobs:
  validate-core-and-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate RC57 updater and upstream bindings
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/stable-bootstrap.sh
          bash -n experiments/furina-agent-final/overrides/runtime-r27/install-body.sh
          bash -n experiments/furina-agent-final/overrides/rc57/vendor-install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/rc57/apply.py \
            experiments/furina-agent-final/overrides/rc57/upstream_bridge.py \
            experiments/furina-agent-final/overrides/rc57/soul_worker.py \
            experiments/furina-agent-final/overrides/rc57/persona.py
          node --check experiments/furina-agent-final/overrides/rc57/utsuwa_worker.mjs

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def blob(path):
              d=Path(path).read_bytes()
              return hashlib.sha1(f"blob {len(d)}\0".encode()+d).hexdigest()
          m=json.loads(Path('experiments/furina-agent-final/manifest.json').read_text())
          assert m['version']=='1.0.0-rc57'
          assert m['dependency_revision']=='2026.08.18-r27'
          assert m['bridge_version']=='1.0.0-rc43'
          assert m['upstream_companion_pack']==1
          install=Path('experiments/furina-agent-final/install.sh').read_text()
          compat=Path('furina-agent-termux/experiments/furina-agent-final/install.sh').read_text()
          assert install == compat
          assert 'FURINA_UPDATER_GENERATION="10"' in install
          expected={
            'experiments/furina-agent-final/overrides/runtime-r27/install-body.sh':'394c75e22b8df660ac2dcf9ecce3989de3c2d088',
            'experiments/furina-agent-final/upstreams.lock.json':'fa81a690d5b697194853668ffd035dc9b25ac73c',
            'experiments/furina-agent-final/overrides/rc57/vendor-install.sh':'f5ed88c9daf9b6b99bbdd34cc86914c8de137e4c',
            'experiments/furina-agent-final/overrides/rc57/apply.py':'680522409f6e149027007a4c04ed668f08e92b51',
            'experiments/furina-agent-final/overrides/rc57/upstream_bridge.py':'78638fed17f7f56d99ac8b2b92fcdb979ac9b19e',
            'experiments/furina-agent-final/overrides/rc57/soul_worker.py':'cdffe5cf05708d5a791c540c27660764dbfd0549',
            'experiments/furina-agent-final/overrides/rc57/utsuwa_worker.mjs':'ac85c1cfba2c6079e8739edf32a29f82679ea201',
            'experiments/furina-agent-final/overrides/rc57/persona.py':'848650bdad431a529f6692ca2753791dbf5eab63',
          }
          for p,h in expected.items(): assert blob(p)==h,(p,blob(p),h)
          lock=json.loads(Path('experiments/furina-agent-final/upstreams.lock.json').read_text())
          refs={s['id']:(s['ref'],s['license']) for s in lock['sources']}
          assert refs['soul_of_waifu']==('e5185eea9c4eb44990561a4bb5c2a18cf610381b','GPL-3.0')
          assert refs['utsuwa']==('24d79278cdbba714bcf94a4a06839d80f56d2827','MIT')
          assert refs['lumimuse']==('5486a545eabdceb843c4dbc01e070ce2e1ecd5f2','MIT')
          assert refs['zerochat']==('d1785ded9534543c58a4861b178afe18f46bb10f','MIT')
          print('FURINA_RC57_BINDINGS_OK')
          PY

      - name: Verify pinned upstream source contracts
        shell: bash
        run: |
          set -euo pipefail
          get(){ curl -fL --silent --show-error --connect-timeout 10 --max-time 60 --retry 3 "$1" -o "$2"; }
          get https://raw.githubusercontent.com/jofizcd/Soul-of-Waifu/e5185eea9c4eb44990561a4bb5c2a18cf610381b/app/utils/soul_memory.py /tmp/soul.py
          grep -Fq 'class SoulMemoryAgent' /tmp/soul.py
          grep -Fq 'update_memory_after_response' /tmp/soul.py
          get https://raw.githubusercontent.com/The-Lab-by-Ordinary-Company/utsuwa/24d79278cdbba714bcf94a4a06839d80f56d2827/src/lib/engine/state-updates.ts /tmp/utsuwa.ts
          grep -Fq 'calculateMessageImpact' /tmp/utsuwa.ts
          grep -Fq 'applyTimeDecay' /tmp/utsuwa.ts
          get https://raw.githubusercontent.com/in30mn1a/LumiMuse/5486a545eabdceb843c4dbc01e070ce2e1ecd5f2/src/lib/memory-retrieval.ts /tmp/lumi.ts
          grep -Fq 'WorkingMemoryPackage' /tmp/lumi.ts
          grep -Fq 'memory_package_token_budget' /tmp/lumi.ts
          get https://raw.githubusercontent.com/sh1nny0u/ZeroChat/d1785ded9534543c58a4861b178afe18f46bb10f/server/routers/ai_behavior.py /tmp/zero.py
          grep -Fq 'handle_proactive' /tmp/zero.py
          grep -Fq 'AIEventType' /tmp/zero.py
          echo FURINA_RC57_UPSTREAM_PINS_OK

      - name: Exercise RC52 to RC57 migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rc57-stage /tmp/rc55-patch /tmp/rc56-patch /tmp/rc57-patch
          mkdir -p /tmp/rc57-stage/core /tmp/rc55-patch /tmp/rc56-patch /tmp/rc57-patch
          cp -a experiments/furina-agent-final/overrides/core/furina_agent /tmp/rc57-stage/core/
          python3 - <<'PY'
          import ast
          from pathlib import Path
          v=Path('/tmp/rc57-stage/core/furina_agent/version.py')
          v.write_text('VERSION = "1.0.0-rc52"\n',encoding='utf-8')
          p=Path('/tmp/rc57-stage/core/furina_agent/chat.py')
          text=p.read_text(encoding='utf-8'); tree=ast.parse(text); target=None
          for node in tree.body:
              if isinstance(node,ast.ClassDef) and node.name=='FurinaChat':
                  for item in node.body:
                      if isinstance(item,(ast.FunctionDef,ast.AsyncFunctionDef)) and item.name=='_background': target=item; break
          if target:
              lines=text.splitlines(keepends=True); del lines[target.lineno-1:target.end_lineno]; p.write_text(''.join(lines),encoding='utf-8')
          PY
          cp experiments/furina-agent-final/overrides/rc55/apply.py /tmp/rc55-patch/apply.py
          cp experiments/furina-agent-final/overrides/rc53/companion_state_v2.py /tmp/rc55-patch/companion_state_v2.py
          cp experiments/furina-agent-final/overrides/core/furina_agent/mind_v2.py /tmp/rc55-patch/mind_v2.py
          python3 /tmp/rc55-patch/apply.py /tmp/rc57-stage
          cp experiments/furina-agent-final/overrides/rc56/*.py /tmp/rc56-patch/
          python3 /tmp/rc56-patch/apply.py /tmp/rc57-stage
          cp experiments/furina-agent-final/overrides/rc57/{apply.py,upstream_bridge.py,soul_worker.py,persona.py,utsuwa_worker.mjs} /tmp/rc57-patch/
          python3 /tmp/rc57-patch/apply.py /tmp/rc57-stage
          grep -Fq 'VERSION = "1.0.0-rc57"' /tmp/rc57-stage/core/furina_agent/version.py
          grep -Fq 'UPSTREAM COMPANION LAYERS:' /tmp/rc57-stage/core/furina_agent/chat.py
          grep -Fq 'self.upstream_bridge.after_turn(user_text, answer)' /tmp/rc57-stage/core/furina_agent/chat.py
          grep -Fq 'Jangan mendeskripsikan dirimu sebagai kode' /tmp/rc57-stage/core/furina_agent/persona.py
          test -f /tmp/rc57-stage/core/furina_agent/upstream_runtime/soul_worker.py
          test -f /tmp/rc57-stage/core/furina_agent/upstream_runtime/utsuwa_worker.mjs
          python3 -m compileall -q /tmp/rc57-stage/core/furina_agent
          echo FURINA_RC57_MIGRATION_OK

      - name: Validate FurinaHub RC43 source chain
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/android-rc43/validate.sh
          test -f /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle
          grep -Fq "versionName '1.0.0-rc43'" /tmp/furina-agent-rc43-validate/termux/bridge/app/build.gradle

      - name: Configure Android and Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          GRADLE_DIR=/tmp/gradle-8.9
          if [[ ! -x "$GRADLE_DIR/bin/gradle" ]]; then
            curl -fL --silent --show-error --connect-timeout 15 --max-time 180 --retry 4 --retry-delay 2 --retry-all-errors https://downloads.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
            rm -rf "$GRADLE_DIR"; unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          fi
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      - name: Build FurinaHub RC43 compatibility APK
        working-directory: /tmp/furina-agent-rc43-validate/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Publish RC57 recovery channel
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry_cmd(){ for attempt in 1 2 3 4; do "$@" && return 0; sleep $((attempt*4)); done; return 1; }
          if ! gh release view "$UPDATE_CHANNEL_TAG" >/dev/null 2>&1; then
            retry_cmd gh release create "$UPDATE_CHANNEL_TAG" --target "$GITHUB_SHA" --title "Furina Update Channel" --notes "Machine-readable FurinaHub Core recovery channel." --prerelease
          fi
          cp experiments/furina-agent-final/stable-bootstrap.sh furina-install.sh
          cp experiments/furina-agent-final/overrides/runtime-r27/install-body.sh furina-install-body.sh
          cp experiments/furina-agent-final/overrides/runtime-r26/install-body.sh furina-runtime-r26.sh
          cp experiments/furina-agent-final/upstreams.lock.json upstreams.lock.json
          cp experiments/furina-agent-final/overrides/rc57/vendor-install.sh core-rc57-vendor-install.sh
          cp experiments/furina-agent-final/overrides/rc57/apply.py core-rc57-apply.py
          cp experiments/furina-agent-final/overrides/rc57/upstream_bridge.py core-rc57-upstream-bridge.py
          cp experiments/furina-agent-final/overrides/rc57/soul_worker.py core-rc57-soul-worker.py
          cp experiments/furina-agent-final/overrides/rc57/utsuwa_worker.mjs core-rc57-utsuwa-worker.mjs
          cp experiments/furina-agent-final/overrides/rc57/persona.py core-rc57-persona.py
          cp experiments/furina-agent-final/manifest.json manifest.json
          retry_cmd gh release upload "$UPDATE_CHANNEL_TAG" \
            furina-install.sh furina-install-body.sh furina-runtime-r26.sh upstreams.lock.json \
            core-rc57-vendor-install.sh core-rc57-apply.py core-rc57-upstream-bridge.py \
            core-rc57-soul-worker.py core-rc57-utsuwa-worker.mjs core-rc57-persona.py manifest.json --clobber
          sleep 2
          retry_cmd curl -fL --silent --show-error --connect-timeout 10 --max-time 90 "https://github.com/WynnDev-rill/furina/releases/download/furina-update-stable/manifest.json" -o /tmp/furina-manifest-live.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/furina-manifest-live.json'))
          assert m['version']=='1.0.0-rc57'
          assert m['dependency_revision']=='2026.08.18-r27'
          assert m['bridge_version']=='1.0.0-rc43'
          print('FURINA_UPDATE_CHANNEL_RC57_LIVE_OK')
          PY
