name: Furina Model Architecture Diagnostic

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - '.github/workflows/furina-model-diagnose.yml'
      - 'experiments/furina-agent-final/**'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct final snapshot
        run: bash experiments/furina-agent-final/overrides/final-1.0/validate.sh
      - name: Dump exact model UI and hub boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import ast,re
          from pathlib import Path
          root=Path('/tmp/furina-agent-rc54-validate/termux/core/furina_agent')
          def dump_function(path,name):
              text=path.read_text(encoding='utf-8',errors='replace'); tree=ast.parse(text); lines=text.splitlines()
              for node in ast.walk(tree):
                  if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name==name:
                      print(f'===== {path.name}:{name} =====')
                      print('\n'.join(lines[node.lineno-1:node.end_lineno])); return
              print(f'===== {path.name}:{name} MISSING =====')
          for name in ('run_tui','_providers','_settings','_main_menu','_auto_start_local','_system','_update_repair','_lite_backup','_setup'):
              dump_function(root/'tui.py',name)
          for name in ('health','vision','_ensure_local','chat'):
              dump_function(root/'routing.py',name)
          for name in ('settings_snapshot','update_settings','_download_model','change_model','bootstrap'):
              dump_function(root/'hub.py',name)
          h=(root/'hub.py').read_text(encoding='utf-8',errors='replace')
          i=h.find('MODEL_CATALOG')
          print('===== HUB MODEL_CATALOG ====='); print(h[max(0,i-500):i+4500])
          page=Path('/tmp/furina-agent-rc54-validate/termux/bridge/app/src/main/assets/furinahub/index.html').read_text(encoding='utf-8',errors='replace')
          print('===== FURINAHUB MODEL SECTION =====')
          for needle in ('<section id="models"','id="modelRows"','id="catalogRows"','id="supportModels"','function modelRow','function renderModels','function downloadQwen','function pollModelStatus','data-view="memory"','id="memory"'):
              start=0
              while True:
                  j=page.find(needle,start)
                  if j<0: break
                  print(f'--- {needle} @ {j} ---'); print(page[max(0,j-900):min(len(page),j+5200)]); start=j+len(needle)
          PY
