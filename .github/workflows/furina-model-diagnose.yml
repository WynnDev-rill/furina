name: Furina Model Architecture Diagnostic

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - '.github/workflows/furina-model-diagnose.yml'
      - 'experiments/furina-agent-final/**'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate requested 1.7B model architecture
        run: bash experiments/furina-agent-final/overrides/private-1.0.1/validate.sh
