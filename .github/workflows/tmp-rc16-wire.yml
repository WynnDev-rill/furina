name: Temp wire RC16 paste once
on:
  push:
    branches: [fix/furina-paste-once-rc16]
    paths: ['.github/workflows/tmp-rc16-wire.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/furina-paste-once-rc16
      - name: Wire RC16 installer and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          meta = Path('experiments/furina-agent-final')
          transform = meta / 'overrides/apply-core-rc16.py'
          blob = subprocess.check_output(['git','hash-object',str(transform)], text=True).strip()

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, got {count}')
              return text.replace(old, new, 1)

          p = meta / 'install.sh'
          s = p.read_text(encoding='utf-8')
          s = once(s, 'VERSION="1.0.0-rc15"', 'VERSION="1.0.0-rc16"', 'installer version')
          anchor = 'CORE_RC15_TRANSFORM_BLOB="95da7480859e8ccdef8f7e7c6dfeafa06bed4b1d"\n'
          s = once(s, anchor, anchor + f'CORE_RC16_TRANSFORM_URL="$BASE/overrides/apply-core-rc16.py"\nCORE_RC16_TRANSFORM_BLOB="{blob}"\n', 'rc16 vars')
          loop = '    "$CORE_RC15_TRANSFORM_URL|$CORE_RC15_TRANSFORM_BLOB|apply-core-rc15.py"; do\n'
          s = once(s, loop, '    "$CORE_RC15_TRANSFORM_URL|$CORE_RC15_TRANSFORM_BLOB|apply-core-rc15.py" \\\n    "$CORE_RC16_TRANSFORM_URL|$CORE_RC16_TRANSFORM_BLOB|apply-core-rc16.py"; do\n', 'rc16 transform loop')
          s = once(s, 'grep -q \'VERSION = "1.0.0-rc15"\'', 'grep -q \'VERSION = "1.0.0-rc16"\'', 'staged version')
          s = once(s, 'run_quiet "Memasang Furina Core RC15" 44 prepare_core', 'run_quiet "Memasang Furina Core RC16" 44 prepare_core', 'installer label')
          s = once(s, 'RC15 sudah terpasang. Jalankan:', 'RC16 sudah terpasang. Jalankan:', 'final label')
          marker = "  grep -q 'VERSION = \"1.0.0-rc16\"' \"$SRC/core/furina_agent/version.py\"\n"
          s = once(s, marker, marker + "  grep -q 'event.prevent_default()' \"$SRC/core/furina_agent/paste_input.py\"\n  grep -q 'select_on_focus=False' \"$SRC/core/furina_agent/chat_surface.py\"\n", 'paste-once staged checks')
          p.write_text(s, encoding='utf-8')

          manifest_path = meta / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '1.0.0-rc15':
              raise SystemExit('unexpected manifest version')
          manifest['version'] = '1.0.0-rc16'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          bash -n experiments/furina-agent-final/install.sh
          git diff --check
      - name: Commit RC16 installer metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wynn Dev'
          git config user.email 'indonesiafilmku@gmail.com'
          git add experiments/furina-agent-final/install.sh experiments/furina-agent-final/manifest.json
          git commit -m 'build: wire Furina Core RC16 installer'
          git push origin HEAD:fix/furina-paste-once-rc16
