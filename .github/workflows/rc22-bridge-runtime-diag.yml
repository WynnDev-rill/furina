name: RC22 Bridge Runtime Diagnostic
on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - '.github/workflows/rc22-bridge-runtime-diag.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          M=experiments/furina-agent-final
          A=/tmp/furina.tar.gz
          : > "$A"
          for c in "$M"/source-*.b64; do base64 --decode "$c" >> "$A"; done
          mkdir -p /tmp/src && tar -xzf "$A" -C /tmp/src
          ROOT=/tmp/src/termux
          patch -p0 -d /tmp/src < "$M/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/src < "$M/patches/runtime-online-agent.patch"
          python3 "$M/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$M/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]); dst=pathlib.Path(sys.argv[2]); m=json.loads((src/'manifest.json').read_text())
          def sha(d): return hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          for i in m['files']:
              d=(src/i['path']).read_bytes(); assert sha(d)==i['git_blob_sha']; t=dst/i['target']; t.parent.mkdir(parents=True,exist_ok=True); t.write_bytes(d)
          PY
          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py apply-bridge-rc9.py apply-core-rc18.py apply-ui-performance-bridge-rc10.py apply-ui-performance-rc19.py apply-reactive-bridge-rc11.py apply-reactive-core-rc20.py apply-reactive-bridge-rc12.py apply-reactive-core-rc21.py; do python3 "$M/overrides/$f" "$ROOT"; done
          mkdir -p /tmp/out
          cp "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/BridgeRuntime.java" /tmp/out/
          cp "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/BridgeForegroundService.java" /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: rc22-bridge-runtime
          path: /tmp/out
