name: Temp sync RC14 unbounded chat
on:
  push:
    branches: [feature/furina-unbounded-chat-input-rc14]
    paths: ['.github/workflows/tmp-rc14-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/furina-unbounded-chat-input-rc14
      - name: Wire RC14 into installer and CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          root = Path('.')
          meta = root / 'experiments/furina-agent-final'
          transform = meta / 'overrides/apply-core-rc14.py'
          blob = subprocess.check_output(['git','hash-object',str(transform)], text=True).strip()

          p = meta / 'install.sh'
          s = p.read_text(encoding='utf-8')
          s = s.replace('VERSION="1.0.0-rc13"', 'VERSION="1.0.0-rc14"', 1)
          anchor = 'BRIDGE_RC8_TRANSFORM_BLOB="8102238998611c9cec6a42c1df9ab56191b0067b"\n'
          addition = anchor + 'CORE_RC14_TRANSFORM_URL="$BASE/overrides/apply-core-rc14.py"\nCORE_RC14_TRANSFORM_BLOB="' + blob + '"\n'
          if 'CORE_RC14_TRANSFORM_URL=' not in s:
              assert anchor in s
              s = s.replace(anchor, addition, 1)
          loop_anchor = '    "$BRIDGE_RC8_TRANSFORM_URL|$BRIDGE_RC8_TRANSFORM_BLOB|apply-bridge-rc8.py"; do\n'
          loop_new = '    "$BRIDGE_RC8_TRANSFORM_URL|$BRIDGE_RC8_TRANSFORM_BLOB|apply-bridge-rc8.py" \\\n    "$CORE_RC14_TRANSFORM_URL|$CORE_RC14_TRANSFORM_BLOB|apply-core-rc14.py"; do\n'
          assert loop_anchor in s
          s = s.replace(loop_anchor, loop_new, 1)
          s = s.replace('direct_control.py version.py tui.py; do', 'direct_control.py long_input.py version.py tui.py; do', 1)
          s = s.replace('grep -q \'VERSION = "1.0.0-rc13"\'', 'grep -q \'VERSION = "1.0.0-rc14"\'', 1)
          s = s.replace('run_quiet "Memasang Furina Core RC13" 44 prepare_core', 'run_quiet "Memasang Furina Core RC14" 44 prepare_core', 1)
          s = s.replace('RC13 sudah terpasang. Jalankan:', 'RC14 sudah terpasang. Jalankan:', 1)
          p.write_text(s, encoding='utf-8')

          manifest_path = meta / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '1.0.0-rc14'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          ui = root / '.github/workflows/rc11-unified-ui-smoke.yml'
          s = ui.read_text(encoding='utf-8')
          s = s.replace('name: RC13 Furina Termux UI + Direct Control Smoke', 'name: RC14 Furina Termux UI + Unbounded Chat Smoke', 1)
          if 'feature/furina-unbounded-chat-input-rc14' not in s:
              s = s.replace('      - feature/furina-direct-device-control-rc13\n', '      - feature/furina-direct-device-control-rc13\n      - feature/furina-unbounded-chat-input-rc14\n', 1)
          s = s.replace('Reassemble final Core and validate RC13', 'Reassemble final Core and validate RC14', 1)
          s = s.replace('apply-core-rc13.py apply-bridge-rc8.py; do', 'apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py; do', 1)
          s = s.replace('from furina_agent.direct_control import DirectDeviceControl\'', 'from furina_agent.direct_control import DirectDeviceControl; from furina_agent.long_input import prepare_long_message\'', 1)
          s = s.replace('print(\'RC13_DIRECT_SMOKE_OK\')', 'print(\'RC13_DIRECT_SMOKE_OK\')', 1)
          insert = '''          PYTHONPATH="$ROOT/core" python3 - <<'PY'\n          import tempfile\n          from pathlib import Path\n          from furina_agent.long_input import prepare_long_message, router_view\n          from furina_agent.memory import MemoryStore\n          class Cfg:\n              routing_mode='local'; context_size=4096\n          class LLM:\n              def __init__(self): self.calls=[]\n              def chat(self,messages,**kwargs):\n                  self.calls.append(messages[-1]['content'])\n                  return 'catatan-' + str(len(self.calls))\n          raw='START\\n' + ('abcdef0123456789\\n' * 9000) + 'END'\n          llm=LLM(); prepared=prepare_long_message(raw,Cfg(),llm)\n          assert prepared.chunked and prepared.chunks > 10\n          assert len(llm.calls) >= prepared.chunks\n          assert 'START' in prepared.model_text and 'END' in prepared.model_text\n          assert len(router_view(raw)) < len(raw)\n          with tempfile.TemporaryDirectory() as td:\n              store=MemoryStore(Path(td)/'furina.db')\n              store.add_message('user',raw)\n              assert store.recent_messages(1)[0]['content'] == raw\n          print('RC14_UNBOUNDED_CHAT_OK')\n          PY\n\n'''
          marker = '          grep -q \'VERSION = "1.0.0-rc13"\' "$ROOT/core/furina_agent/version.py"\n'
          assert marker in s
          s = s.replace(marker, insert + '          grep -q \'VERSION = "1.0.0-rc14"\' "$ROOT/core/furina_agent/version.py"\n', 1)
          s = s.replace("grep -q 'direct = self.session.try_direct(text)' \"$ROOT/core/furina_agent/chat_surface.py\"", "grep -q 'direct = self.session.try_direct(text)' \"$ROOT/core/furina_agent/chat_surface.py\"\n          grep -q 'max_length=0' \"$ROOT/core/furina_agent/chat_surface.py\"\n          test -f \"$ROOT/core/furina_agent/long_input.py\"", 1)
          s = s.replace("grep -q 'apply-core-rc13.py' \"$META/install.sh\"", "grep -q 'apply-core-rc13.py' \"$META/install.sh\"\n          grep -q 'apply-core-rc14.py' \"$META/install.sh\"", 1)
          s = s.replace('grep -q "CORE_RC13_TRANSFORM_BLOB=', 'grep -q "CORE_RC14_TRANSFORM_BLOB=\\\"$(git hash-object \\"$META/overrides/apply-core-rc14.py\\")\\\"" \\"$META/install.sh\\"\n          grep -q "CORE_RC13_TRANSFORM_BLOB=', 1)
          s = s.replace('echo RC13_TERMUX_DIRECT_UI_OK', 'echo RC14_TERMUX_UNBOUNDED_UI_OK', 1)
          ui.write_text(s, encoding='utf-8')

          build = root / '.github/workflows/furina-agent-bridge-experiment.yml'
          s = build.read_text(encoding='utf-8')
          s = s.replace('name: Build Furina Agent RC13 + Bridge RC8', 'name: Build Furina Agent RC14 + Bridge RC8', 1)
          if 'feature/furina-unbounded-chat-input-rc14' not in s:
              s = s.replace('      - feature/furina-direct-device-control-rc13\n', '      - feature/furina-direct-device-control-rc13\n      - feature/furina-unbounded-chat-input-rc14\n', 1)
          s = s.replace('group: furina-agent-rc13-', 'group: furina-agent-rc14-', 1)
          s = s.replace('Reassemble and layer Furina RC13', 'Reassemble and layer Furina RC14', 1)
          s = s.replace('= "1.0.0-rc13"', '= "1.0.0-rc14"', 1)
          s = s.replace('apply-core-rc13.py apply-bridge-rc8.py; do', 'apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py; do', 1)
          s = s.replace('grep -q \'VERSION = "1.0.0-rc13"\'', 'grep -q \'VERSION = "1.0.0-rc14"\'', 1)
          s = s.replace("grep -q 'direct = self.session.try_direct(text)' \"$ROOT/core/furina_agent/chat_surface.py\"", "grep -q 'direct = self.session.try_direct(text)' \"$ROOT/core/furina_agent/chat_surface.py\"\n          grep -q 'max_length=0' \"$ROOT/core/furina_agent/chat_surface.py\"\n          test -f \"$ROOT/core/furina_agent/long_input.py\"", 1)
          s = s.replace('run_quiet "Memasang Furina Core RC13"', 'run_quiet "Memasang Furina Core RC14"', 1)
          s = s.replace("grep -q 'apply-core-rc13.py' \"$META/install.sh\"", "grep -q 'apply-core-rc13.py' \"$META/install.sh\"\n          grep -q 'apply-core-rc14.py' \"$META/install.sh\"", 1)
          s = s.replace('grep -q "CORE_RC13_TRANSFORM_BLOB=', 'grep -q "CORE_RC14_TRANSFORM_BLOB=\\\"$(git hash-object \\"$META/overrides/apply-core-rc14.py\\")\\\"" \\"$META/install.sh\\"\n          grep -q "CORE_RC13_TRANSFORM_BLOB=', 1)
          s = s.replace("print('RC13_CORE_CONTRACT_OK')", "from furina_agent.long_input import prepare_long_message\n          class Cfg: routing_mode='local'; context_size=4096\n          class LLM:\n              def chat(self,messages,**kwargs): return 'note'\n          assert prepare_long_message('x'*50000,Cfg(),LLM()).chunked\n          print('RC14_CORE_CONTRACT_OK')", 1)
          s = s.replace('name: Furina-Agent-Core-RC13-Bridge-RC8', 'name: Furina-Agent-Core-RC14-Bridge-RC8', 1)
          build.write_text(s, encoding='utf-8')
          PY
          bash -n experiments/furina-agent-final/install.sh
          git diff --check
          git status --short
      - name: Commit synced files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wynn Dev"
          git config user.email "indonesiafilmku@gmail.com"
          git add experiments/furina-agent-final/install.sh experiments/furina-agent-final/manifest.json .github/workflows/rc11-unified-ui-smoke.yml .github/workflows/furina-agent-bridge-experiment.yml
          git commit -m "wire RC14 unbounded chat into installer and CI"
          git push origin HEAD:feature/furina-unbounded-chat-input-rc14
