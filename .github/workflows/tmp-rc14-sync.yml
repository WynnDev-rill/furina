name: Temp sync RC14 unbounded chat
on:
  push:
    branches: [feature/furina-unbounded-chat-input-rc14]
    paths: ['.github/workflows/tmp-rc14-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/furina-unbounded-chat-input-rc14
      - name: Refresh RC14 transform pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re
          meta=Path('experiments/furina-agent-final')
          blob=subprocess.check_output(['git','hash-object',str(meta/'overrides/apply-core-rc14.py')],text=True).strip()
          p=meta/'install.sh'; s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'CORE_RC14_TRANSFORM_BLOB="[0-9a-f]{40}"', f'CORE_RC14_TRANSFORM_BLOB="{blob}"', s, count=1)
          assert n==1
          p.write_text(s,encoding='utf-8')
          print(blob)
          PY
          bash -n experiments/furina-agent-final/install.sh
          git diff --check
      - name: Commit pin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wynn Dev"
          git config user.email "indonesiafilmku@gmail.com"
          git add experiments/furina-agent-final/install.sh
          git commit -m "refresh RC14 transform integrity pin"
          git push origin HEAD:feature/furina-unbounded-chat-input-rc14
