name: Temp sync RC14 unbounded chat
on:
  push:
    branches: [feature/furina-unbounded-chat-input-rc14]
    paths: ['.github/workflows/tmp-rc14-sync.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/furina-unbounded-chat-input-rc14
      - name: Repair generated-chat marker and integrity pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          meta=Path('experiments/furina-agent-final')
          t=meta/'overrides/apply-core-rc14.py'
          s=t.read_text(encoding='utf-8')
          start=s.index("    c = replace_once(\n        c,\n        '''        for reminder_text")
          end=s.index("    c = replace_once(\n        c,\n        '        self._schedule_background", start)
          replacement='''    c = replace_once(\n        c,\n        '        messages = self._messages(user_text, profile)\\n        self.store.set_state("companion_last_user_at", time.time())\\n',\n        '        prepared = prepare_long_message(user_text, self.cfg, self.llm)\\n        messages = self._messages(prepared.model_text, profile)\\n        self.store.set_state("companion_last_user_at", time.time())\\n',\n        "prepare unbounded input",\n    )\n'''
          s=s[:start]+replacement+s[end:]
          t.write_text(s,encoding='utf-8')
          compile(s,str(t),'exec')
          data=t.read_bytes()
          blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          installer=meta/'install.sh'; x=installer.read_text(encoding='utf-8')
          x,n=re.subn(r'CORE_RC14_TRANSFORM_BLOB="[0-9a-f]{40}"', f'CORE_RC14_TRANSFORM_BLOB="{blob}"', x, count=1)
          assert n==1
          installer.write_text(x,encoding='utf-8')
          print(blob)
          PY
          python3 -m py_compile experiments/furina-agent-final/overrides/apply-core-rc14.py
          bash -n experiments/furina-agent-final/install.sh
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wynn Dev"
          git config user.email "indonesiafilmku@gmail.com"
          git add experiments/furina-agent-final/overrides/apply-core-rc14.py experiments/furina-agent-final/install.sh
          git commit -m "repair RC14 temporal chat integration"
          git push origin HEAD:feature/furina-unbounded-chat-input-rc14
