name: Apply Online AI UI

on:
  push:
    branches:
      - agent/online-ai-provider-fallback
    paths:
      - '.github/workflows/apply-online-ai-ui.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/online-ai-provider-fallback' || github.ref_name == 'agent/online-ai-provider-fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/online-ai-provider-fallback
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply migration
        run: python3 .agents/apply_online_ai_ui.py
      - name: Validate web build
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm run build
      - name: Commit migration result
        run: |
          git checkout -- .github/workflows/build-furina-apk.yml .github/workflows/apply-online-ai-ui.yml
          git config user.name "Furina Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add online AI provider settings and fallback UI"
          git push origin HEAD:agent/online-ai-provider-fallback
