name: RC18 temporal release self-patch

on:
  push:
    branches:
      - agent/rc18-temporal-session-fix
    paths:
      - 'experiments/furina-agent-final/overrides/apply-bridge-rc9.py'
      - 'experiments/furina-agent-final/overrides/apply-core-rc18.py'
      - '.github/workflows/rc18-temporal-selfpatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc18-temporal-session-fix
          fetch-depth: 0

      - name: Wire RC18 and Bridge RC9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old,new,1)

          install=Path('experiments/furina-agent-final/install.sh')
          s=install.read_text(encoding='utf-8')
          s=once(s,'VERSION="1.0.0-rc17"','VERSION="1.0.0-rc18"','installer version')
          rc17='CORE_RC17_TRANSFORM_URL="$BASE/overrides/apply-core-rc17-hotfix.py"\nCORE_RC17_TRANSFORM_BLOB="4ec514a512758ded6e9d263ef4e8bbbd12bcf2dc"\n'
          added=rc17 + 'BRIDGE_RC9_TRANSFORM_URL="$BASE/overrides/apply-bridge-rc9.py"\nBRIDGE_RC9_TRANSFORM_BLOB="b70d131d977e1fc0698c2f4201133feb1a11858f"\nCORE_RC18_TRANSFORM_URL="$BASE/overrides/apply-core-rc18.py"\nCORE_RC18_TRANSFORM_BLOB="d02464851749fb36b1016d58c048342435efe194"\n'
          s=once(s,rc17,added,'installer transform vars')
          s=once(s,
              '    "$CORE_RC17_TRANSFORM_URL|$CORE_RC17_TRANSFORM_BLOB|apply-core-rc17.py"; do\n',
              '    "$CORE_RC17_TRANSFORM_URL|$CORE_RC17_TRANSFORM_BLOB|apply-core-rc17.py" \\\n    "$BRIDGE_RC9_TRANSFORM_URL|$BRIDGE_RC9_TRANSFORM_BLOB|apply-bridge-rc9.py" \\\n    "$CORE_RC18_TRANSFORM_URL|$CORE_RC18_TRANSFORM_BLOB|apply-core-rc18.py"; do\n',
              'installer transform loop')
          s=once(s,'  grep -q \'VERSION = "1.0.0-rc17"\' "$SRC/core/furina_agent/version.py"','  grep -q \'VERSION = "1.0.0-rc18"\' "$SRC/core/furina_agent/version.py"','installer core check')
          s=once(s,'  grep -q \'versionCode 10008\' "$SRC/bridge/app/build.gradle" || { echo "Bridge staging bukan RC8 (versionCode)." >&2; return 1; }','  grep -q \'versionCode 10009\' "$SRC/bridge/app/build.gradle" || { echo "Bridge staging bukan RC9 (versionCode)." >&2; return 1; }','installer bridge code')
          s=once(s,'  grep -q "versionName \'1.0.0-rc8\'" "$SRC/bridge/app/build.gradle" || { echo "Bridge staging bukan RC8 (versionName)." >&2; return 1; }','  grep -q "versionName \'1.0.0-rc9\'" "$SRC/bridge/app/build.gradle" || { echo "Bridge staging bukan RC9 (versionName)." >&2; return 1; }','installer bridge name')
          s=once(s,'run_quiet "Memasang Furina Core RC17" 44 prepare_core','run_quiet "Memasang Furina Core RC18" 44 prepare_core','installer label')
          s=once(s,'  printf \'\\033[2mRC17 sudah terpasang. Jalankan:\\033[0m  \\033[1;36mfurina\\033[0m\\n\'','  printf \'\\033[2mRC18 sudah terpasang. Jalankan:\\033[0m  \\033[1;36mfurina\\033[0m\\n\'','installer final text')
          install.write_text(s,encoding='utf-8')

          manifest=Path('experiments/furina-agent-final/manifest.json')
          m=json.loads(manifest.read_text(encoding='utf-8'))
          m['version']='1.0.0-rc18'
          m['bridge_version']='1.0.0-rc9'
          m['bridge_version_code']=10009
          m['bridge_release_base']='https://github.com/WynnDev-rill/furina/releases/download/furina-agent-v1.0.0-rc9'
          manifest.write_text(json.dumps(m,indent=2)+'\n',encoding='utf-8')

          wf=Path('.github/workflows/furina-agent-bridge-experiment.yml')
          w=wf.read_text(encoding='utf-8')
          w=once(w,'name: Build Furina Agent RC14 + Bridge RC8','name: Build Furina Agent RC18 + Bridge RC9','workflow name')
          w=once(w,'      - feature/furina-unbounded-chat-input-rc14\n','      - feature/furina-unbounded-chat-input-rc14\n      - agent/rc18-temporal-session-fix\n','workflow branch')
          w=once(w,'  group: furina-agent-rc14-${{ github.ref }}','  group: furina-agent-rc18-${{ github.ref }}','workflow concurrency')
          w=once(w,'      TAG: furina-agent-v1.0.0-rc8','      TAG: furina-agent-v1.0.0-rc9','workflow tag')
          w=once(w,'      APK_NAME: Furina-Agent-Bridge-v1.0.0-rc8.apk','      APK_NAME: Furina-Agent-Bridge-v1.0.0-rc9.apk','workflow apk')
          w=once(w,'      - name: Reassemble and layer Furina RC14','      - name: Reassemble and layer Furina RC18','workflow layer label')
          w=once(w,'          test "$(python3 -c \'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])\')" = "1.0.0-rc14"','          test "$(python3 -c \'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])\')" = "1.0.0-rc18"','workflow manifest core')
          w=once(w,'          test "$(python3 -c \'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])\')" = "1.0.0-rc8"','          test "$(python3 -c \'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])\')" = "1.0.0-rc9"','workflow manifest bridge')
          w=once(w,'          test "$(python3 -c \'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])\')" = "10008"','          test "$(python3 -c \'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])\')" = "10009"','workflow manifest bridge code')
          w=once(w,
              'apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py; do',
              'apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py apply-bridge-rc9.py apply-core-rc18.py; do',
              'workflow transform chain')
          w=once(w,'          grep -q \'VERSION = "1.0.0-rc14"\' "$ROOT/core/furina_agent/version.py"','          grep -q \'VERSION = "1.0.0-rc18"\' "$ROOT/core/furina_agent/version.py"','workflow core version grep')
          w=once(w,'          grep -q \'versionCode 10008\' "$ROOT/bridge/app/build.gradle"','          grep -q \'versionCode 10009\' "$ROOT/bridge/app/build.gradle"','workflow bridge code grep')
          w=once(w,'          grep -q "versionName \'1.0.0-rc8\'" "$ROOT/bridge/app/build.gradle"','          grep -q "versionName \'1.0.0-rc9\'" "$ROOT/bridge/app/build.gradle"','workflow bridge name grep')
          w=once(w,'      - name: Validate installer and Core RC14','      - name: Validate installer and Core RC18','workflow validate label')
          w=once(w,'          grep -q \'run_quiet "Memasang Furina Core RC14"\' "$META/install.sh"','          grep -q \'run_quiet "Memasang Furina Core RC18"\' "$META/install.sh"','workflow installer label grep')
          w=once(w,'          grep -q \'apply-core-rc14.py\' "$META/install.sh"','          grep -q \'apply-core-rc14.py\' "$META/install.sh"\n          grep -q \'apply-bridge-rc9.py\' "$META/install.sh"\n          grep -q \'apply-core-rc18.py\' "$META/install.sh"','workflow installer transform greps')
          w=once(w,'          grep -q "CORE_RC14_TRANSFORM_BLOB=\\"$(git hash-object "$META/overrides/apply-core-rc14.py")\\"" "$META/install.sh"','          grep -q "CORE_RC14_TRANSFORM_BLOB=\\"$(git hash-object "$META/overrides/apply-core-rc14.py")\\"" "$META/install.sh"\n          grep -q "BRIDGE_RC9_TRANSFORM_BLOB=\\"$(git hash-object "$META/overrides/apply-bridge-rc9.py")\\"" "$META/install.sh"\n          grep -q "CORE_RC18_TRANSFORM_BLOB=\\"$(git hash-object "$META/overrides/apply-core-rc18.py")\\"" "$META/install.sh"','workflow blob greps')
          w=once(w,'      - name: Build signed Bridge RC8','      - name: Build signed Bridge RC9','workflow build label')
          w=once(w,'          test "$CODE" = 10008','          test "$CODE" = 10009','workflow verify code')
          w=once(w,'          test "$NAME" = 1.0.0-rc8','          test "$NAME" = 1.0.0-rc9','workflow verify name')
          w=w.replace('furina-agent-v1.0.0-rc8/Furina-Agent-Bridge-v1.0.0-rc8.apk','furina-agent-v1.0.0-rc9/Furina-Agent-Bridge-v1.0.0-rc9.apk')
          w=once(w,'          name: Furina-Agent-Core-RC14-Bridge-RC8','          name: Furina-Agent-Core-RC18-Bridge-RC9','workflow artifact')
          w=once(w,'      - name: Publish isolated RC8 prerelease','      - name: Publish isolated RC9 prerelease','workflow publish label')
          w=once(w,'              --title "Furina Agent Bridge 1.0.0 RC8 — By Wynn" \\\n              --notes "Bridge RC8 provides Android-owned reminders and Normal/Shizuku/Root device control. Core RC14 keeps those capabilities and removes the chat composer character cap while adapting oversized messages to finite model context without truncating the stored original." \\\n',
              '              --title "Furina Agent Bridge 1.0.0 RC9 — By Wynn" \\\n              --notes "Bridge RC9 adds persistent, window-state-based Termux session timing. Core RC18 separates conversation gaps from actual time away and refuses to guess when Android timing evidence is unavailable." \\\n',
              'workflow release notes')
          # Add explicit temporal contract checks after the existing LocalVision check.
          marker="          grep -q 'LocalVision' \"$ROOT/core/furina_agent/routing.py\"\n"
          checks=marker + "          grep -q 'termux_session' \"$ROOT/core/furina_agent/events.py\"\n          grep -q 'durasi keluar Termux TERAKHIR' \"$ROOT/core/furina_agent/chat.py\"\n          grep -q 'furina_termux_session_v1' \"$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java\"\n"
          w=once(w,marker,checks,'workflow temporal checks')
          wf.write_text(w,encoding='utf-8')
          PY

          bash -n experiments/furina-agent-final/install.sh
          git diff --check

      - name: Commit release wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rc18-temporal-selfpatch.yml
          git config user.name "Wynn Dev"
          git config user.email "indonesiafilmku@gmail.com"
          git add experiments/furina-agent-final/install.sh experiments/furina-agent-final/manifest.json .github/workflows/furina-agent-bridge-experiment.yml .github/workflows/rc18-temporal-selfpatch.yml
          git commit -m "Wire RC18 temporal session release"
          git push origin HEAD:agent/rc18-temporal-session-fix
