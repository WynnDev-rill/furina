name: Furina Final Product Audit

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-final-audit.yml'
  workflow_dispatch:

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate private 1.1.14 build
        run: |
          set -euo pipefail
          validation_home="$(mktemp -d)"
          HOME="$validation_home" FURINA_HOME="$validation_home" bash experiments/furina-agent-final/overrides/private-1.1.5/validate.sh
      - name: Run final 1.1.14 engineering audit
        run: |
          set -euo pipefail
          STAGE=/tmp/furina-agent-rc54-validate/termux
          PYTHONPATH="$STAGE/core" python3 - <<'PY'
          import ast,json
          from pathlib import Path
          stage=Path('/tmp/furina-agent-rc54-validate/termux'); core=stage/'core/furina_agent'; app=stage/'bridge/app'
          blockers=[]; warnings=[]
          for p in core.glob('*.py'):
              try: ast.parse(p.read_text(encoding='utf-8'),filename=str(p))
              except Exception as e: blockers.append(f'{p.name}: {e}')
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          expected={'version':'1.1.14','bridge_version':'1.1.14','bridge_version_code':10082,'dependency_revision':'2026.08.25-r64','bundle_id':'furina-2026.08.25-private-1.1.14','runtime_contract':'furina-runtime/v16-personality-matrix-hub-runtime'}
          for k,v in expected.items():
              if m.get(k)!=v: blockers.append(f'manifest {k}={m.get(k)!r}, expected {v!r}')
          from furina_agent.personality import TRAITS,TRAIT_IDS,compile_personality
          if len(TRAITS)!=20 or len(TRAIT_IDS)!=20: blockers.append('personality catalog is not exactly 20 traits')
          if len(compile_personality(TRAIT_IDS))>=2600: blockers.append('20-trait compiled prompt is unbounded')
          page=(app/'src/main/assets/furinahub/index.html').read_text(encoding='utf-8'); java=(app/'src/main/java/com/wynndev/furinaagentbridge/MainActivity.java').read_text(encoding='utf-8'); hub=(core/'hub.py').read_text(); chat=(core/'chat.py').read_text(); dialog=(core/'dialogue_state.py').read_text()
          for token in ('personalityTraitGrid110','togglePersonality110',"action:'select',catalog_id:catalogId",'/api/chat/progress'):
              if token not in page: blockers.append(f'Hub surface missing {token}')
          if 'FURINA_FINAL_112_UI' not in page or 'function renderAgent(){}' not in page: blockers.append('final chat-only Hub override missing')
          if 'FURINA_FINAL_114_AUTHORITATIVE_BUNDLE_STATE' not in hub: blockers.append('authoritative bundle state missing')
          if 'state.optBoolean("bundle_synced", false)' not in java or 'APK FurinaHub belum dipasang' in java: blockers.append('Android false APK-missing diagnosis remains')
          if 'handler.post(this::notifyShellConnection);' not in java or 'setConnection("mismatch"' in java: blockers.append('metadata mismatch can still overwrite a healthy pairing')
          if 'bridgeUpdater = new BridgeUpdater' in java or 'bridgeUpdater.onResume()' in java: blockers.append('Android updater still active')
          if 'Runtime._queue_auto_title = _queue_auto_title_110' not in hub: blockers.append('deterministic title runtime missing')
          if 'BALASAN FURINA LAMA: tidak diperlukan' not in dialog: blockers.append('assistant-pattern reset missing')
          if 'conversation_pacing' not in chat: blockers.append('adaptive pacing missing')
          ids=[x['id'] for x in m['local_model_catalog']]
          if ids!=['wifugpt-1.7b-q4km','qwen3-1.7b-heretic-q5km','qwen3-4b-2507-uncensored-q4km']: blockers.append('local model catalog changed unexpectedly')
          print(f'Python modules checked: {len(list(core.glob("*.py")))}')
          print(f'Blockers: {len(blockers)}')
          print(f'Warnings: {len(warnings)}')
          for x in blockers: print('BLOCKER',x)
          for x in warnings: print('WARNING',x)
          if blockers: raise SystemExit(1)
          print('FURINA_PRIVATE_1_1_0_AUDIT_OK')
          PY
          git diff --check
