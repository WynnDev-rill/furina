name: Furina Final Product Audit

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-final-audit.yml'
  workflow_dispatch:

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate private 1.0.8 build
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/private-1.0.8/validate.sh
      - name: Run final 1.0.8 engineering audit
        run: |
          set -euo pipefail
          python3 experiments/furina-agent-final/dialogue-state-audit.py /tmp/furina-agent-rc54-validate/termux
          git diff --check
