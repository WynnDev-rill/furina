name: Furina Final Product Audit

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/**'
      - '.github/workflows/furina-final-audit.yml'
  workflow_dispatch:

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate Termux 1.1.28 build
        run: |
          set -euo pipefail
          validation_home="$(mktemp -d)"
          HOME="$validation_home" FURINA_HOME="$validation_home" bash experiments/furina-agent-final/overrides/private-1.2.9/validate.sh
      - name: Run final Termux engineering audit
        run: |
          set -euo pipefail
          STAGE=/tmp/furina-agent-rc54-validate/termux
          PYTHONPATH="$STAGE/core" python3 - <<'PY'
          import ast,json
          from pathlib import Path
          stage=Path('/tmp/furina-agent-rc54-validate/termux'); core=stage/'core/furina_agent'
          blockers=[]; warnings=[]
          for p in core.glob('*.py'):
              try: ast.parse(p.read_text(encoding='utf-8'),filename=str(p))
              except Exception as e: blockers.append(f'{p.name}: {e}')
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          expected={'version':'1.1.28','dependency_revision':'2026.08.29-r78','bundle_id':'furina-2026.08.29-termux-1.1.28','runtime_contract':'furina-runtime/v29-adaptive-human-dialogue-termux','update_client_version':'1.4.3','hub_update_ownership':'retired-not-distributed'}
          for k,v in expected.items():
              if m.get(k)!=v: blockers.append(f'manifest {k}={m.get(k)!r}, expected {v!r}')
          from furina_agent.personality import TRAITS,TRAIT_IDS,compile_personality
          if len(TRAITS)!=20 or len(TRAIT_IDS)!=20: blockers.append('personality catalog is not exactly 20 traits')
          if len(compile_personality(TRAIT_IDS))>=2600: blockers.append('20-trait compiled prompt is unbounded')
          memory=(core/'memory.py').read_text(); chat=(core/'chat.py').read_text(); dialog=(core/'dialogue_state.py').read_text(); tui=(core/'tui.py').read_text(); models=(core/'local_models.py').read_text()
          for token in ('user_message_fts','search_conversation_context','bm25(user_message_fts)'):
              if token not in memory: blockers.append(f'indexed recall missing {token}')
          if 'FURINA_TERMUX_118_DIALOGUE_STATE' not in chat: blockers.append('natural dialogue state missing')
          if 'FURINA_TERMUX_118_EVIDENCE_LINKED_MEMORY' not in memory: blockers.append('evidence-linked memory missing')
          if 'FURINA_TERMUX_118_RESPONSE_RHYTHM' not in (core/'response.py').read_text(): blockers.append('response rhythm controller missing')
          if 'FURINA_TERMUX_118_TRAIT_STATE_CONTROLLER' not in (core/'personality.py').read_text(): blockers.append('trait state controller missing')
          if 'FURINA_TERMUX_119_COMPANION_ENGINE' not in chat: blockers.append('opt-in companion engine missing')
          if 'FURINA_TERMUX_119_FULL_LOCAL_ARCHIVE' not in memory: blockers.append('full local archive missing')
          if 'FURINA_TERMUX_119_BEHAVIORAL_TRAIT_ENGINE' not in (core/'personality.py').read_text(): blockers.append('behavioral trait actions missing')
          if 'FURINA_TERMUX_120_SYNTHESIZED_PERSONALITY' not in (core/'personality.py').read_text(): blockers.append('synthesized personality missing')
          if 'FURINA_TERMUX_120_EVIDENCE_MEMORY' not in memory: blockers.append('evidence memory v2 missing')
          if 'FURINA_TERMUX_120_DIALOGUE_DECISION_ENGINE' not in chat: blockers.append('dialogue decision engine missing')
          if 'FURINA_TERMUX_121_TRAINING_PREFERENCE_RUNTIME' not in chat: blockers.append('Training Room preference runtime missing')
          if 'FURINA_TERMUX_121_TRAINING_ROOM' not in tui: blockers.append('Training Room TUI missing')
          training=(core/'training_room.py').read_text()
          if 'from .memory' in training or 'import furina_agent.memory' in training: blockers.append('Training Room is not isolated from real memory')
          if 'FURINA_TERMUX_125_NEUTRAL_CORPUS' not in training: blockers.append('neutral corpus Training Room missing')
          if 'FURINA_TERMUX_125_LIVE_TRAINING_COMMIT' not in chat: blockers.append('single-commit live preference path missing')
          if 'FURINA_TERMUX_125_NEUTRAL_TRAINING_TUI' not in tui: blockers.append('horizontal neutral Training Room TUI missing')
          corpus=core/'training_corpus.py'
          if not corpus.is_file() or 'CorpusItem("c090"' not in corpus.read_text(encoding='utf-8'): blockers.append('curated conversation corpus too small')
          surface=(core/'chat_surface.py').read_text()
          if 'class LiveChoiceScreen' not in surface or 'self._live_offers = 0' not in surface: blockers.append('bounded live choice carousel missing')
          if 'FURINA_TERMUX_116_DELETE_MODEL' not in models: blockers.append('safe local-model delete missing')
          if 'FURINA_TERMUX_126_ROLEPLAY_CUSTOM_TRAITS_UI' not in tui: blockers.append('roleplay and custom-trait UI missing')
          if 'FURINA_TERMUX_126_WHOLE_TRAIT_ENGINE' not in (core/'personality.py').read_text(): blockers.append('whole-trait personality engine missing')
          if 'FURINA_TERMUX_126_CONTINUITY_CAPSULE' not in memory: blockers.append('cross-session continuity capsule missing')
          if 'FURINA_TERMUX_126_PRIVATE_REASONING' not in (core/'providers.py').read_text(): blockers.append('online reasoning boundary missing')
          if 'BALASAN FURINA LAMA: tidak diperlukan' not in dialog: blockers.append('assistant-pattern reset missing')
          if 'conversation_pacing' not in chat: blockers.append('adaptive pacing missing')
          ids=[x['id'] for x in m['local_model_catalog']]
          if ids!=['wifugpt-1.7b-q4km','qwen3-1.7b-heretic-q5km','qwen3-4b-2507-uncensored-q4km']: blockers.append('local model catalog changed unexpectedly')
          print(f'Python modules checked: {len(list(core.glob("*.py")))}')
          print(f'Blockers: {len(blockers)}')
          print(f'Warnings: {len(warnings)}')
          for x in blockers: print('BLOCKER',x)
          for x in warnings: print('WARNING',x)
          if blockers: raise SystemExit(1)
          print('FURINA_TERMUX_121_AUDIT_OK')
          PY
          git diff --check
