name: Furina Engineering OS

on:
  workflow_dispatch:
  push:
    branches:
      - company/staging
    paths:
      - 'engineering/integration/checkpoints/**'
  pull_request:
    paths:
      - 'android-wrapper/**'
      - 'scripts/**'
      - 'engineering/**'
      - '.github/workflows/furina-engineering-os.yml'
      - '.github/workflows/build-furina-apk.yml'
      - '.github/workflows/publish-furina-update.yml'
      - '.gitignore'
      - '.env.example'

permissions:
  contents: read

jobs:
  validate-company:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate public repository safety
        run: python3 scripts/public-repo-safety-gate.py

      - name: Validate Engineering OS JSON
        run: |
          python3 -m json.tool engineering/metrics/baseline.json >/dev/null
          python3 -m json.tool engineering/evals/companion-scenarios.json >/dev/null
          python3 -m json.tool engineering/evidence/device-report.schema.json >/dev/null
          python3 -m json.tool engineering/evidence/behavioral-run.schema.json >/dev/null
          python3 -m json.tool engineering/calibration/record.schema.json >/dev/null
          python3 -m json.tool engineering/review/decision.schema.json >/dev/null
          python3 -m json.tool engineering/boss/decision.schema.json >/dev/null
          python3 -m json.tool engineering/work-queue/schema.json >/dev/null
          python3 -m json.tool engineering/work-queue/state.json >/dev/null
          python3 -m json.tool engineering/integration/checkpoint.schema.json >/dev/null

      - name: Validate human-gated engineering authority
        run: python3 scripts/furina-human-gate-policy.py

      - name: Validate approved FUR-ENG-008 through 013 package
        run: python3 scripts/fur-eng-008-013-gate.py

      - name: Validate approved FUR-ENG-014 through 018 package
        run: python3 scripts/fur-eng-014-018-gate.py

      - name: Validate native updater contract
        run: python3 scripts/updater-regression-gate.py

      - name: Test decision semantics
        run: python3 scripts/furina-decision-gate.py self-test

      - name: Compile active control-plane scripts
        run: |
          python3 -m py_compile \
            scripts/public-repo-safety-gate.py \
            scripts/furina-human-gate-policy.py \
            scripts/fur-eng-008-013-gate.py \
            scripts/fur-eng-014-018-gate.py \
            scripts/updater-regression-gate.py \
            scripts/updater-manifest-gate.py \
            scripts/furina-company-policy-gate.py \
            scripts/furina-decision-gate.py

      - name: Run deterministic architecture audit
        run: python3 scripts/furina-company-audit.py | tee furina-company-audit.json

      - name: Run existing companion quality gate
        run: python3 scripts/companion-quality-gate.py

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: furina-company-audit
          path: furina-company-audit.json
