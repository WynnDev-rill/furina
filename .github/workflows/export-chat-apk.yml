name: Export current Furina APK for chat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-chat-apk.yml'

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for exact stable APK build and publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 8ee556de7d0c8a7ce26d3e919659daf86f4a7541
          RELEASE_TAG: chat-apk-1.7b-20260823
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          RUN_NUMBER=""
          for i in $(seq 1 80); do
            JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-furina-apk.yml/runs?head_sha=${TARGET_SHA}&event=push&per_page=10")"
            RUN_ID="$(jq -r '.workflow_runs[0].id // empty' <<<"$JSON")"
            RUN_NUMBER="$(jq -r '.workflow_runs[0].run_number // empty' <<<"$JSON")"
            STATUS="$(jq -r '.workflow_runs[0].status // empty' <<<"$JSON")"
            CONCLUSION="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$JSON")"
            if [ -n "$RUN_ID" ] && [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" != "success" ]; then
                echo "Stable APK build $RUN_ID completed with $CONCLUSION" >&2
                exit 1
              fi
              break
            fi
            sleep 15
          done
          test -n "$RUN_ID"
          test -n "$RUN_NUMBER"
          JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
          ARTIFACT_ID="$(jq -r '.artifacts[] | select(.name | startswith("Furina-Stable-")) | .id' <<<"$JSON" | head -n1)"
          test -n "$ARTIFACT_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > furina-artifact.zip
          rm -rf apk && mkdir apk
          unzip -q furina-artifact.zip -d apk
          APK="$(find apk -type f -name 'Furina-Stable.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" Furina-1.7B.apk
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Furina-1.7B.apk --clobber
          else
            gh release create "$RELEASE_TAG" Furina-1.7B.apk \
              --target "$TARGET_SHA" \
              --title "Furina 1.7B test APK" \
              --notes "Temporary direct-download build for testing wifuGPT 1.7B and Qwen3 1.7B Heretic."
          fi
          printf 'run_id=%s\nrun_number=%s\nasset=https://github.com/%s/releases/download/%s/Furina-1.7B.apk\n' \
            "$RUN_ID" "$RUN_NUMBER" "$GITHUB_REPOSITORY" "$RELEASE_TAG" > chat-apk-export-ready.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chat-apk-export-ready.txt
          git commit -m "Publish Furina 1.7B chat APK marker"
          git push
