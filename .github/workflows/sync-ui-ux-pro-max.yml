name: Sync UI UX Pro Max

on:
  workflow_dispatch:
  push:
    branches:
      - agent/rc36-offline-shell
      - experiment/furina-agent-termux
    paths:
      - '.github/workflows/sync-ui-ux-pro-max.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI UX Pro Max v2.15.0 into repository
        shell: bash
        run: |
          set -euo pipefail
          npm install --global ui-ux-pro-max-cli@2.15.0
          uipro init --ai universal
          test -f .agents/skills/ui-ux-pro-max/SKILL.md
          find .agents/skills -mindepth 1 -maxdepth 1 ! -name ui-ux-pro-max -exec rm -rf {} +
          mkdir -p .agents/skills/ui-ux-pro-max
          : > .agents/skills/ui-ux-pro-max/.furinahub-vendor-marker
          cat > .agents/skills/ui-ux-pro-max/UPSTREAM.md <<'EOF'
          # UI UX Pro Max

          Repository-scoped installation generated with `ui-ux-pro-max-cli@2.15.0`.

          Upstream: `nextlevelbuilder/ui-ux-pro-max-skill` (MIT License).
          Refresh with this workflow or `uipro update` from a checkout.
          EOF
      - name: Commit generated skill files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .agents/skills
          if git diff --cached --quiet; then
            echo 'UI UX Pro Max already synchronized.'
            exit 0
          fi
          git commit -m 'Scope vendored UI UX Pro Max skill'
          git push origin HEAD:${{ github.ref_name }}
