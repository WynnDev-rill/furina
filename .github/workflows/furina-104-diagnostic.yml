name: Furina Grounded Dialogue Regression

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - '.github/workflows/furina-104-diagnostic.yml'
      - 'experiments/furina-agent-final/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate dialogue state, session isolation, shared memory, and model-generated chat
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/private-1.0.8/validate.sh
          python3 experiments/furina-agent-final/dialogue-state-audit.py /tmp/furina-agent-rc54-validate/termux
          git diff --check
