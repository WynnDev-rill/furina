name: Furina Local Conversation Quality Regression

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - '.github/workflows/furina-104-diagnostic.yml'
      - 'experiments/furina-agent-final/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate local chat quality, session isolation, and shared memory
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/private-1.0.7/validate.sh
          python3 experiments/furina-agent-final/conversation-quality-audit.py /tmp/furina-agent-rc54-validate/termux
          git diff --check
