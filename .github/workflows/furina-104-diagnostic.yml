name: Furina Grounded Dialogue Regression

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - '.github/workflows/furina-104-diagnostic.yml'
      - 'experiments/furina-agent-final/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate dialogue grounding, session isolation, shared memory and adaptive personality
        run: |
          set -euo pipefail
          validation_home="$(mktemp -d)"
          HOME="$validation_home" FURINA_HOME="$validation_home" bash experiments/furina-agent-final/overrides/private-1.3.0/validate.sh
          STAGE=/tmp/furina-agent-rc54-validate/termux
          PYTHONPATH="$STAGE/core" python3 - <<'PY'
          import json
          from pathlib import Path
          from furina_agent.personality import TRAIT_IDS, compile_personality

          stage=Path('/tmp/furina-agent-rc54-validate/termux')
          core=stage/'core/furina_agent'
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          assert m['version']=='1.1.29'
          assert m['termux_conversation_scope'].startswith('fresh-short-term-thread')
          assert m['shared_workspace'].startswith('single-local-core')
          assert m['memory_truth_policy'].startswith('explicit-direct')
          assert m['dialogue_grounding'].startswith('assistant-output-is-continuity-not-user-fact')
          assert m['conversation_pacing'].startswith('explicit-preference-first')
          assert m['local_model_response_policy'].startswith('selected-model-generates-every-conversational-turn')
          assert len(TRAIT_IDS)==20
          assert len(compile_personality(TRAIT_IDS)) < 2600

          dialogue=(core/'dialogue_state.py').read_text(encoding='utf-8')
          chat=(core/'chat.py').read_text(encoding='utf-8')
          persona=(core/'persona.py').read_text(encoding='utf-8')
          for token in ('BALASAN FURINA LAMA: tidak diperlukan','clarification_target','rejected_or_corrected'):
              assert token in dialogue, token
          assert 'conversation_pacing' in chat
          assert 'personalization_prompt' in chat
          assert 'FURINA_TERMUX_118_DIALOGUE_STATE' in chat
          memory=(core/'memory.py').read_text(encoding='utf-8')
          assert 'search_conversation_context' in memory
          assert 'FURINA_TERMUX_118_EVIDENCE_LINKED_MEMORY' in memory
          assert 'FURINA_TERMUX_118_RESPONSE_RHYTHM' in (core/'response.py').read_text(encoding='utf-8')
          assert 'FURINA_TERMUX_119_COMPANION_ENGINE' in chat
          assert 'FURINA_TERMUX_119_FULL_LOCAL_ARCHIVE' in memory
          assert 'FURINA_TERMUX_119_BEHAVIORAL_TRAIT_ENGINE' in (core/'personality.py').read_text(encoding='utf-8')
          assert 'FURINA_TERMUX_120_SYNTHESIZED_PERSONALITY' in (core/'personality.py').read_text(encoding='utf-8')
          assert 'FURINA_TERMUX_120_EVIDENCE_MEMORY' in memory
          assert 'FURINA_TERMUX_120_DIALOGUE_DECISION_ENGINE' in chat
          assert 'FURINA_TERMUX_121_TRAINING_PREFERENCE_RUNTIME' in chat
          assert (core/'training_room.py').is_file()
          assert 'FURINA_TERMUX_125_NEUTRAL_CORPUS' in (core/'training_room.py').read_text(encoding='utf-8')
          assert 'class LiveChoiceScreen' in (core/'chat_surface.py').read_text(encoding='utf-8')
          assert 'FURINA_TERMUX_126_FINAL_BEHAVIOR_KERNEL' in chat
          assert 'FURINA_TERMUX_126_CONTINUITY_CAPSULE' in memory
          assert 'FURINA_TERMUX_126_PRIVATE_REASONING' in (core/'providers.py').read_text(encoding='utf-8')
          assert (core/'training_corpus.py').is_file()
          assert 'fast_social' not in chat.lower()
          assert 'repair_generation' not in chat.lower()
          assert 'tsundere/playful sebagai default' not in persona.lower()
          print('FURINA_110_GROUNDED_DIALOGUE_REGRESSION_OK')
          PY
          git diff --check
