name: RC25 general UI diagnostic
on:
  push:
    branches: [fix/furina-agent-rc25-general-ui-state]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble final RC25 and validate state execution
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve(); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY
          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py apply-bridge-rc9.py apply-core-rc18.py apply-ui-performance-bridge-rc10.py apply-ui-performance-rc19.py apply-reactive-bridge-rc11.py apply-reactive-core-rc20.py apply-reactive-bridge-rc12.py apply-reactive-core-rc21.py apply-bridge-rc13.py apply-system-rc22.py apply-safety-rc22.py apply-semantic-core-rc23.py apply-semantic-guard-rc23.py apply-lifecycle-core-rc24.py apply-bridge-rc14.py apply-stateful-core-rc25.py apply-stateful-bridge-rc15.py; do python3 "$META/overrides/$f" "$ROOT"; done
          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc25"' "$ROOT/core/furina_agent/version.py"
          grep -q 'versionCode 10015' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc15'" "$ROOT/bridge/app/build.gradle"
          grep -q 'transition_not_observed' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'fastEditableRoleScore' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'task_started_wall = time.time()' "$ROOT/core/furina_agent/agent.py"
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          from furina_agent.agent import AndroidAgent
          from furina_agent.companion import CompanionSession
          apps=[{'label':'WhatsApp','package':'com.whatsapp'}]
          raw=[
            {'type':'open_app','app':'WhatsApp','package':'com.whatsapp'},
            {'type':'search','query':'Ariel'},
            {'type':'select','target':'Ariel'},
            {'type':'type','text':'test furina','field_role':'message'},
            {'type':'send'}
          ]
          normalized=CompanionSession._normalize_semantic_steps(raw, apps)
          agent=AndroidAgent.__new__(AndroidAgent)
          sequence=agent._compile_semantic_sequence(normalized, apps)
          assert [x['type'] for x in sequence] == ['open_app','tap_text','set_text_best','ime_best','tap_text','set_text_best'], sequence
          assert sequence[2]['role']=='search'
          assert sequence[4]['target']=='Ariel' and sequence[4]['require_change'] is True
          assert sequence[5]['role']=='message' and sequence[5]['text']=='test furina'
          action,summary,detail=agent._semantic_send_action(normalized)
          assert action and action['role']=='send' and action['_external'] is True
          assert 'Ariel' in summary and 'test furina' in detail
          # Send must never be part of the unconfirmed continuous prefix.
          assert not any(x.get('_external') for x in sequence)
          print('RC25_STATEFUL_SEMANTIC_SMOKE_OK')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Bridge RC15
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug
