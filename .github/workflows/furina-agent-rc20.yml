name: Build Furina Agent RC23 + Bridge RC13 Compatibility

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: furina-agent-rc23-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and validate RC23
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc23"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc13"

          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve(); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py apply-bridge-rc9.py apply-core-rc18.py apply-ui-performance-bridge-rc10.py apply-ui-performance-rc19.py apply-reactive-bridge-rc11.py apply-reactive-core-rc20.py apply-reactive-bridge-rc12.py apply-reactive-core-rc21.py apply-bridge-rc13.py apply-system-rc22.py apply-safety-rc22.py apply-semantic-core-rc23.py apply-semantic-guard-rc23.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc23"' "$ROOT/core/furina_agent/version.py"
          grep -q 'semantic intent parser Android internal' "$ROOT/core/furina_agent/companion.py"
          grep -q '_compile_semantic_sequence' "$ROOT/core/furina_agent/agent.py"
          grep -q 'semantic_steps=intent.steps' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'semantic_steps=intent.steps' "$ROOT/core/furina_agent/tui.py"

          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          from furina_agent.direct_control import DirectDeviceControl
          from furina_agent.companion import CompanionSession
          from furina_agent.agent import AndroidAgent
          class Cfg: device_control_mode='normal'
          class Store:
              def log_event(self,*a,**k): pass
          class Bridge:
              def __init__(self): self.calls=[]
              def apps(self): return {'apps':[{'label':'Google','package':'com.google.android.googlequicksearchbox'},{'label':'YouTube','package':'com.google.android.youtube'}]}
              def control(self,a): self.calls.append(a); return {'ok':True}
              def action(self,a): self.calls.append(a); return {'ok':True}
              def screen(self): return {'nodes':[]}
          bridge=Bridge(); direct=DirectDeviceControl(Cfg(),Store(),bridge)
          assert not direct.try_execute('buka google dan cari makanan sehat').handled
          assert direct.try_execute('buka google').handled
          apps=bridge.apps()['apps']
          assert CompanionSession._resolve_app_hint('Gogle', apps) == 'com.google.android.googlequicksearchbox'
          steps=CompanionSession._normalize_semantic_steps([{'type':'open_app','app':'Gogle'},{'type':'search','query':'makanan sehat'}], apps)
          agent=AndroidAgent.__new__(AndroidAgent)
          sequence=agent._compile_semantic_sequence(steps, apps)
          assert [x['type'] for x in sequence] == ['open_app','tap_text','set_text_best','ime_best']
          assert sequence[2]['text'] == 'makanan sehat'
          print('RC23_SEMANTIC_INTENT_SMOKE_OK')
          PY

      - name: Validate updater contract
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          python3 -m py_compile "$META/overrides/apply-semantic-core-rc23.py" "$META/overrides/apply-semantic-guard-rc23.py"
          test "$(git hash-object "$META/overrides/apply-semantic-core-rc23.py")" = "9f339191a3b0ddab2b89f0690e019b63552fe377"
          test "$(git hash-object "$META/overrides/apply-semantic-guard-rc23.py")" = "a1bbd134c2b2424465e1b85fbc478ad20f9ea0ea"
          bash -n "$META/install.sh"
          grep -q 'VERSION="1.0.0-rc23"' "$META/install.sh"
          grep -q 'RC23_GUARD_BLOB="a1bbd134c2b2424465e1b85fbc478ad20f9ea0ea"' "$META/install.sh"
          grep -q 'installed_code >= expected_code' "$META/install.sh"
          grep -q 'Bridge sudah sesuai · tanpa download' "$META/install.sh"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify unchanged Bridge RC13 still builds
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :bridge:app:assembleDebug
          grep -q 'versionCode 10013' bridge/app/build.gradle
          grep -q "versionName '1.0.0-rc13'" bridge/app/build.gradle
