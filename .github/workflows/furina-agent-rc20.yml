name: Build Furina Agent RC29 + Bridge RC16

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-agent-rc29-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: furina-agent-v1.0.0-rc16
  APK_NAME: Furina-Agent-Bridge-v1.0.0-rc16.apk
  EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and validate RC29 + Bridge RC16
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc29"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc16"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])')" = "10016"

          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve(); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py apply-bridge-rc9.py apply-core-rc18.py apply-ui-performance-bridge-rc10.py apply-ui-performance-rc19.py apply-reactive-bridge-rc11.py apply-reactive-core-rc20.py apply-reactive-bridge-rc12.py apply-reactive-core-rc21.py apply-bridge-rc13.py apply-system-rc22.py apply-safety-rc22.py apply-semantic-core-rc23.py apply-semantic-guard-rc23.py apply-lifecycle-core-rc24.py apply-bridge-rc14.py apply-stateful-core-rc25.py apply-stateful-core-rc25-postfix.py apply-stateful-bridge-rc15.py apply-stateful-bridge-rc15-postfix.py apply-semantic-resilience-rc26.py apply-runtime-recovery-rc27.py apply-runtime-core-rc28.py apply-universal-ui-core-rc29.py apply-universal-ui-bridge-rc16.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc29"' "$ROOT/core/furina_agent/version.py"
          grep -q '"result_mode": True' "$ROOT/core/furina_agent/agent.py"
          grep -q 'optional_if_target_visible' "$ROOT/core/furina_agent/agent.py"
          grep -q 'SEMANTIC_STEPS:' "$ROOT/core/furina_agent/agent.py"
          grep -q 'duplicate_suppressed' "$ROOT/core/furina_agent/agent.py"
          grep -q 'ACTION_SET_SELECTION' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'fastActionScore' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'result_mode' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'optional_if_target_visible' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'versionCode 10016' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc16'" "$ROOT/bridge/app/build.gradle"

      - name: Run RC29 universal UI state regressions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/furina-agent-src/termux
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          from furina_agent.agent import AndroidAgent
          from furina_agent.companion import CompanionSession

          command='buka wa,cari kontak ariel dan kirim pesan test furina'
          apps=[
              {'label':'WhatsApp','package':'com.whatsapp'},
              {'label':'Telegram','package':'org.telegram.messenger'},
              {'label':'YouTube','package':'com.google.android.youtube'},
          ]
          raw=[
              {'type':'open_app','app':'wa','package':'com.whatsapp'},
              {'type':'search','query':'Ariel'},
              {'type':'select','target':'Ariel'},
              {'type':'type','text':'test furina','field_role':'message'},
              {'type':'send'},
          ]

          agent=AndroidAgent.__new__(AndroidAgent)
          seq=agent._compile_semantic_sequence(raw,apps)
          kinds=[x['type'] for x in seq]
          assert kinds == ['open_app','tap_text','set_text_best','ime_best','tap_text','set_text_best'], seq
          assert seq[2]['role']=='search' and seq[2]['text']=='Ariel'
          assert seq[3]['optional_if_target_visible']=='Ariel' and seq[3]['result_mode'] is True
          assert seq[4]['target']=='Ariel' and seq[4]['result_mode'] is True and seq[4]['require_change'] is True
          assert seq[5]['role']=='message' and seq[5]['text']=='test furina'

          # Generic exact-text guard: if the query is already in an editable,
          # a planner retry can be suppressed instead of producing arielariel.
          screen={'nodes':[{'id':1,'text':'Ariel','editable':True,'focused':True}]}
          assert AndroidAgent._screen_has_exact_editable_text(screen,'Ariel')
          assert not AndroidAgent._screen_has_exact_editable_text(screen,'Ariel2')

          # Risk must use actual node metadata, not just planner JSON. A node
          # called Kirim is external; an ordinary result row remains navigation.
          send_screen={'nodes':[{'id':7,'text':'Kirim','clickable':True}]}
          risk,reason=agent.risk(send_screen,{'type':'tap_node','node':7})
          assert risk=='external', (risk,reason)
          contact_screen={'nodes':[{'id':8,'text':'Ariel','clickable':True}]}
          risk,_=agent.risk(contact_screen,{'type':'tap_node','node':8})
          assert risk=='navigate', risk

          # The structural fallback remains app-inventory-backed and general.
          assert CompanionSession._resolve_app_hint('wa',apps)=='com.whatsapp'
          parsed=CompanionSession._fallback_device_steps(command,apps)
          assert [x['type'] for x in parsed]==['open_app','search','select','type','send'], parsed

          source=open(__import__('furina_agent.agent').agent.__file__,encoding='utf-8').read()
          assert 'JANGAN pilih field editable/focused pencarian' in source
          assert 'Jangan ulangi open_app, query pencarian, atau set_text' in source
          assert 'self._active_semantic_steps' in source
          print('RC29_UNIVERSAL_UI_STATE_OK')
          PY

      - name: Validate updater and transform integrity
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          python3 -m py_compile "$META/overrides/apply-universal-ui-core-rc29.py" "$META/overrides/apply-universal-ui-bridge-rc16.py"
          CORE_HASH="$(git hash-object "$META/overrides/apply-universal-ui-core-rc29.py")"
          BRIDGE_HASH="$(git hash-object "$META/overrides/apply-universal-ui-bridge-rc16.py")"
          test "$CORE_HASH" = "eb0a507da074d280f2f263ae70e3c0e4e2afd220"
          test "$BRIDGE_HASH" = "86c5ee2018acfad2a7277747bfb12c9b0642563f"
          bash -n "$META/install.sh"
          grep -q 'VERSION="1.0.0-rc29"' "$META/install.sh"
          grep -q "RC29_BLOB=\"$CORE_HASH\"" "$META/install.sh"
          grep -q 'Manifest RC29 terverifikasi' "$META/install.sh"
          grep -q 'Core RC29 aktif' "$META/install.sh"
          grep -q 'Memeriksa Bridge RC16' "$META/install.sh"
          grep -q 'installed_code >= expected_code' "$META/install.sh"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Bridge RC16 on PR
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Restore Bridge signing identity
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed Bridge RC16
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-src/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$FURINA_KEYSTORE_PASSWORD" && test -n "$FURINA_KEY_ALIAS" && test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify and publish RC16
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-src/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$($APKANALYZER manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$($APKANALYZER manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$($APKANALYZER manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$($APKSIGNER verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10016
          test "$NAME" = 1.0.0-rc16
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            'version':os.environ['NAME'],
            'version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],
            'sha256':os.environ['SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'apk_url':'https://github.com/WynnDev-rill/furina/releases/download/furina-agent-v1.0.0-rc16/Furina-Agent-Bridge-v1.0.0-rc16.apk'
          }
          open('bridge.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" bridge.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" bridge.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Furina Agent Bridge 1.0.0 RC16 — By Wynn" \
              --notes "RC16 makes UI execution state-aware across apps: exact idempotent text replacement, result-row selection that excludes editable/IME nodes, live-search readiness, and safer semantic action targeting."
          fi
