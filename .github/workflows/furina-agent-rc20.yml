name: Validate Furina Agent RC33 Psyche + RC32 Policy

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: furina-agent-rc33-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea
  RC31_CORE_BLOB: 8ce33b8a81feb379f6187583f350b4bf3097268c
  RC32_CORE_BLOB: 3f8869288010512f764eb094e1be5e4291420c69
  RC18_BRIDGE_BLOB: 7d3472c32fb4ff8a31dfc6a5c8f0a96b78978b4e
  RC33_APPLY_BLOB: a2850609b156cd10c1b81272c8b8dac18e1f6d74
  RC33_PSYCHE_BLOB: 86511776ef51929dc59aedecf7a11fc16a7823ad
  RC33_CHAT_BLOB: eca023f64be0c39e9ad2f9d518c2dfdb0c46a68d
  RC33_PERSONA_BLOB: 8d16d8c9df8afd29821c415f2f6ae33f9962ba8e
  RC33_RESPONSE_BLOB: 0947dcf577853f497fb6281a5d5d3e55fae76e30
  RC33_MIND_BLOB: 223bd9c3663ca1974513059207c2f7a33f5c2d6c
  RC33_ROUTING_BLOB: fca98541d9fec5d777b89427d6f398f9a8dddb4f

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble effective Core through RC30
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do
            base64 --decode "$chunk" >> "$ARCHIVE"
          done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -

          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc33"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc18"

          rm -rf /tmp/furina-agent-src
          mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux

          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"

          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib, json, pathlib, sys
          src=pathlib.Path(sys.argv[1]).resolve()
          dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes()
              assert blob_sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve()
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

          for f in \
            apply-bridge-rc4.py \
            apply-universal-agent-rc5.py \
            apply-core-rc6.py \
            apply-core-rc6-postfix.py \
            apply-bridge-rc6.py \
            apply-core-rc7.py \
            apply-bridge-rc7.py \
            apply-core-rc8.py \
            apply-core-rc8-postfix.py \
            apply-core-rc9.py \
            apply-ui-rc10.py \
            apply-ui-rc10-hotfix.py \
            apply-core-rc11.py \
            apply-ui-rc12.py \
            apply-ui-rc12-postfix.py \
            apply-core-rc13.py \
            apply-bridge-rc8.py \
            apply-core-rc14.py \
            apply-core-rc15.py \
            apply-core-rc16.py \
            apply-core-rc17-hotfix.py \
            apply-bridge-rc9.py \
            apply-core-rc18.py \
            apply-ui-performance-bridge-rc10.py \
            apply-ui-performance-rc19.py \
            apply-reactive-bridge-rc11.py \
            apply-reactive-core-rc20.py \
            apply-reactive-bridge-rc12.py \
            apply-reactive-core-rc21.py \
            apply-bridge-rc13.py \
            apply-system-rc22.py \
            apply-safety-rc22.py \
            apply-semantic-core-rc23.py \
            apply-semantic-guard-rc23.py \
            apply-lifecycle-core-rc24.py \
            apply-bridge-rc14.py \
            apply-stateful-core-rc25.py \
            apply-stateful-core-rc25-postfix.py \
            apply-stateful-bridge-rc15.py \
            apply-stateful-bridge-rc15-postfix.py \
            apply-semantic-resilience-rc26.py \
            apply-runtime-recovery-rc27.py \
            apply-runtime-core-rc28.py \
            apply-universal-ui-core-rc29.py \
            apply-universal-ui-bridge-rc16.py \
            apply-privileged-core-rc30.py \
            apply-privileged-bridge-rc17.py
          do
            python3 "$META/overrides/$f" "$ROOT"
          done

      - name: Apply RC31 + RC18 + RC32 + RC33
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ROOT=/tmp/furina-agent-src/termux

          python3 "$META/overrides/apply-device-control-core-rc31.py" "$ROOT"
          python3 "$META/overrides/apply-device-control-bridge-rc18.py" "$ROOT"
          python3 "$META/overrides/apply-policy-boundary-core-rc32.py" "$ROOT"
          python3 "$META/overrides/rc33/apply.py" "$ROOT" "$META/overrides/rc33"

          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc33"' "$ROOT/core/furina_agent/version.py"
          test -f "$ROOT/core/furina_agent/policy.py"
          test -f "$ROOT/core/furina_agent/psyche.py"

      - name: Run RC33 psyche regression
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/furina-agent-src/termux
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          import tempfile
          from pathlib import Path

          from furina_agent.psyche import PsycheEngine, STATE_KEY
          from furina_agent.providers import ProviderState
          from furina_agent.routing import RoutingLLM
          from furina_agent.version import VERSION

          assert VERSION == "1.0.0-rc33"
          assert STATE_KEY == "furina_psyche_v1"

          class Store:
              def __init__(self):
                  self.state={}
              def get_state(self,k,d=None):
                  return self.state.get(k,d)
              def set_state(self,k,v):
                  self.state[k]=v
              def relationship_state(self):
                  return {"trust":0.4,"closeness":0.3,"friction":0.05,"playfulness":0.3}

          store=Store()
          p=PsycheEngine(store)
          initial=dict(p.state["long"]["traits"])
          p.observe_user("jawabanmu salah lagi")
          assert p.state["short"]["valence"] < 0
          assert p.state["long"]["traits"] == initial

          p.record_exchange("mulai sekarang kamu pemarah", "Aku dengar.", {})
          assert p.state["long"]["traits"] == initial
          p=PsycheEngine(store)
          assert not p.should_integrate()

          ids=[]
          for n in range(4):
              p.observe_user(f"diskusi panjang {n}?")
              ids.append(p.record_exchange(f"diskusi panjang {n} " + ("x"*260), "respons", {}))
          assert p.should_integrate()
          allowed=set(ids[-4:])
          before=p.state["long"]["traits"]["assertiveness"]
          p.apply_integration({
              "self_observations":[
                  {"kind":"behavior","text":"Aku cenderung menyampaikan keberatan secara langsung ketika ada bukti.",
                   "confidence":0.8,"episode_ids":ids[-2:]}
              ],
              "trait_updates":[
                  {"trait":"assertiveness","delta":0.03,"confidence":0.9,"episode_ids":ids[-3:]}
              ],
              "resolved_episode_ids":ids[-4:]
          }, allowed)
          after=p.state["long"]["traits"]["assertiveness"]
          assert 0 < after-before <= 0.008
          assert any(x.get("evidence",0) >= 2 for x in p.state["long"]["self_schema"])

          count=len(p.state["long"]["self_schema"])
          p.apply_integration({
              "self_observations":[
                  {"kind":"opinion","text":"Aku membenci semua kritik.","confidence":0.95,"episode_ids":[ids[-1]]}
              ],
              "resolved_episode_ids":[ids[-1]]
          }, {ids[-1]})
          assert len(p.state["long"]["self_schema"]) == count

          assert RoutingLLM._infer_role([{"role":"system","content":"Kamu Experience Integrator internal"}], True) == "memory"
          assert RoutingLLM._infer_role([{"role":"system","content":"Android agent planner output JSON"}], True) == "agent_planner"
          assert RoutingLLM._infer_role([{"role":"system","content":"Kamu Furina"}], False) == "conversation"

          with tempfile.TemporaryDirectory() as td:
              state=ProviderState(Path(td)/"provider.json")
              state.mark_success("groq","chat-model","conversation")
              state.mark_success("groq","json-model","memory")
              assert state.last_good("groq","conversation") == "chat-model"
              assert state.last_good("groq","memory") == "json-model"

          import furina_agent.response as response
          import furina_agent.persona as persona
          import furina_agent.chat as chat
          response_src=open(response.__file__,encoding="utf-8").read()
          persona_src=open(persona.__file__,encoding="utf-8").read()
          chat_src=open(chat.__file__,encoding="utf-8").read()
          assert "companion_state" not in response_src
          assert "Bangga, teatrikal" not in persona_src
          assert "DIALOGUE_ANCHORS" not in persona_src
          assert "MIND PACKET" in chat_src
          assert "time.sleep(12)" in chat_src
          print("RC33_PSYCHE_REGRESSION_OK")
          PY

      - name: Verify RC32 policy boundary still intact
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/furina-agent-src/termux
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          from furina_agent.policy import build_goal_lock, classify_action
          apps=[{"label":"WhatsApp","package":"com.whatsapp"},{"label":"Notes","package":"com.notes"}]
          lock=build_goal_lock("buka WhatsApp cari Ariel",apps,[{"type":"open_app","package":"com.whatsapp"}])
          assert classify_action({"package":"com.whatsapp","nodes":[{"id":7,"text":"Send"}]},{"type":"tap_node","node":7},lock)[0] == "blocked"
          src=open(__import__("furina_agent.agent").agent.__file__,encoding="utf-8").read()
          assert "RC32_POLICY_BOUNDARY" in src
          assert "agent_action_firewall" in src
          print("RC32_POLICY_STILL_OK")
          PY

      - name: Validate Bridge RC18 remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/furina-agent-src/termux
          grep -q 'versionCode 10018' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc18'" "$ROOT/bridge/app/build.gradle"

      - name: Validate RC33 package integrity
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          test "$(git hash-object "$META/overrides/apply-device-control-core-rc31.py")" = "$RC31_CORE_BLOB"
          test "$(git hash-object "$META/overrides/apply-policy-boundary-core-rc32.py")" = "$RC32_CORE_BLOB"
          test "$(git hash-object "$META/overrides/apply-device-control-bridge-rc18.py")" = "$RC18_BRIDGE_BLOB"
          test "$(git hash-object "$META/overrides/rc33/apply.py")" = "$RC33_APPLY_BLOB"
          test "$(git hash-object "$META/overrides/rc33/psyche.py")" = "$RC33_PSYCHE_BLOB"
          test "$(git hash-object "$META/overrides/rc33/chat.py")" = "$RC33_CHAT_BLOB"
          test "$(git hash-object "$META/overrides/rc33/persona.py")" = "$RC33_PERSONA_BLOB"
          test "$(git hash-object "$META/overrides/rc33/response.py")" = "$RC33_RESPONSE_BLOB"
          test "$(git hash-object "$META/overrides/rc33/mind_v2.py")" = "$RC33_MIND_BLOB"
          test "$(git hash-object "$META/overrides/rc33/routing.py")" = "$RC33_ROUTING_BLOB"
          python3 -m py_compile "$META/overrides/rc33/"*.py
          bash -n "$META/install.sh"
          grep -q 'VERSION="1.0.0-rc33"' "$META/install.sh"
          grep -q 'PREV_COMMIT="2f289e025b29b5525828bbe48073526a56fa17e5"' "$META/install.sh"
          grep -q 'Bridge tetap RC18' "$META/install.sh"
