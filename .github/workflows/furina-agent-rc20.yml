name: Build Furina Agent RC20 + Bridge RC11

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-agent-rc20-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: furina-agent-v1.0.0-rc11
  APK_NAME: Furina-Agent-Bridge-v1.0.0-rc11.apk
  EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble RC20 source
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc20"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc11"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])')" = "10011"

          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"

          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve(); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          for f in \
            apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py \
            apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py \
            apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py \
            apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py \
            apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py \
            apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py \
            apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py \
            apply-bridge-rc9.py apply-core-rc18.py \
            apply-ui-performance-bridge-rc10.py apply-ui-performance-rc19.py \
            apply-reactive-bridge-rc11.py apply-reactive-core-rc20.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc20"' "$ROOT/core/furina_agent/version.py"
          grep -q 'termux_return_candidate_at' "$ROOT/core/furina_agent/agent.py"
          grep -q 'Binding("left", "choose_allow"' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'Binding("right", "choose_cancel"' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'nextNeedsReadyWait(JSONObject step)' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'nextTimeout = 3200L' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          grep -q 'versionCode 10011' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc11'" "$ROOT/bridge/app/build.gradle"

      - name: Validate transforms and installer syntax
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          python3 -m py_compile "$META/overrides/apply-reactive-core-rc20.py" "$META/overrides/apply-reactive-bridge-rc11.py"
          bash -n "$META/install.sh"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Bridge signing identity
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build Bridge RC11 on PR
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Build signed Bridge RC11
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-src/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$FURINA_KEYSTORE_PASSWORD" && test -n "$FURINA_KEY_ALIAS" && test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify and publish RC11
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-src/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$($APKANALYZER manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$($APKANALYZER manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$($APKANALYZER manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$($APKSIGNER verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10011
          test "$NAME" = 1.0.0-rc11
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            'version':os.environ['NAME'],
            'version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],
            'sha256':os.environ['SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'apk_url':'https://github.com/WynnDev-rill/furina/releases/download/furina-agent-v1.0.0-rc11/Furina-Agent-Bridge-v1.0.0-rc11.apk'
          }
          open('bridge.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" bridge.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" bridge.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Furina Agent Bridge 1.0.0 RC11 — By Wynn" \
              --notes "RC11 fixes continuation after app launch and removes unnecessary fixed waits between local UI actions."
          fi
