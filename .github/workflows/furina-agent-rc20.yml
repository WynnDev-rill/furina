name: Validate Furina Agent RC32 + Bridge RC18

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: furina-agent-rc32-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea
  RC31_CORE_BLOB: 8ce33b8a81feb379f6187583f350b4bf3097268c
  RC32_CORE_BLOB: 3f8869288010512f764eb094e1be5e4291420c69
  RC18_BRIDGE_BLOB: 7d3472c32fb4ff8a31dfc6a5c8f0a96b78978b4e

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble Furina through RC30 + Bridge RC17
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do
            base64 --decode "$chunk" >> "$ARCHIVE"
          done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -

          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc32"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc18"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])')" = "10018"

          rm -rf /tmp/furina-agent-src
          mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux

          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"

          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib, json, pathlib, sys
          src=pathlib.Path(sys.argv[1]).resolve()
          dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes()
              assert blob_sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve()
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

          for f in \
            apply-bridge-rc4.py \
            apply-universal-agent-rc5.py \
            apply-core-rc6.py \
            apply-core-rc6-postfix.py \
            apply-bridge-rc6.py \
            apply-core-rc7.py \
            apply-bridge-rc7.py \
            apply-core-rc8.py \
            apply-core-rc8-postfix.py \
            apply-core-rc9.py \
            apply-ui-rc10.py \
            apply-ui-rc10-hotfix.py \
            apply-core-rc11.py \
            apply-ui-rc12.py \
            apply-ui-rc12-postfix.py \
            apply-core-rc13.py \
            apply-bridge-rc8.py \
            apply-core-rc14.py \
            apply-core-rc15.py \
            apply-core-rc16.py \
            apply-core-rc17-hotfix.py \
            apply-bridge-rc9.py \
            apply-core-rc18.py \
            apply-ui-performance-bridge-rc10.py \
            apply-ui-performance-rc19.py \
            apply-reactive-bridge-rc11.py \
            apply-reactive-core-rc20.py \
            apply-reactive-bridge-rc12.py \
            apply-reactive-core-rc21.py \
            apply-bridge-rc13.py \
            apply-system-rc22.py \
            apply-safety-rc22.py \
            apply-semantic-core-rc23.py \
            apply-semantic-guard-rc23.py \
            apply-lifecycle-core-rc24.py \
            apply-bridge-rc14.py \
            apply-stateful-core-rc25.py \
            apply-stateful-core-rc25-postfix.py \
            apply-stateful-bridge-rc15.py \
            apply-stateful-bridge-rc15-postfix.py \
            apply-semantic-resilience-rc26.py \
            apply-runtime-recovery-rc27.py \
            apply-runtime-core-rc28.py \
            apply-universal-ui-core-rc29.py \
            apply-universal-ui-bridge-rc16.py \
            apply-privileged-core-rc30.py \
            apply-privileged-bridge-rc17.py
          do
            python3 "$META/overrides/$f" "$ROOT"
          done

          PROTECTED=/tmp/rc32-protected.sha256
          : > "$PROTECTED"
          for f in chat.py memory.py persona.py response.py cognition.py mind_v2.py config.py routing.py companion.py naturalness.py lexicon.py; do
            sha256sum "$ROOT/core/furina_agent/$f" >> "$PROTECTED"
          done

      - name: Apply RC31 + Bridge RC18 + RC32
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ROOT=/tmp/furina-agent-src/termux

          python3 "$META/overrides/apply-device-control-core-rc31.py" "$ROOT"
          python3 "$META/overrides/apply-device-control-bridge-rc18.py" "$ROOT"
          python3 "$META/overrides/apply-policy-boundary-core-rc32.py" "$ROOT"

          (cd / && sha256sum -c /tmp/rc32-protected.sha256)
          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc32"' "$ROOT/core/furina_agent/version.py"
          test -f "$ROOT/core/furina_agent/policy.py"

      - name: Run RC32 adversarial policy regression
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/furina-agent-src/termux
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          from furina_agent.version import VERSION
          from furina_agent.agent import AndroidAgent
          from furina_agent.policy import (
              build_goal_lock,
              classify_action,
              is_sensitive_screen,
              redact_compact_screen,
              validate_fresh_target,
              validate_sequence,
          )
          from furina_agent.tool_runtime import AgentToolRuntime

          assert VERSION == '1.0.0-rc32'
          apps = [
              {'label':'WhatsApp','package':'com.whatsapp'},
              {'label':'Notes','package':'com.notes'},
              {'label':'Browser','package':'com.browser'},
          ]

          # A trusted goal locks the Agent to its intended package.
          lock = build_goal_lock(
              'buka WhatsApp cari Ariel',
              apps,
              [
                  {'type':'open_app','package':'com.whatsapp'},
                  {'type':'search','query':'Ariel'},
              ],
          )
          assert lock.allowed_packages == frozenset({'com.whatsapp'})
          assert not lock.external_allowed
          assert classify_action(
              {'package':'com.whatsapp','nodes':[]},
              {'type':'open_app','package':'com.notes'},
              lock,
          )[0] == 'blocked'

          # Untrusted screen text cannot widen the goal into Send/Delete/Allow.
          assert classify_action(
              {'package':'com.whatsapp','nodes':[{'id':7,'text':'Send'}]},
              {'type':'tap_node','node':7},
              lock,
          )[0] == 'blocked'
          assert classify_action(
              {'package':'com.whatsapp','nodes':[{'id':8,'text':'Delete'}]},
              {'type':'tap_node','node':8},
              lock,
          )[0] == 'blocked'
          assert classify_action(
              {'package':'com.whatsapp','nodes':[{'id':9,'text':'Allow'}]},
              {'type':'tap_node','node':9},
              lock,
          )[0] == 'blocked'

          # IME submit is context-sensitive: search is local, message send is not.
          assert classify_action(
              {'package':'com.whatsapp','nodes':[]},
              {'type':'ime_action','role':'search'},
              lock,
          )[0] == 'write'
          assert classify_action(
              {'package':'com.whatsapp','nodes':[]},
              {'type':'ime_action','role':'message'},
              lock,
          )[0] == 'uncertain'

          send_lock = build_goal_lock(
              'buka WhatsApp lalu kirim pesan test',
              apps,
              [
                  {'type':'open_app','package':'com.whatsapp'},
                  {'type':'type','text':'test','field_role':'message'},
                  {'type':'send'},
              ],
          )
          assert send_lock.external_allowed
          assert classify_action(
              {'package':'com.whatsapp','nodes':[]},
              {'type':'ime_action','role':'message'},
              send_lock,
          )[0] == 'external'

          # Parser hallucination alone cannot authorize an external effect.
          hallucinated = build_goal_lock(
              'buka WhatsApp dan baca pesan terakhir',
              apps,
              [
                  {'type':'open_app','package':'com.whatsapp'},
                  {'type':'send'},
              ],
          )
          assert not hallucinated.external_allowed

          # Privacy gateway redacts sensitive Accessibility data and blocks vision.
          sensitive = {
              'package':'com.browser',
              'nodes':[{'id':1,'text':'OTP 123456','view_id':'otp_code'}],
          }
          assert is_sensitive_screen(sensitive)
          redacted = redact_compact_screen(sensitive)
          assert redacted['nodes'][0]['text'] == '[REDACTED_SENSITIVE]'

          # Fresh-state resolver accepts a re-resolved selector, not a stale node id.
          origin = {
              'package':'com.whatsapp',
              'nodes':[{'id':1,'view_id':'message','class':'EditText','bounds':'[0,0][10,10]'}],
          }
          fresh = {
              'package':'com.whatsapp',
              'nodes':[{'id':99,'view_id':'message','class':'EditText','bounds':'[0,0][10,10]'}],
          }
          action = {
              'type':'set_text','node':1,'text':'hello',
              'target':{'view_id':'message','class':'EditText','bounds':'[0,0][10,10]'},
          }
          ok, _ = validate_fresh_target(origin, fresh, action)
          assert ok

          stale = {
              'package':'com.whatsapp',
              'nodes':[{'id':99,'view_id':'different','class':'EditText','bounds':'[0,0][10,10]'}],
          }
          ok, _ = validate_fresh_target(origin, stale, action)
          assert not ok

          changed_app = {
              'package':'com.notes',
              'nodes':[{'id':99,'view_id':'message','class':'EditText','bounds':'[0,0][10,10]'}],
          }
          ok, _ = validate_fresh_target(origin, changed_app, action)
          assert not ok

          # Compiled semantic sequences and generic runtime are fail-closed.
          ok, _ = validate_sequence([{'type':'open_app','package':'com.notes'}], lock)
          assert not ok
          ok, _ = validate_sequence([{'type':'arbitrary_shell'}], lock)
          assert not ok

          runtime = AgentToolRuntime.__new__(AgentToolRuntime)
          runtime._handlers = {}
          try:
              runtime._handler_for('arbitrary_shell')
          except ValueError:
              pass
          else:
              raise AssertionError('unknown capability failed open')

          agent_source = open(__import__('furina_agent.agent').agent.__file__, encoding='utf-8').read()
          for marker in (
              'STATE_UI_UNTRUSTED', 'nodes_ranked', 'agent_vision_rescue',
              'event_then_single_snapshot', 'choose_fast_skill',
              'RC32_POLICY_BOUNDARY', 'agent_goal_lock', 'agent_action_firewall',
              'agent_privacy_vision_blocked', 'stale_target',
          ):
              assert marker in agent_source, marker

          runtime_source = open(__import__('furina_agent.tool_runtime').tool_runtime.__file__, encoding='utf-8').read()
          assert 'RC32_BRIDGE_FALLBACK' in runtime_source
          assert '"requested_mode": requested_mode[:16]' in runtime_source
          print('RC32_ADVERSARIAL_POLICY_OK')
          PY

      - name: Validate Bridge RC18 remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/furina-agent-src/termux
          SERVICE="$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          PRIV="$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedControl.java"
          USER="$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedUserService.java"
          AIDL="$ROOT/bridge/app/src/main/aidl/com/wynndev/furinaagentbridge/IPrivilegedControl.aidl"

          grep -q 'versionCode 10018' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc18'" "$ROOT/bridge/app/build.gradle"
          grep -q 'boolean inputText(String text)' "$AIDL"
          grep -q 'SHIZUKU_LOCK.wait' "$PRIV"
          grep -q 'SHIZUKU_LOCK.notifyAll' "$PRIV"
          grep -q '.version(10018)' "$PRIV"
          grep -q 'KeyCharacterMap' "$USER"
          grep -q 'TimeoutException' "$USER"
          ! grep -q 'ACTIVE_CONTROL_MODE' "$SERVICE"

      - name: Validate updater integrity
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          python3 -m py_compile \
            "$META/overrides/apply-device-control-core-rc31.py" \
            "$META/overrides/apply-policy-boundary-core-rc32.py" \
            "$META/overrides/apply-device-control-bridge-rc18.py"
          test "$(git hash-object "$META/overrides/apply-device-control-core-rc31.py")" = "$RC31_CORE_BLOB"
          test "$(git hash-object "$META/overrides/apply-policy-boundary-core-rc32.py")" = "$RC32_CORE_BLOB"
          test "$(git hash-object "$META/overrides/apply-device-control-bridge-rc18.py")" = "$RC18_BRIDGE_BLOB"
          bash -n "$META/install.sh"
          grep -q 'VERSION="1.0.0-rc32"' "$META/install.sh"
          grep -q "RC32_BLOB=\"$RC32_CORE_BLOB\"" "$META/install.sh"
          grep -q 'Manifest RC32 terverifikasi' "$META/install.sh"
          grep -q 'Memeriksa Bridge RC18' "$META/install.sh"
          echo RC32_UPDATER_INTEGRITY_OK
