name: Validate Furina Agent RC34 Intent Guard + RC32 Policy

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: furina-agent-rc34-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and validate RC34
        shell: bash
        run: bash experiments/furina-agent-final/overrides/rc34/validate.sh
