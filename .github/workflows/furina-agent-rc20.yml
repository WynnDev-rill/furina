name: Build Furina Agent RC30 + Bridge RC17

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-agent-rc30-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: furina-agent-v1.0.0-rc17
  APK_NAME: Furina-Agent-Bridge-v1.0.0-rc17.apk
  EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and validate RC30 + Bridge RC17
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc30"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc17"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])')" = "10017"

          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve(); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py apply-bridge-rc9.py apply-core-rc18.py apply-ui-performance-bridge-rc10.py apply-ui-performance-rc19.py apply-reactive-bridge-rc11.py apply-reactive-core-rc20.py apply-reactive-bridge-rc12.py apply-reactive-core-rc21.py apply-bridge-rc13.py apply-system-rc22.py apply-safety-rc22.py apply-semantic-core-rc23.py apply-semantic-guard-rc23.py apply-lifecycle-core-rc24.py apply-bridge-rc14.py apply-stateful-core-rc25.py apply-stateful-core-rc25-postfix.py apply-stateful-bridge-rc15.py apply-stateful-bridge-rc15-postfix.py apply-semantic-resilience-rc26.py apply-runtime-recovery-rc27.py apply-runtime-core-rc28.py apply-universal-ui-core-rc29.py apply-universal-ui-bridge-rc16.py apply-privileged-core-rc30.py apply-privileged-bridge-rc17.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc30"' "$ROOT/core/furina_agent/version.py"
          grep -q 'def _device_mode' "$ROOT/core/furina_agent/agent.py"
          grep -q 'CONTROL_MODE:' "$ROOT/core/furina_agent/agent.py"
          grep -q '"run_ui_sequence", "steps": steps, "mode": self._device_mode()' "$ROOT/core/furina_agent/agent.py"
          grep -q 'payload.setdefault("mode", self._device_mode())' "$ROOT/core/furina_agent/agent.py"
          SERVICE="$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          PRIV="$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedControl.java"
          USER="$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedUserService.java"
          grep -q 'ACTIVE_CONTROL_MODE' "$SERVICE"
          grep -q 'PrivilegedControl.warm' "$SERVICE"
          grep -q 'step.put("mode", executionMode)' "$SERVICE"
          grep -q 'requested_mode' "$SERVICE"
          grep -q 'execution_mode' "$SERVICE"
          grep -q 'injectInputEvent' "$USER"
          grep -q 'injectTap' "$USER"
          grep -q 'injectSwipe' "$USER"
          grep -q 'awaitShizuku' "$PRIV"
          grep -q '.version(10017)' "$PRIV"
          grep -q 'versionCode 10017' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc17'" "$ROOT/bridge/app/build.gradle"

      - name: Run RC30 capability routing regressions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/furina-agent-src/termux
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          from types import SimpleNamespace
          from furina_agent.agent import AndroidAgent

          agent=AndroidAgent.__new__(AndroidAgent)
          agent.cfg=SimpleNamespace(device_control_mode='shizuku')
          assert agent._device_mode()=='shizuku'
          agent.cfg=SimpleNamespace(device_control_mode='root')
          assert agent._device_mode()=='root'
          agent.cfg=SimpleNamespace(device_control_mode='normal')
          assert agent._device_mode()=='normal'
          agent.cfg=SimpleNamespace(device_control_mode='invalid')
          assert agent._device_mode()=='normal'

          source=open(__import__('furina_agent.agent').agent.__file__,encoding='utf-8').read()
          assert '"run_ui_sequence", "steps": steps, "mode": self._device_mode()' in source
          assert 'payload.setdefault("mode", self._device_mode())' in source
          assert 'CONTROL_MODE:' in source
          print('RC30_CORE_CAPABILITY_ROUTING_OK')
          PY

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/furina-agent-src/termux')
          service=(root/'bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java').read_text()
          privileged=(root/'bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedControl.java').read_text()
          user=(root/'bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedUserService.java').read_text()

          # Normal mode stays on Accessibility/native without privileged warming.
          assert 'boolean privilegedReady = "normal".equals(requestedMode) || PrivilegedControl.warm' in service
          assert 'String executionMode = privilegedReady ? requestedMode : "normal"' in service
          # Privileged modes are warmed once per sequence and injected into every step.
          assert 'step.put("mode", executionMode)' in service
          assert 'privilegedTapNode(action, node)' in service
          assert 'privilegedSwipeRect(action' in service
          assert 'PrivilegedControl.keyEvent(this, executionMode, 4)' in service
          # Shizuku uses a daemon UserService; direct InputManager injection is primary.
          assert '.daemon(true)' in privileged and '.version(10017)' in privileged
          assert 'injectInputEvent' in user and 'if (injectTap(x, y)) return true;' in user
          assert 'if (injectSwipe(x1, y1, x2, y2, duration)) return true;' in user
          # Shell input remains only a fallback; it is not created per action.
          assert 'private Process shell;' in user
          assert 'private static final RootShell ROOT = new RootShell();' in privileged
          # Foreground privileged lookup is only fallback when Accessibility root is unavailable.
          access_index=service.index('AccessibilityNodeInfo root = getRootInActiveWindow();')
          priv_index=service.index('PrivilegedControl.foregroundPackage(this, ACTIVE_CONTROL_MODE)')
          assert access_index < priv_index
          print('RC30_BRIDGE_CAPABILITY_ROUTING_OK')
          PY

      - name: Validate updater and transform integrity
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          python3 -m py_compile "$META/overrides/apply-privileged-core-rc30.py" "$META/overrides/apply-privileged-bridge-rc17.py"
          CORE_HASH="$(git hash-object "$META/overrides/apply-privileged-core-rc30.py")"
          BRIDGE_HASH="$(git hash-object "$META/overrides/apply-privileged-bridge-rc17.py")"
          test "$CORE_HASH" = "e2a98f867c86786de99c942c3baf832fdc330e5d"
          test "$BRIDGE_HASH" = "bd0d77248ea427d0cabffdc7e142187b3b71f5c2"
          bash -n "$META/install.sh"
          grep -q 'VERSION="1.0.0-rc30"' "$META/install.sh"
          grep -q "RC30_BLOB=\"$CORE_HASH\"" "$META/install.sh"
          grep -q 'Manifest RC30 terverifikasi' "$META/install.sh"
          grep -q 'Core RC30 aktif' "$META/install.sh"
          grep -q 'Memeriksa Bridge RC17' "$META/install.sh"
          grep -q 'installed_code >= expected_code' "$META/install.sh"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Bridge RC17 on PR
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Restore Bridge signing identity
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed Bridge RC17
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-src/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$FURINA_KEYSTORE_PASSWORD" && test -n "$FURINA_KEY_ALIAS" && test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify and publish RC17
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-src/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$($APKANALYZER manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$($APKANALYZER manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$($APKANALYZER manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$($APKSIGNER verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10017
          test "$NAME" = 1.0.0-rc17
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            'version':os.environ['NAME'],
            'version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],
            'sha256':os.environ['SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'apk_url':'https://github.com/WynnDev-rill/furina/releases/download/furina-agent-v1.0.0-rc17/Furina-Agent-Bridge-v1.0.0-rc17.apk'
          }
          open('bridge.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" bridge.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" bridge.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Furina Agent Bridge 1.0.0 RC17 — By Wynn" \
              --notes "RC17 adds capability-routed privileged execution: persistent Shizuku UserService with direct input injection, persistent root execution, privileged foreground fallback, and unchanged full Normal Accessibility support."
          fi
