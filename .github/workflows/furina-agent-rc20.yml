name: Build Furina Agent RC28 + Bridge RC15

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: furina-agent-rc28-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble final RC28 source
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc28"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc15"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])')" = "10015"

          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve(); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py apply-bridge-rc9.py apply-core-rc18.py apply-ui-performance-bridge-rc10.py apply-ui-performance-rc19.py apply-reactive-bridge-rc11.py apply-reactive-core-rc20.py apply-reactive-bridge-rc12.py apply-reactive-core-rc21.py apply-bridge-rc13.py apply-system-rc22.py apply-safety-rc22.py apply-semantic-core-rc23.py apply-semantic-guard-rc23.py apply-lifecycle-core-rc24.py apply-bridge-rc14.py apply-stateful-core-rc25.py apply-stateful-core-rc25-postfix.py apply-stateful-bridge-rc15.py apply-stateful-bridge-rc15-postfix.py apply-semantic-resilience-rc26.py apply-runtime-recovery-rc27.py apply-runtime-core-rc28.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc28"' "$ROOT/core/furina_agent/version.py"
          grep -q 'def _contract(' "$ROOT/core/furina_agent/agent.py"
          grep -q 'def _plan(' "$ROOT/core/furina_agent/agent.py"
          grep -q 'def _deterministic_gate(' "$ROOT/core/furina_agent/agent.py"
          grep -q 'def _verify_goal(' "$ROOT/core/furina_agent/agent.py"
          grep -q 'def _wait_after_action(' "$ROOT/core/furina_agent/agent.py"
          grep -q 'bridge_pairing_recovered' "$ROOT/core/furina_agent/companion.py"
          grep -q 'chat-runtime.log' "$ROOT/core/furina_agent/chat_surface.py"
          ! grep -q 'steps = self._compile_ui_sequence(goal, contract, apps)' "$ROOT/core/furina_agent/agent.py"
          grep -q 'versionCode 10015' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc15'" "$ROOT/bridge/app/build.gradle"

      - name: Run RC28 real agent entrypoint regression
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/furina-agent-src/termux
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          from furina_agent.agent import AndroidAgent
          from furina_agent.companion import CompanionSession

          required=(
              '_contract','_compact_screen','_actionable_count','_with_vision','_plan',
              '_node_for_action','_selector_from_node','_enrich_action','_screen_signature',
              '_result_ok','risk','_history_action_succeeded','_screen_text',
              '_deterministic_gate','_verify_goal','_finish_ready','_wait_after_action',
              '_fast_completion','_try_fast_skill','_try_ui_sequence','_compile_semantic_sequence',
              '_semantic_send_action','run',
          )
          missing=[name for name in required if not hasattr(AndroidAgent,name)]
          assert not missing, missing

          class Store:
              def __init__(self): self.events=[]
              def log_event(self,name,data): self.events.append((name,data))
          class Cfg:
              fast_path_enabled=False

          command='buka wa,cari kontak ariel dan kirim pesan test furina'
          apps=[{'label':'WhatsApp','package':'com.whatsapp'}]
          steps=[
              {'type':'open_app','package':'com.whatsapp'},
              {'type':'search','query':'Ariel'},
              {'type':'select','target':'Ariel'},
              {'type':'type','text':'test furina','field_role':'message'},
              {'type':'send'},
          ]
          agent=AndroidAgent.__new__(AndroidAgent)
          agent.store=Store(); agent.cfg=Cfg()
          contract=agent._contract(command,apps,steps)
          assert contract.target_package == 'com.whatsapp', contract
          assert contract.external_expected, contract
          assert agent._compile_semantic_sequence(steps,apps), 'semantic executor prefix empty'
          assert callable(agent._contract)

          assert CompanionSession._resolve_app_hint('wa', apps) == 'com.whatsapp'
          parsed=CompanionSession._fallback_device_steps(command,apps)
          assert [x['type'] for x in parsed] == ['open_app','search','select','type','send'], parsed
          print('RC28_ANDROID_AGENT_ENTRYPOINT_OK')
          PY

      - name: Validate updater contract
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          python3 -m py_compile "$META/overrides/apply-runtime-core-rc28.py"
          RC28_HASH="$(git hash-object "$META/overrides/apply-runtime-core-rc28.py")"
          bash -n "$META/install.sh"
          grep -q 'VERSION="1.0.0-rc28"' "$META/install.sh"
          grep -q "RC28_BLOB=\"$RC28_HASH\"" "$META/install.sh"
          grep -q 'Manifest RC28 terverifikasi' "$META/install.sh"
          grep -q 'Core RC28 aktif' "$META/install.sh"
          grep -q 'Memeriksa Bridge RC15' "$META/install.sh"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unchanged Bridge RC15 compatibility APK
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug
