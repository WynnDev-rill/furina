name: Build Furina Agent RC31 + Bridge RC18

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-agent-rc31-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: furina-agent-v1.0.0-rc18
  APK_NAME: Furina-Agent-Bridge-v1.0.0-rc18.apk
  EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea
  RC31_CORE_BLOB: 8ce33b8a81feb379f6187583f350b4bf3097268c
  RC18_BRIDGE_BLOB: 7d3472c32fb4ff8a31dfc6a5c8f0a96b78978b4e

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble through RC30 + Bridge RC17
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc31"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc18"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])')" = "10018"

          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve(); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py apply-bridge-rc9.py apply-core-rc18.py apply-ui-performance-bridge-rc10.py apply-ui-performance-rc19.py apply-reactive-bridge-rc11.py apply-reactive-core-rc20.py apply-reactive-bridge-rc12.py apply-reactive-core-rc21.py apply-bridge-rc13.py apply-system-rc22.py apply-safety-rc22.py apply-semantic-core-rc23.py apply-semantic-guard-rc23.py apply-lifecycle-core-rc24.py apply-bridge-rc14.py apply-stateful-core-rc25.py apply-stateful-core-rc25-postfix.py apply-stateful-bridge-rc15.py apply-stateful-bridge-rc15-postfix.py apply-semantic-resilience-rc26.py apply-runtime-recovery-rc27.py apply-runtime-core-rc28.py apply-universal-ui-core-rc29.py apply-universal-ui-bridge-rc16.py apply-privileged-core-rc30.py apply-privileged-bridge-rc17.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          PROTECTED=/tmp/rc31-protected.sha256
          : > "$PROTECTED"
          for f in chat.py memory.py persona.py response.py cognition.py mind_v2.py config.py routing.py companion.py naturalness.py lexicon.py; do
            sha256sum "$ROOT/core/furina_agent/$f" >> "$PROTECTED"
          done

      - name: Apply and validate RC31 device-control only
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ROOT=/tmp/furina-agent-src/termux
          python3 "$META/overrides/apply-device-control-core-rc31.py" "$ROOT"
          python3 "$META/overrides/apply-device-control-bridge-rc18.py" "$ROOT"

          (cd / && sha256sum -c /tmp/rc31-protected.sha256)
          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc31"' "$ROOT/core/furina_agent/version.py"

          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          import threading
          from types import SimpleNamespace
          import furina_agent.agent as agentmod
          from furina_agent.agent import AndroidAgent
          from furina_agent.tool_runtime import AgentToolRuntime

          a=AndroidAgent.__new__(AndroidAgent)
          a.cfg=SimpleNamespace(device_control_mode='normal')
          a.store=SimpleNamespace(log_event=lambda *args, **kwargs: None)

          nodes=[]
          for i in range(250):
              nodes.append({'id':i,'text':('needle target' if i==220 else f'row {i}'),'clickable':i==220,'editable':False})
          compact=a._compact_screen({'package':'pkg','nodes':nodes}, 'needle')
          assert any(n.get('id')==220 for n in compact['nodes'])
          assert compact['node_count']==250 and compact['nodes_ranked']>=180

          assert a.risk({'nodes':[]},{'type':'set_text','text':'tolong tulis kata hapus dan kirim saja'})[0]=='write'
          assert a.risk({'nodes':[]},{'type':'tap','x':10,'y':20})[0]=='uncertain'
          assert a.risk({'nodes':[],'vision_elements':[{'x':10,'y':20,'text':'Open details','confidence':0.92}]},{'type':'tap','x':10,'y':20})[0]=='navigate'

          calls={'screen':0}
          class Bridge:
              def screen(self): calls['screen']+=1; return {'package':'pkg','nodes':[]}
          a.bridge=Bridge()
          old=agentmod.wait_for_event
          agentmod.wait_for_event=lambda *args, **kwargs: True
          try:
              out=a._wait_after_action({'package':'pkg','nodes':[]},0,'tap_node',threading.Event())
          finally:
              agentmod.wait_for_event=old
          assert calls['screen']==1 and out['package']=='pkg'

          fp=AgentToolRuntime._fingerprint
          assert fp({'type':'tap','x':1,'y':2,'mode':'normal'}) != fp({'type':'tap','x':1,'y':2,'mode':'root'})
          source=open(agentmod.__file__,encoding='utf-8').read()
          assert 'choose_fast_skill' in source and 'STATE_UI_UNTRUSTED' in source and 'agent_vision_rescue' in source
          print('RC31_CORE_DEVICE_CONTROL_OK')
          PY

          SERVICE="$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java"
          PRIV="$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedControl.java"
          USER="$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedUserService.java"
          AIDL="$ROOT/bridge/app/src/main/aidl/com/wynndev/furinaagentbridge/IPrivilegedControl.aidl"
          grep -q 'versionCode 10018' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc18'" "$ROOT/bridge/app/build.gradle"
          grep -q 'boolean inputText(String text)' "$AIDL"
          grep -q 'SHIZUKU_LOCK.wait' "$PRIV"
          grep -q 'SHIZUKU_LOCK.notifyAll' "$PRIV"
          grep -q '.version(10018)' "$PRIV"
          grep -q 'KeyCharacterMap' "$USER"
          grep -q 'TimeoutException' "$USER"
          ! grep -q 'ACTIVE_CONTROL_MODE' "$SERVICE"
          ! grep -q 'while ((line = output.readLine())' "$PRIV"
          ! grep -q 'while ((line = output.readLine())' "$USER"

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/furina-agent-src/termux')
          s=(root/'bridge/app/src/main/java/com/wynndev/furinaagentbridge/FurinaAccessibilityService.java').read_text()
          tap=s[s.index('private boolean tapNode'):s.index('private AccessibilityNodeInfo editableNode')]
          assert tap.index('performAction(AccessibilityNodeInfo.ACTION_CLICK)') < tap.index('privilegedTapNode(action, node)')
          scroll=s[s.index('private boolean scrollBestFast'):s.index('private boolean waitFastEvent')]
          assert scroll.index('best.performAction(semantic)') < scroll.index('privilegedSwipeRect')
          seq=s[s.index('private JSONObject runUiSequence'):s.index('private boolean scrollGlobal')]
          assert seq.index('performGlobalAction(GLOBAL_ACTION_BACK)') < seq.index('PrivilegedControl.keyEvent(this, executionMode, 4)')
          assert 'activeRootPackage(executionMode)' in seq
          print('RC18_BRIDGE_SEMANTIC_FIRST_OK')
          PY

      - name: Validate updater and transform integrity
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          python3 -m py_compile "$META/overrides/apply-device-control-core-rc31.py" "$META/overrides/apply-device-control-bridge-rc18.py"
          test "$(git hash-object "$META/overrides/apply-device-control-core-rc31.py")" = "$RC31_CORE_BLOB"
          test "$(git hash-object "$META/overrides/apply-device-control-bridge-rc18.py")" = "$RC18_BRIDGE_BLOB"
          bash -n "$META/install.sh"
          grep -q 'VERSION="1.0.0-rc31"' "$META/install.sh"
          grep -q "RC31_BLOB=\"$RC31_CORE_BLOB\"" "$META/install.sh"
          grep -q 'Manifest RC31 terverifikasi' "$META/install.sh"
          grep -q 'Memeriksa Bridge RC18' "$META/install.sh"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Bridge RC18 on PR
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Restore Bridge signing identity
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed Bridge RC18
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-src/termux
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-src/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$FURINA_KEYSTORE_PASSWORD" && test -n "$FURINA_KEY_ALIAS" && test -n "$FURINA_KEY_PASSWORD"
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify and publish RC18
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-src/termux/bridge/app/build/outputs/apk/release/app-release.apk
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$($APKANALYZER manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$($APKANALYZER manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$($APKANALYZER manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$($APKSIGNER verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10018
          test "$NAME" = 1.0.0-rc18
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={
            'version':os.environ['NAME'],
            'version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],
            'sha256':os.environ['SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'apk_url':'https://github.com/WynnDev-rill/furina/releases/download/furina-agent-v1.0.0-rc18/Furina-Agent-Bridge-v1.0.0-rc18.apk'
          }
          open('bridge.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" bridge.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_NAME" bridge.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Furina Agent Bridge 1.0.0 RC18 — By Wynn" \
              --notes "RC18 makes Accessibility semantic actions primary, bounds privileged shell fallbacks, adds event-driven Shizuku binding and privileged text fallback, and removes global control-mode leakage."
          fi
