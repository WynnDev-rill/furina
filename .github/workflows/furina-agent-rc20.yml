name: Build Furina Agent RC27 + Bridge RC15

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furina-agent-rc20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: furina-agent-rc27-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: 6b51c907c8a79ab6af06ef891b5013ce8ed964bdc168cf0e71751eacf4161fea

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble final RC27 source
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          echo "$EXPECTED_SOURCE_SHA  $ARCHIVE" | sha256sum -c -
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = "1.0.0-rc27"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version"])')" = "1.0.0-rc15"
          test "$(python3 -c 'import json;print(json.load(open("experiments/furina-agent-final/manifest.json"))["bridge_version_code"])')" = "10015"

          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve(); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY

          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py apply-core-rc16.py apply-core-rc17-hotfix.py apply-bridge-rc9.py apply-core-rc18.py apply-ui-performance-bridge-rc10.py apply-ui-performance-rc19.py apply-reactive-bridge-rc11.py apply-reactive-core-rc20.py apply-reactive-bridge-rc12.py apply-reactive-core-rc21.py apply-bridge-rc13.py apply-system-rc22.py apply-safety-rc22.py apply-semantic-core-rc23.py apply-semantic-guard-rc23.py apply-lifecycle-core-rc24.py apply-bridge-rc14.py apply-stateful-core-rc25.py apply-stateful-core-rc25-postfix.py apply-stateful-bridge-rc15.py apply-stateful-bridge-rc15-postfix.py apply-semantic-resilience-rc26.py apply-runtime-recovery-rc27.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc27"' "$ROOT/core/furina_agent/version.py"
          grep -q 'bridge_pairing_recovered' "$ROOT/core/furina_agent/companion.py"
          grep -q 'semantic_intent_structural_fallback' "$ROOT/core/furina_agent/companion.py"
          grep -q 'semantic_sequence_deferred' "$ROOT/core/furina_agent/agent.py"
          grep -q 'chat-runtime.log' "$ROOT/core/furina_agent/chat_surface.py"
          ! grep -q 'steps = self._compile_ui_sequence(goal, contract, apps)' "$ROOT/core/furina_agent/agent.py"
          grep -q 'versionCode 10015' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc15'" "$ROOT/bridge/app/build.gradle"

      - name: Run RC27 end-to-end routing recovery regressions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/furina-agent-src/termux
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          import json
          from furina_agent.companion import CompanionSession
          from furina_agent.agent import AndroidAgent

          apps=[
              {'label':'WhatsApp','package':'com.whatsapp'},
              {'label':'YouTube','package':'com.google.android.youtube'},
              {'label':'Chrome','package':'com.android.chrome'},
          ]

          class Store:
              def __init__(self): self.events=[]
              def log_event(self, name, data): self.events.append((name,data))

          # Acronyms are generated from installed app labels, not hardcoded.
          assert CompanionSession._resolve_app_hint('wa', apps) == 'com.whatsapp'
          assert CompanionSession._resolve_app_hint('yt', apps) == 'com.google.android.youtube'
          assert 'com.whatsapp' in CompanionSession._app_anchors('buka wa,cari kontak ariel dan kirim pesan test furina', apps)

          # Pairing/token loss must recover the app inventory automatically.
          class RecoverBridge:
              def __init__(self): self.paired=False; self.reads=0
              def apps(self):
                  self.reads += 1
                  if not self.paired:
                      raise RuntimeError('401 simulated stale token')
                  return {'apps': apps}
              def ensure_paired(self):
                  self.paired=True
                  return True
          s=CompanionSession.__new__(CompanionSession)
          s.bridge=RecoverBridge(); s.store=Store()
          recovered=s._installed_apps()
          assert recovered == apps and s.bridge.reads == 2
          assert any(name == 'bridge_pairing_recovered' for name,_ in s.store.events)

          def session_with(llm, app_list=apps):
              x=CompanionSession.__new__(CompanionSession)
              x.llm=llm; x.store=Store(); x._installed_apps=lambda: app_list
              return x

          command='buka wa,cari kontak ariel dan kirim pesan test furina'
          expected=['open_app','search','select','type','send']

          # If JSON mode fails, plain semantic retry must still work.
          class RetryLLM:
              def __init__(self): self.calls=[]
              def chat(self, messages, *, max_tokens=None, temperature=None, json_mode=False, **kwargs):
                  self.calls.append(json_mode)
                  if json_mode:
                      raise RuntimeError('simulated json-mode failure')
                  return json.dumps({
                      'mode':'device','goal':'', 'confidence':0.94,
                      'steps':[
                          {'type':'open_app','app':'wa'},
                          {'type':'search','query':'Ariel'},
                          {'type':'send','text':'test furina'},
                      ],
                  })
          llm=RetryLLM(); s=session_with(llm)
          intent=s.classify(command)
          assert intent.mode == 'device' and intent.requires_screen
          assert llm.calls == [True, False]
          assert [x['type'] for x in intent.steps] == expected, intent.steps
          assert intent.steps[0]['package'] == 'com.whatsapp'
          assert intent.steps[2]['target'] == 'Ariel'
          assert intent.steps[3]['field_role'] == 'message' and intent.steps[3]['text'] == 'test furina'

          # If the semantic provider is completely dead, the inventory-grounded
          # structural fallback must preserve the same safe execution graph.
          class DeadLLM:
              def chat(self, *args, **kwargs): raise RuntimeError('provider offline')
          s=session_with(DeadLLM())
          intent=s.classify(command)
          assert intent.mode == 'device' and intent.requires_screen
          assert [x['type'] for x in intent.steps] == expected, intent.steps
          assert intent.steps[0]['package'] == 'com.whatsapp'
          assert any(name == 'semantic_intent_structural_fallback' for name,_ in s.store.events)

          # Even a high-confidence bad chat classification cannot override an
          # explicit, installed-app-grounded imperative chain.
          class WrongChatLLM:
              def chat(self, *args, **kwargs):
                  return json.dumps({'mode':'chat','goal':command,'confidence':0.99,'steps':[]})
          s=session_with(WrongChatLLM())
          intent=s.classify(command)
          assert intent.mode == 'device'
          assert [x['type'] for x in intent.steps] == expected
          assert any(name == 'semantic_chat_overridden_by_structure' for name,_ in s.store.events)

          # Ordinary discussion about an app must remain chat.
          class ChatLLM:
              def chat(self, *args, **kwargs):
                  return json.dumps({'mode':'chat','goal':'WhatsApp bagus tidak?','confidence':0.98,'steps':[]})
          s=session_with(ChatLLM())
          intent=s.classify('WhatsApp bagus tidak?')
          assert intent.mode == 'chat'

          # If both inventory and provider disappear, an explicit imperative is
          # still routed to the device planner rather than silently becoming chat.
          s=session_with(DeadLLM(), [])
          intent=s.classify(command)
          assert intent.mode == 'device' and intent.steps == [] and intent.requires_screen
          assert any(name == 'semantic_intent_unresolved_device_fallback' for name,_ in s.store.events)

          # Empty semantic steps must defer to the normal state-aware planner,
          # never call the RC25-deleted legacy compiler.
          a=AndroidAgent.__new__(AndroidAgent)
          a.store=Store()
          result=a._try_ui_sequence('goal', None, [], lambda *args: True, True, [], [])
          assert result == (None, None, False), result

          import furina_agent.chat_surface as cs
          source=open(cs.__file__,encoding='utf-8').read()
          assert 'chat-runtime.log' in source
          assert 'traceback.format_exc()' in source
          assert 'except Exception as exc:' in source
          print('RC27_RUNTIME_RECOVERY_OK')
          PY

      - name: Validate updater contract
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          python3 -m py_compile "$META/overrides/apply-runtime-recovery-rc27.py"
          test "$(git hash-object "$META/overrides/apply-runtime-recovery-rc27.py")" = "3e2a4080ce232ad38090bc44340dae0fd4e0c086"
          bash -n "$META/install.sh"
          grep -q 'VERSION="1.0.0-rc27"' "$META/install.sh"
          grep -q 'RC27_BLOB="3e2a4080ce232ad38090bc44340dae0fd4e0c086"' "$META/install.sh"
          grep -q 'Manifest RC27 terverifikasi' "$META/install.sh"
          grep -q 'Core RC27 aktif' "$META/install.sh"
          grep -q 'Memeriksa Bridge RC15' "$META/install.sh"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unchanged Bridge RC15 compatibility APK
        working-directory: /tmp/furina-agent-src/termux
        shell: bash
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug
