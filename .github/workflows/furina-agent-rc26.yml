name: Historical FurinaHub Android RC26 + Core RC42

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct historical RC42 and Android RC26
        shell: bash
        run: bash experiments/furina-agent-final/overrides/android-rc26/validate.sh
