name: Validate FurinaHub RC57 + Core RC69

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-single-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  HUB_TAG: furinahub-v1.0.0-rc57
  APK_NAME: FurinaHub-v1.0.0-rc57.apk
  UPDATE_CHANNEL_TAG: furina-update-stable
  SNAPSHOT_NAME: furina-core-bridge-rc69-rc57.tar
  CLIENT_NAME: furina-update.py
  STAGE_ROOT: /tmp/furina-agent-rc54-validate/termux

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate active architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/rc69/apply.py \
            experiments/furina-agent-final/overrides/android-rc57/apply.py \
            experiments/furina-agent-final/overrides/runtime-r39/update_client.py
          bash -n experiments/furina-agent-final/install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          assert m['version']=='1.0.0-rc69'
          assert m['dependency_revision']=='2026.08.23-r39'
          assert m['bundle_id']=='furina-2026.08.23-rc69-rc57'
          assert m['bridge_version']=='1.0.0-rc57'
          assert m['bridge_version_code']==10057
          assert m['update_protocol']=='furina-update/1'
          assert m['update_state_schema']==7
          assert m['update_surface']=='single-channel-single-client-atomic-snapshot'
          assert m['update_noop_path']=='channel-only'
          assert m['legacy_patch_chain']=='build-time-only-not-device-update-path'
          assert m['runtime_contract']=='furina-runtime/v5-single-pipeline'
          installer=Path('experiments/furina-agent-final/install.sh').read_text()
          active='\n'.join(line for line in installer.splitlines() if not line.lstrip().startswith('#'))
          assert 'FURINA_INSTALLER_ID="furinahub-core-bootstrap-v2"' in installer
          assert 'UPDATE_PROTOCOL="furina-update/1"' in active
          assert 'CHANNEL_URL="$STABLE_RELEASE/channel.json"' in active
          assert 'BODY_BLOB=' not in active
          assert 'runtime-r38/install-body.sh' not in active
          assert 'fetch_verified_body' not in active
          assert 'FURINA_UPDATER_GENERATION="23"' in installer
          assert 'BUNDLE_ID="furina-2026.08.23-rc68-rc56"' in installer
          print('FURINA_SINGLE_PIPELINE_MANIFEST_OK')
          PY
          git diff --check

      - name: Reconstruct once and test distributed snapshot updater
        shell: bash
        run: |
          set -euo pipefail
          HOME="$RUNNER_TEMP/furina-home" FURINA_HOME="$RUNNER_TEMP/furina-home" \
            bash experiments/furina-agent-final/overrides/runtime-r39/validate.sh
          grep -Fq 'VERSION = "1.0.0-rc69"' "$STAGE_ROOT/core/furina_agent/version.py"
          grep -Fq "versionName '1.0.0-rc57'" "$STAGE_ROOT/bridge/app/build.gradle"
          grep -Fq 'furina-2026.08.23-rc69-rc57' "$STAGE_ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/MainActivity.java"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC57 debug
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Restore release signing identity
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed RC57
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        env:
          FURINA_AGENT_KEYSTORE_PATH: ${{ env.STAGE_ROOT }}/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Build immutable release targets and channel metadata
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE="$STAGE_ROOT/bridge/app/build/outputs/apk/release/app-release.apk"
          test -s "$SOURCE"
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          APK_SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$APK_NAME")"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10057
          test "$NAME" = 1.0.0-rc57

          rm -rf /tmp/furinahub-prev /tmp/furina-snapshot-rc69
          mkdir -p /tmp/furinahub-prev /tmp/furina-snapshot-rc69
          gh release download furinahub-v1.0.0-rc55 -R "$GITHUB_REPOSITORY" -p bridge.json -D /tmp/furinahub-prev
          OLD_SIGNER="$(python3 -c 'import json; print(json.load(open("/tmp/furinahub-prev/bridge.json"))["signer_sha256"].replace(":","").lower())')"
          test "$OLD_SIGNER" = "$SIGNER"

          cp -a "$STAGE_ROOT/core" "$STAGE_ROOT/bridge" /tmp/furina-snapshot-rc69/
          rm -f /tmp/furina-snapshot-rc69/bridge/app/furina-agent-release.jks
          find /tmp/furina-snapshot-rc69 -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/furina-snapshot-rc69 -type f -name '*.pyc' -delete
          rm -rf /tmp/furina-snapshot-rc69/bridge/.gradle /tmp/furina-snapshot-rc69/bridge/app/build
          tar --sort=name --mtime='UTC 2026-08-23 00:00:00' --owner=0 --group=0 --numeric-owner \
            -cf "$SNAPSHOT_NAME" -C /tmp/furina-snapshot-rc69 core bridge
          SNAPSHOT_SHA="$(sha256sum "$SNAPSHOT_NAME" | awk '{print $1}')"
          SNAPSHOT_SIZE="$(stat -c '%s' "$SNAPSHOT_NAME")"

          cp experiments/furina-agent-final/overrides/runtime-r39/update_client.py "$CLIENT_NAME"
          CLIENT_SHA="$(sha256sum "$CLIENT_NAME" | awk '{print $1}')"
          CLIENT_SIZE="$(stat -c '%s' "$CLIENT_NAME")"
          cp experiments/furina-agent-final/install.sh furina-install.sh
          cp experiments/furina-agent-final/manifest.json manifest.json

          export PACKAGE CODE NAME APK_SHA APK_SIZE SIGNER SNAPSHOT_SHA SNAPSHOT_SIZE CLIENT_SHA CLIENT_SIZE
          python3 - <<'PY'
          import json,os,time
          apk_url='https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.0.0-rc57/FurinaHub-v1.0.0-rc57.apk'
          stable='https://github.com/WynnDev-rill/furina/releases/download/furina-update-stable'
          bridge={
            'version':os.environ['NAME'],
            'version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],
            'sha256':os.environ['APK_SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'apk_url':apk_url,
          }
          open('bridge.json','w').write(json.dumps(bridge,indent=2)+'\n')
          channel={
            'schema':1,
            'protocol':'furina-update/1',
            'bundle_id':'furina-2026.08.23-rc69-rc57',
            'published_at':int(time.time()),
            'core':{
              'version':'1.0.0-rc69',
              'revision':'2026.08.23-r39',
              'url':stable+'/furina-core-bridge-rc69-rc57.tar',
              'sha256':os.environ['SNAPSHOT_SHA'],
              'size':int(os.environ['SNAPSHOT_SIZE']),
            },
            'apk':{
              'version':os.environ['NAME'],
              'version_code':int(os.environ['CODE']),
              'package':os.environ['PACKAGE'],
              'url':apk_url,
              'sha256':os.environ['APK_SHA'],
              'size':int(os.environ['APK_SIZE']),
            },
            'client':{
              'version':'1.0.0',
              'url':stable+'/furina-update.py',
              'sha256':os.environ['CLIENT_SHA'],
              'size':int(os.environ['CLIENT_SIZE']),
            },
          }
          open('channel.json','w').write(json.dumps(channel,indent=2)+'\n')
          PY
          python3 - <<'PY'
          import json,tarfile
          c=json.load(open('channel.json'))
          assert c['schema']==1 and c['protocol']=='furina-update/1'
          assert c['bundle_id']=='furina-2026.08.23-rc69-rc57'
          assert len(c['core']['sha256'])==64 and len(c['client']['sha256'])==64 and len(c['apk']['sha256'])==64
          with tarfile.open('furina-core-bridge-rc69-rc57.tar','r:') as a:
              names=a.getnames()
              assert 'core/furina_agent/version.py' in names
              assert 'bridge/app/build.gradle' in names
          print('FURINA_SINGLE_PIPELINE_TARGETS_OK')
          PY

      - name: Publish RC57 and single stable update channel
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry(){ for attempt in 1 2 3 4; do "$@" && return 0; sleep $((attempt*4)); done; return 1; }
          if ! gh release view "$HUB_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            retry gh release create "$HUB_TAG" "$APK_NAME" bridge.json -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "FurinaHub v1.0.0-rc57" \
              --notes "RC57/Core RC69 moves updates to one self-updating client and one atomic channel. Existing features and user data remain intact." --prerelease
          else
            retry gh release upload "$HUB_TAG" "$APK_NAME" bridge.json -R "$GITHUB_REPOSITORY" --clobber
          fi

          # Immutable targets first. The tiny bootstrap is stable compatibility
          # glue. channel.json is the only mutable pointer and is published last.
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" \
            "$SNAPSHOT_NAME" "$CLIENT_NAME" furina-install.sh manifest.json --clobber
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" channel.json --clobber
          echo FURINA_SINGLE_PIPELINE_PUBLISHED
