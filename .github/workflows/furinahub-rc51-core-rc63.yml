name: Validate FurinaHub RC55 + Core RC67

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-rc55-core-rc67-${{ github.ref }}
  cancel-in-progress: true

env:
  HUB_TAG: furinahub-v1.0.0-rc55
  APK_NAME: FurinaHub-v1.0.0-rc55.apk
  UPDATE_CHANNEL_TAG: furina-update-stable

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate RC55 and RC67 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/android-rc46/apply.py \
            experiments/furina-agent-final/overrides/android-rc47/apply.py \
            experiments/furina-agent-final/overrides/android-rc48/apply.py \
            experiments/furina-agent-final/overrides/android-rc49/apply.py \
            experiments/furina-agent-final/overrides/android-rc50/apply.py \
            experiments/furina-agent-final/overrides/android-rc51/apply.py \
            experiments/furina-agent-final/overrides/android-rc52/apply.py \
            experiments/furina-agent-final/overrides/android-rc53/apply.py \
            experiments/furina-agent-final/overrides/android-rc54/apply.py \
            experiments/furina-agent-final/overrides/android-rc55/apply.py \
            experiments/furina-agent-final/overrides/rc62/apply.py \
            experiments/furina-agent-final/overrides/rc63/apply.py \
            experiments/furina-agent-final/overrides/rc64/apply.py \
            experiments/furina-agent-final/overrides/rc65/apply.py \
            experiments/furina-agent-final/overrides/rc66/apply.py \
            experiments/furina-agent-final/overrides/rc66/relationship_v3.py \
            experiments/furina-agent-final/overrides/rc67/apply.py \
            experiments/furina-agent-final/overrides/rc67/relationship_v4.py
          python3 - <<'PY'
          import json
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          assert m['version']=='1.0.0-rc67'
          assert m['dependency_revision']=='2026.08.22-r37'
          assert m['bundle_id']=='furina-2026.08.22-rc67-rc55'
          assert m['bridge_version']=='1.0.0-rc55'
          assert m['bridge_version_code']==10055
          assert m['image_editor_runtime']=='native-android-canvas-polished-toolbar'
          assert m['memory_search_runtime']=='fuse.js-7.5.0-local'
          assert m['dateparser_runtime']=='dateparser-1.4.2'
          assert m['ai_work_scheduler']=='ordered-microbatch-no-drop'
          assert m['termux_update_ui']=='furina-lite-panel'
          assert m['shared_workspace']=='relationship-memory-profile-local-first'
          assert m['conversation_capture']=='explicit-reviewable-memory-and-shared-moments'
          assert m['relationship_core']=='v4-partner-first-no-friendship-mode'
          assert m['fresh_memory_baseline']=='companion-name-user-name-partner-only'
          assert m['recovery']=='full-snapshot-from-any-installed-version'
          assert m['runtime_contract']=='furina-runtime/v3-full-snapshot'
          print('FURINAHUB_RC55_RC67_MANIFEST_OK')
          PY

      - name: Regress partner baseline, full snapshot, and Kita UI
        shell: bash
        run: |
          set -euo pipefail
          HOME="$RUNNER_TEMP/furina-home" FURINA_HOME="$RUNNER_TEMP/furina-home" bash experiments/furina-agent-final/overrides/runtime-r37/validate.sh
          grep -Fq "versionName '1.0.0-rc55'" /tmp/furina-agent-rc54-validate/termux/bridge/app/build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC55 debug
        if: github.event_name == 'pull_request'
        working-directory: /tmp/furina-agent-rc54-validate/termux
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Restore release signing identity
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-rc54-validate/termux
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed RC55
        if: github.event_name != 'pull_request'
        working-directory: /tmp/furina-agent-rc54-validate/termux
        env:
          FURINA_AGENT_KEYSTORE_PATH: /tmp/furina-agent-rc54-validate/termux/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify signer continuity
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=/tmp/furina-agent-rc54-validate/termux/bridge/app/build/outputs/apk/release/app-release.apk
          test -s "$SOURCE"
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10055
          test "$NAME" = 1.0.0-rc55
          rm -rf /tmp/furinahub-prev && mkdir -p /tmp/furinahub-prev
          gh release download furinahub-v1.0.0-rc54 -R "$GITHUB_REPOSITORY" -p bridge.json -D /tmp/furinahub-prev
          OLD_SIGNER="$(python3 -c 'import json; print(json.load(open("/tmp/furinahub-prev/bridge.json"))["signer_sha256"].replace(":","").lower())')"
          test "$OLD_SIGNER" = "$SIGNER"
          export PACKAGE CODE NAME SHA SIGNER
          python3 - <<'PY'
          import json,os
          data={'version':os.environ['NAME'],'version_code':int(os.environ['CODE']),'package_name':os.environ['PACKAGE'],'sha256':os.environ['SHA'],'signer_sha256':os.environ['SIGNER'],'apk_url':'https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.0.0-rc55/FurinaHub-v1.0.0-rc55.apk'}
          open('bridge.json','w').write(json.dumps(data,indent=2)+'\n')
          bundle={'schema':2,'bundle_id':'furina-2026.08.22-rc67-rc55','core_version':'1.0.0-rc67','dependency_revision':'2026.08.22-r37','bridge_version':os.environ['NAME'],'bridge_version_code':int(os.environ['CODE']),'package_name':os.environ['PACKAGE'],'apk_url':data['apk_url'],'apk_sha256':os.environ['SHA'],'signer_sha256':os.environ['SIGNER'],'snapshot_asset':'furina-core-bridge-rc67-rc55.tar','snapshot_sha256':'502df5c11809b027ec118b3209adb3a4d14ffa441b570b8da02083dc9f2b20f9'}
          open('bundle.json','w').write(json.dumps(bundle,indent=2)+'\n')
          PY

      - name: Publish RC55 and Core RC67 full-snapshot bundle
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry(){ for attempt in 1 2 3 4; do "$@" && return 0; sleep $((attempt*4)); done; return 1; }
          if ! gh release view "$HUB_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            retry gh release create "$HUB_TAG" "$APK_NAME" bridge.json bundle.json -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FurinaHub v1.0.0-rc55" --notes "Partner-first: setup baru langsung sebagai pasangan, baseline memori bersih, tanpa mode pertemanan, serta recovery Core dari full snapshot terverifikasi." --prerelease
          else
            retry gh release upload "$HUB_TAG" "$APK_NAME" bridge.json bundle.json -R "$GITHUB_REPOSITORY" --clobber
          fi
          cp experiments/furina-agent-final/manifest.json manifest.json
          cp experiments/furina-agent-final/overrides/runtime-r32/install-body.sh furina-runtime-r32.sh
          cp experiments/furina-agent-final/overrides/runtime-r33/install-body.sh furina-runtime-r33.sh
          cp experiments/furina-agent-final/overrides/runtime-r34/install-body.sh furina-runtime-r34.sh
          cp experiments/furina-agent-final/overrides/runtime-r35/install-body.sh furina-runtime-r35.sh
          cp experiments/furina-agent-final/overrides/runtime-r36/install-body.sh furina-runtime-r36.sh
          cp experiments/furina-agent-final/overrides/runtime-r37/install-body.sh furina-runtime-r37.sh
          cp experiments/furina-agent-final/overrides/rc62/apply.py core-rc62-apply.py
          cp experiments/furina-agent-final/overrides/rc63/apply.py core-rc63-apply.py
          cp experiments/furina-agent-final/overrides/rc64/apply.py core-rc64-apply.py
          cp experiments/furina-agent-final/overrides/rc64/lite_full.py core-rc64-lite-full.py
          cp experiments/furina-agent-final/overrides/rc65/apply.py core-rc65-apply.py
          cp experiments/furina-agent-final/overrides/rc66/apply.py core-rc66-apply.py
          cp experiments/furina-agent-final/overrides/rc66/relationship_v3.py core-rc66-relationship-v3.py
          cp experiments/furina-agent-final/overrides/rc67/apply.py core-rc67-apply.py
          cp experiments/furina-agent-final/overrides/rc67/relationship_v4.py core-rc67-relationship-v4.py
          cp experiments/furina-agent-final/overrides/android-rc52/apply.py android-rc52-apply.py
          cp experiments/furina-agent-final/overrides/android-rc53/apply.py android-rc53-apply.py
          cp experiments/furina-agent-final/overrides/android-rc54/apply.py android-rc54-apply.py
          cp experiments/furina-agent-final/overrides/android-rc55/apply.py android-rc55-apply.py
          cp experiments/furina-agent-final/install.sh furina-install.sh
          tar --format=ustar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --exclude='__pycache__' --exclude='*.pyc' --exclude='bridge/.gradle' --exclude='bridge/app/build' -C /tmp/furina-agent-rc54-validate/termux -cf furina-core-bridge-rc67-rc55.tar core bridge
          echo '502df5c11809b027ec118b3209adb3a4d14ffa441b570b8da02083dc9f2b20f9  furina-core-bridge-rc67-rc55.tar' | sha256sum -c -
          # Publish the complete snapshot and runtime before the public
          # installer. bundle.json remains the final atomic channel pointer.
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" furina-core-bridge-rc67-rc55.tar furina-runtime-r37.sh core-rc67-apply.py core-rc67-relationship-v4.py android-rc55-apply.py --clobber
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" manifest.json furina-runtime-r32.sh furina-runtime-r33.sh furina-runtime-r34.sh furina-runtime-r35.sh furina-runtime-r36.sh core-rc62-apply.py core-rc63-apply.py core-rc64-apply.py core-rc64-lite-full.py core-rc65-apply.py core-rc66-apply.py core-rc66-relationship-v3.py android-rc52-apply.py android-rc53-apply.py android-rc54-apply.py furina-install.sh --clobber
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" bundle.json --clobber
          echo FURINAHUB_RC55_RC67_PUBLISHED
