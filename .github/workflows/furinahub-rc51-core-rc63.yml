name: Validate FurinaHub 1.0.3 + Core 1.0.3

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
      - '.github/workflows/furina-final-audit.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
      - '.github/workflows/furina-final-audit.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: furina-private-final-${{ github.ref }}
  cancel-in-progress: true

env:
  HUB_TAG: furinahub-v1.0.3
  APK_NAME: FurinaHub-v1.0.3.apk
  UPDATE_CHANNEL_TAG: furina-update-stable
  SNAPSHOT_NAME: furina-core-bridge-private-1.0.3.tar
  CLIENT_NAME: furina-update.py
  STAGE_ROOT: /tmp/furina-agent-rc54-validate/termux

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record stable release pending
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context="furina/release-1.0.3" \
            -f description="Furina 1.0.3 stable release is running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Validate private 1.0.3 architecture
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/private-1.0.3/apply.py \
            experiments/furina-agent-final/overrides/private-1.0.3/fixup.py \
            experiments/furina-agent-final/overrides/private-1.0.3/chat_fixup.py \
            experiments/furina-agent-final/overrides/android-private-1.0.3/apply.py \
            experiments/furina-agent-final/fast-path-audit.py \
            experiments/furina-agent-final/overrides/runtime-private-1.0.1/build_client.py
          python3 - <<'PY'
          import json
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          assert m['version']=='1.0.3'
          assert m['dependency_revision']=='2026.08.24-r43'
          assert m['bundle_id']=='furina-2026.08.24-private-1.0.3'
          assert m['bridge_version']=='1.0.3' and m['bridge_version_code']==10061
          assert m['runtime_contract']=='furina-runtime/v9-local-fast-path'
          assert m['update_client_version']=='1.2.0'
          print('FURINA_PRIVATE_1_0_3_MANIFEST_OK')
          PY
          git diff --check

      - name: Reconstruct and test private 1.0.3
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/private-1.0.3/validate.sh
          python3 experiments/furina-agent-final/fast-path-audit.py "$STAGE_ROOT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build private 1.0.3 debug
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Restore release signing identity
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed private 1.0.3 APK
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        env:
          FURINA_AGENT_KEYSTORE_PATH: ${{ env.STAGE_ROOT }}/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Build verified private 1.0.3 targets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$STAGE_ROOT/bridge/app/build/outputs/apk/release/app-release.apk"
          test -s "$SOURCE"
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKANALYZER"; test -x "$APKSIGNER"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          APK_SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$APK_NAME")"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10061
          test "$NAME" = 1.0.3
          test -n "$SIGNER"

          rm -rf /tmp/furinahub-prev /tmp/furina-private-103-snapshot
          mkdir -p /tmp/furinahub-prev /tmp/furina-private-103-snapshot
          gh release download furinahub-v1.0.2 -R "$GITHUB_REPOSITORY" -p bridge.json -D /tmp/furinahub-prev
          OLD_SIGNER="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["signer_sha256"].replace(":","").lower())' /tmp/furinahub-prev/bridge.json)"
          test -n "$OLD_SIGNER"
          test "$OLD_SIGNER" = "$SIGNER"
          echo FURINA_PRIVATE_1_0_3_SIGNER_CONTINUITY_OK

          cp -a "$STAGE_ROOT/core" "$STAGE_ROOT/bridge" /tmp/furina-private-103-snapshot/
          rm -f /tmp/furina-private-103-snapshot/bridge/app/furina-agent-release.jks
          find /tmp/furina-private-103-snapshot -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/furina-private-103-snapshot -type f -name '*.pyc' -delete
          rm -rf /tmp/furina-private-103-snapshot/bridge/.gradle /tmp/furina-private-103-snapshot/bridge/app/build
          tar --sort=name --mtime='UTC 2026-08-24 00:00:00' --owner=0 --group=0 --numeric-owner \
            -cf "$SNAPSHOT_NAME" -C /tmp/furina-private-103-snapshot core bridge
          SNAPSHOT_SHA="$(sha256sum "$SNAPSHOT_NAME" | awk '{print $1}')"
          SNAPSHOT_SIZE="$(stat -c '%s' "$SNAPSHOT_NAME")"

          python3 experiments/furina-agent-final/overrides/runtime-private-1.0.1/build_client.py \
            experiments/furina-agent-final/overrides/runtime-r39/update_client.py "$CLIENT_NAME"
          CLIENT_SHA="$(sha256sum "$CLIENT_NAME" | awk '{print $1}')"
          CLIENT_SIZE="$(stat -c '%s' "$CLIENT_NAME")"
          cp experiments/furina-agent-final/install.sh furina-install.sh
          cp experiments/furina-agent-final/manifest.json manifest.json

          export PACKAGE CODE NAME APK_SHA APK_SIZE SIGNER SNAPSHOT_SHA SNAPSHOT_SIZE CLIENT_SHA CLIENT_SIZE
          python3 - <<'PY'
          import json,os,time
          apk_url='https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.0.3/FurinaHub-v1.0.3.apk'
          stable='https://github.com/WynnDev-rill/furina/releases/download/furina-update-stable'
          json.dump({'version':os.environ['NAME'],'version_code':int(os.environ['CODE']),'package_name':os.environ['PACKAGE'],'sha256':os.environ['APK_SHA'],'signer_sha256':os.environ['SIGNER'],'apk_url':apk_url},open('bridge.json','w'),indent=2)
          open('bridge.json','a').write('\n')
          channel={
            'schema':1,'protocol':'furina-update/1','bundle_id':'furina-2026.08.24-private-1.0.3','published_at':int(time.time()),
            'core':{'version':'1.0.3','revision':'2026.08.24-r43','url':stable+'/furina-core-bridge-private-1.0.3.tar','sha256':os.environ['SNAPSHOT_SHA'],'size':int(os.environ['SNAPSHOT_SIZE'])},
            'apk':{'version':os.environ['NAME'],'version_code':int(os.environ['CODE']),'package':os.environ['PACKAGE'],'url':apk_url,'sha256':os.environ['APK_SHA'],'size':int(os.environ['APK_SIZE'])},
            'client':{'version':'1.2.0','url':stable+'/furina-update.py','sha256':os.environ['CLIENT_SHA'],'size':int(os.environ['CLIENT_SIZE'])},
          }
          json.dump(channel,open('channel.json','w'),indent=2); open('channel.json','a').write('\n')
          PY
          python3 - <<'PY'
          import json,tarfile
          c=json.load(open('channel.json'))
          assert c['bundle_id']=='furina-2026.08.24-private-1.0.3'
          assert c['core']['version']=='1.0.3' and c['core']['revision']=='2026.08.24-r43'
          assert c['apk']['version']=='1.0.3' and c['apk']['version_code']==10061
          assert c['client']['version']=='1.2.0'
          with tarfile.open('furina-core-bridge-private-1.0.3.tar','r:') as a:
              names=set(a.getnames())
              for required in ('core/furina_agent/version.py','core/furina_agent/local_runtime.py','core/furina_agent/streaming.py','core/furina_agent/chat.py','bridge/app/build.gradle'):
                  assert required in names, required
          print('FURINA_PRIVATE_1_0_3_TARGETS_OK')
          PY

      - name: Publish private 1.0.3 and stable update channel
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          retry(){ for attempt in 1 2 3 4; do "$@" && return 0; sleep $((attempt*4)); done; return 1; }
          if ! gh release view "$HUB_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            retry gh release create "$HUB_TAG" "$APK_NAME" bridge.json -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "FurinaHub v1.0.3 — Local Fast Path" \
              --notes "Private 1.0.3 local fast path and runtime repair." --prerelease
          else
            retry gh release upload "$HUB_TAG" "$APK_NAME" bridge.json -R "$GITHUB_REPOSITORY" --clobber
          fi
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" \
            "$SNAPSHOT_NAME" "$CLIENT_NAME" furina-install.sh manifest.json --clobber
          # Mutable channel pointer is intentionally published last.
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" channel.json --clobber
          echo FURINA_PRIVATE_1_0_3_PUBLISHED

      - name: Record stable release result
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state=failure; description="Furina 1.0.3 stable release failed"
          if [[ "$RELEASE_JOB_STATUS" == "success" ]]; then state=success; description="Furina 1.0.3 stable release published"; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="furina/release-1.0.3" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
