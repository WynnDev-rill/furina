name: Validate and publish Furina Termux 1.1.27

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
      - '.github/workflows/furina-final-audit.yml'
      - '.github/workflows/furina-104-diagnostic.yml'
      - '.github/workflows/furina-110-diagnose.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
      - '.github/workflows/furina-final-audit.yml'
      - '.github/workflows/furina-104-diagnostic.yml'
      - '.github/workflows/furina-110-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furina-termux-private-${{ github.ref }}
  cancel-in-progress: true

env:
  UPDATE_CHANNEL_TAG: furina-update-stable
  SNAPSHOT_NAME: furina-core-termux-private-1.1.27.tar
  CLIENT_NAME: furina-update.py
  STAGE_ROOT: /tmp/furina-agent-rc54-validate/termux

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Termux-only architecture
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile experiments/furina-agent-final/overrides/private-1.2.8/apply.py experiments/furina-agent-final/overrides/runtime-private-1.2.1/build_client.py
          validation_home="$(mktemp -d)"
          HOME="$validation_home" FURINA_HOME="$validation_home" bash experiments/furina-agent-final/overrides/private-1.2.8/validate.sh
          python3 - <<'PY'
          import json
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          assert m['version']=='1.1.27'
          assert m['dependency_revision']=='2026.08.29-r77'
          assert m['bundle_id']=='furina-2026.08.29-termux-1.1.27'
          assert m['runtime_contract']=='furina-runtime/v28-output-personality-guard-termux'
          assert m['update_client_version']=='1.4.3'
          assert m['hub_update_ownership']=='retired-not-distributed'
          assert len(m['local_model_catalog'])==3
          assert m['personality_schema']==6
          assert m['training_room'].startswith('nine-category')
          print('FURINA_TERMUX_126_MANIFEST_OK')
          PY
          git diff --check

      - name: Build verified Termux targets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SNAPSHOT_ROOT="$(mktemp -d)"
          cp -a "$STAGE_ROOT/core" "$SNAPSHOT_ROOT/core"
          find "$SNAPSHOT_ROOT/core" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$SNAPSHOT_ROOT/core" -type f -name '*.pyc' -delete
          tar --sort=name --mtime='UTC 2026-08-25 00:00:00' --owner=0 --group=0 --numeric-owner -cf "$SNAPSHOT_NAME" -C "$SNAPSHOT_ROOT" core
          SNAPSHOT_SHA="$(sha256sum "$SNAPSHOT_NAME" | awk '{print $1}')"
          SNAPSHOT_SIZE="$(stat -c '%s' "$SNAPSHOT_NAME")"
          python3 experiments/furina-agent-final/overrides/runtime-private-1.2.1/build_client.py experiments/furina-agent-final/overrides/runtime-r39/update_client.py "$CLIENT_NAME"
          CLIENT_SHA="$(sha256sum "$CLIENT_NAME" | awk '{print $1}')"
          CLIENT_SIZE="$(stat -c '%s' "$CLIENT_NAME")"
          cp experiments/furina-agent-final/install.sh furina-install.sh
          cp experiments/furina-agent-final/manifest.json manifest.json
          mkdir -p /tmp/furina-previous-channel
          gh release download "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" -p channel.json -D /tmp/furina-previous-channel
          export SNAPSHOT_SHA SNAPSHOT_SIZE CLIENT_SHA CLIENT_SIZE
          python3 - <<'PY'
          import json,os,time
          previous=json.load(open('/tmp/furina-previous-channel/channel.json'))
          legacy_apk=previous.get('apk') or {}
          if not legacy_apk: raise SystemExit('legacy APK compatibility metadata missing')
          stable='https://github.com/WynnDev-rill/furina/releases/download/furina-update-stable'
          channel={
            'schema':1,'protocol':'furina-update/1','bundle_id':'furina-2026.08.29-termux-1.1.27','published_at':int(time.time()),
            'surface':'termux','apk_distribution':'retired',
            'core':{'version':'1.1.27','revision':'2026.08.29-r77','url':stable+'/furina-core-termux-private-1.1.27.tar','sha256':os.environ['SNAPSHOT_SHA'],'size':int(os.environ['SNAPSHOT_SIZE'])},
            'client':{'version':'1.4.3','url':stable+'/furina-update.py','sha256':os.environ['CLIENT_SHA'],'size':int(os.environ['CLIENT_SIZE'])},
            'apk':legacy_apk,
          }
          json.dump(channel,open('channel.json','w'),indent=2); open('channel.json','a').write('\n')
          PY
          python3 - <<'PY'
          import json,tarfile
          c=json.load(open('channel.json'))
          assert c['surface']=='termux' and c['apk_distribution']=='retired'
          with tarfile.open('furina-core-termux-private-1.1.27.tar','r:') as archive:
            names=set(archive.getnames())
            assert 'core/furina_agent/version.py' in names
            assert not any(name.startswith('bridge/') for name in names)
          print('FURINA_TERMUX_126_TARGETS_OK')
          PY

      - name: Publish stable Termux update channel
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry(){ for attempt in 1 2 3 4; do "$@" && return 0; sleep $((attempt*4)); done; return 1; }
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" "$SNAPSHOT_NAME" "$CLIENT_NAME" furina-install.sh manifest.json --clobber
          # Mutable pointer last. No APK is built or uploaded.
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" channel.json --clobber
          echo FURINA_TERMUX_126_PUBLISHED
