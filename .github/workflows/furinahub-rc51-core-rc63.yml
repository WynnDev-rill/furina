name: Validate FurinaHub 1.1.14 + Core 1.1.14

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
      - '.github/workflows/furina-final-audit.yml'
      - '.github/workflows/furina-104-diagnostic.yml'
      - '.github/workflows/furina-110-diagnose.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
      - '.github/workflows/furina-final-audit.yml'
      - '.github/workflows/furina-104-diagnostic.yml'
      - '.github/workflows/furina-110-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: furina-private-final-${{ github.ref }}
  cancel-in-progress: true

env:
  HUB_TAG: furinahub-v1.1.14
  APK_NAME: FurinaHub-v1.1.14.apk
  UPDATE_CHANNEL_TAG: furina-update-stable
  SNAPSHOT_NAME: furina-core-bridge-private-1.1.14.tar
  CLIENT_NAME: furina-update.py
  STAGE_ROOT: /tmp/furina-agent-rc54-validate/termux

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record stable release pending
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context="furina/release-1.1.14" \
            -f description="Furina 1.1.14 stable release is running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Validate private 1.1.14 architecture
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile \
            experiments/furina-agent-final/release_signer.py \
            experiments/furina-agent-final/overrides/private-1.1.5/*.py \
            experiments/furina-agent-final/overrides/android-private-1.1.5/apply.py \
            experiments/furina-agent-final/overrides/runtime-private-1.1.5/build_client.py
          python3 - <<'PY'
          import json
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          assert m['version']=='1.1.14' and m['bridge_version']=='1.1.14' and m['bridge_version_code']==10082
          assert m['dependency_revision']=='2026.08.25-r64'
          assert m['bundle_id']=='furina-2026.08.25-private-1.1.14'
          assert m['runtime_contract']=='furina-runtime/v16-personality-matrix-hub-runtime'
          assert m['hub_update_ownership']=='termux-command-only'
          assert m['personality_schema']==3 and m['personality_surface'].startswith('shared-core-20')
          assert m['local_model_response_policy'].startswith('selected-model-generates-every-conversational-turn')
          ids=[x['id'] for x in m['local_model_catalog']]
          assert ids==['wifugpt-1.7b-q4km','qwen3-1.7b-heretic-q5km','qwen3-4b-2507-uncensored-q4km']
          q=next(x for x in m['local_model_catalog'] if x['id']=='qwen3-4b-2507-uncensored-q4km')
          assert q['sha256']=='6615b7b5184931e4df9c6d0ae9cd29ca9319b73908d4423283d4cc401a12a1cd'
          assert m['update_client_version']=='1.2.0'
          print('FURINA_FINAL_115_MANIFEST_OK')
          PY
          git diff --check

      - name: Reconstruct and test private 1.1.14
        run: |
          set -euo pipefail
          validation_home="$(mktemp -d)"
          HOME="$validation_home" FURINA_HOME="$validation_home" bash experiments/furina-agent-final/overrides/private-1.1.5/validate.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build private 1.1.14 debug
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Restore release signing identity
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed private 1.1.14 APK
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        env:
          FURINA_AGENT_KEYSTORE_PATH: ${{ env.STAGE_ROOT }}/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Build verified private 1.1.14 targets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE="$STAGE_ROOT/bridge/app/build/outputs/apk/release/app-release.apk"
          test -s "$SOURCE"; cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          APK_SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"; APK_SIZE="$(stat -c '%s' "$APK_NAME")"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge; test "$CODE" = 10082; test "$NAME" = 1.1.14; test -n "$SIGNER"

          rm -rf /tmp/furinahub-prev /tmp/furina-private-115-snapshot
          mkdir -p /tmp/furinahub-prev /tmp/furina-private-115-snapshot
          gh release download furinahub-v1.0.9 -R "$GITHUB_REPOSITORY" -p bridge.json -D /tmp/furinahub-prev
          OLD_SIGNER="$(python3 experiments/furina-agent-final/release_signer.py /tmp/furinahub-prev/bridge.json)"
          test "$OLD_SIGNER" = "$SIGNER"
          echo FURINA_FINAL_115_SIGNER_CONTINUITY_OK

          cp -a "$STAGE_ROOT/core" "$STAGE_ROOT/bridge" /tmp/furina-private-115-snapshot/
          rm -f /tmp/furina-private-115-snapshot/bridge/app/furina-agent-release.jks
          find /tmp/furina-private-115-snapshot -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/furina-private-115-snapshot -type f -name '*.pyc' -delete
          rm -rf /tmp/furina-private-115-snapshot/bridge/.gradle /tmp/furina-private-115-snapshot/bridge/app/build
          tar --sort=name --mtime='UTC 2026-08-25 00:00:00' --owner=0 --group=0 --numeric-owner \
            -cf "$SNAPSHOT_NAME" -C /tmp/furina-private-115-snapshot core bridge
          SNAPSHOT_SHA="$(sha256sum "$SNAPSHOT_NAME" | awk '{print $1}')"; SNAPSHOT_SIZE="$(stat -c '%s' "$SNAPSHOT_NAME")"

          python3 experiments/furina-agent-final/overrides/runtime-private-1.1.5/build_client.py \
            experiments/furina-agent-final/overrides/runtime-r39/update_client.py "$CLIENT_NAME"
          CLIENT_SHA="$(sha256sum "$CLIENT_NAME" | awk '{print $1}')"; CLIENT_SIZE="$(stat -c '%s' "$CLIENT_NAME")"
          cp experiments/furina-agent-final/install.sh furina-install.sh
          cp experiments/furina-agent-final/manifest.json manifest.json
          export PACKAGE CODE NAME APK_SHA APK_SIZE SIGNER SNAPSHOT_SHA SNAPSHOT_SIZE CLIENT_SHA CLIENT_SIZE
          python3 - <<'PY'
          import json,os,time
          apk='https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.1.14/FurinaHub-v1.1.14.apk'
          stable='https://github.com/WynnDev-rill/furina/releases/download/furina-update-stable'
          bridge={'version':os.environ['NAME'],'version_code':int(os.environ['CODE']),'package_name':os.environ['PACKAGE'],'sha256':os.environ['APK_SHA'],'signer_sha256':os.environ['SIGNER'],'apk_url':apk}
          json.dump(bridge,open('bridge.json','w'),indent=2); open('bridge.json','a').write('\n')
          channel={'schema':1,'protocol':'furina-update/1','bundle_id':'furina-2026.08.25-private-1.1.14','published_at':int(time.time()),
            'core':{'version':'1.1.14','revision':'2026.08.25-r64','url':stable+'/furina-core-bridge-private-1.1.14.tar','sha256':os.environ['SNAPSHOT_SHA'],'size':int(os.environ['SNAPSHOT_SIZE'])},
            'apk':{'version':'1.1.14','version_code':10082,'package':os.environ['PACKAGE'],'url':apk,'sha256':os.environ['APK_SHA'],'size':int(os.environ['APK_SIZE'])},
            'client':{'version':'1.2.0','url':stable+'/furina-update.py','sha256':os.environ['CLIENT_SHA'],'size':int(os.environ['CLIENT_SIZE'])}}
          json.dump(channel,open('channel.json','w'),indent=2); open('channel.json','a').write('\n')
          PY
          python3 - <<'PY'
          import json,tarfile
          c=json.load(open('channel.json'))
          assert c['bundle_id']=='furina-2026.08.25-private-1.1.14'
          assert c['core']['version']=='1.1.14' and c['core']['revision']=='2026.08.25-r64'
          assert c['apk']['version']=='1.1.14' and c['apk']['version_code']==10082
          with tarfile.open('furina-core-bridge-private-1.1.14.tar','r:') as a:
            names=set(a.getnames())
            for required in ('core/furina_agent/version.py','core/furina_agent/memory.py','core/furina_agent/chat.py','core/furina_agent/dialogue_state.py','core/furina_agent/personality.py','core/furina_agent/hub_settings.py','core/furina_agent/local_models.py','core/furina_agent/local_runtime.py','core/furina_agent/tui.py','core/furina_agent/hub.py','bridge/app/build.gradle'):
              assert required in names,required
          print('FURINA_FINAL_115_TARGETS_OK')
          PY

      - name: Publish private 1.1.14 and stable update channel
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry(){ for attempt in 1 2 3 4; do "$@" && return 0; sleep $((attempt*4)); done; return 1; }
          if ! gh release view "$HUB_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            retry gh release create "$HUB_TAG" "$APK_NAME" bridge.json -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "FurinaHub v1.1.14 — Private Final" \
              --notes "Private Final repair: a successful authenticated Core pairing now remains Online even when package metadata needs synchronization. Metadata is shown as a nonblocking update notice rather than being allowed to overwrite connection state. The Termux updater still publishes Core and FurinaHub atomically, with installed_bundle.json as the authoritative bundle state." --prerelease
          else
            retry gh release upload "$HUB_TAG" "$APK_NAME" bridge.json -R "$GITHUB_REPOSITORY" --clobber
          fi
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" "$SNAPSHOT_NAME" "$CLIENT_NAME" furina-install.sh manifest.json --clobber
          # Mutable channel pointer is published last so clients never see an incomplete bundle.
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" channel.json --clobber
          echo FURINA_FINAL_115_PUBLISHED

      - name: Record stable release result
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: |
          state=failure; description="Furina 1.1.14 stable release failed"
          if [[ "$RELEASE_JOB_STATUS" == "success" ]]; then state=success; description="Furina 1.1.14 stable release published"; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="furina/release-1.1.14" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
