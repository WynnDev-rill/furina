name: Validate FurinaHub RC56 + Core RC68

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: furinahub-rc56-core-rc68-${{ github.ref }}
  cancel-in-progress: true

env:
  HUB_TAG: furinahub-v1.0.0-rc56
  APK_NAME: FurinaHub-v1.0.0-rc56.apk
  UPDATE_CHANNEL_TAG: furina-update-stable
  SNAPSHOT_NAME: furina-core-bridge-rc68-rc56.tar
  STAGE_ROOT: /tmp/furina-agent-rc54-validate/termux

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate RC68 r38 RC56 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/rc67/apply.py \
            experiments/furina-agent-final/overrides/rc67/relationship_v4.py \
            experiments/furina-agent-final/overrides/rc68/apply.py \
            experiments/furina-agent-final/overrides/android-rc55/apply.py \
            experiments/furina-agent-final/overrides/android-rc56/apply.py
          bash -n experiments/furina-agent-final/install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/overrides/runtime-r38/install-body.sh
          bash -n experiments/furina-agent-final/overrides/runtime-r38/validate.sh
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 - <<'PY'
          import json
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          assert m['version']=='1.0.0-rc68'
          assert m['dependency_revision']=='2026.08.23-r38'
          assert m['bundle_id']=='furina-2026.08.23-rc68-rc56'
          assert m['bridge_version']=='1.0.0-rc56'
          assert m['bridge_version_code']==10056
          assert m['update_state_schema']==6
          assert m['primary_surface']=='single-companion-chat-no-separate-us-menu'
          assert m['relationship_core']=='v4-partner-first-no-friendship-mode'
          assert m['fresh_memory_baseline']=='companion-name-user-name-partner-only'
          assert m['runtime_contract']=='furina-runtime/v4-channel-snapshot'
          assert m['apk_update_confirmation']=='installed-only-after-rc56-app-launch'
          print('FURINAHUB_RC56_RC68_MANIFEST_OK')
          PY
          git diff --check

      - name: Regress single surface full snapshot and APK confirmation
        shell: bash
        run: |
          set -euo pipefail
          HOME="$RUNNER_TEMP/furina-home" FURINA_HOME="$RUNNER_TEMP/furina-home" \
            bash experiments/furina-agent-final/overrides/runtime-r38/validate.sh
          grep -Fq "versionName '1.0.0-rc56'" "$STAGE_ROOT/bridge/app/build.gradle"
          ! grep -Fq 'data-view="relationship"' "$STAGE_ROOT/bridge/app/src/main/assets/furinahub/index.html"
          grep -Fq 'furina-apk-confirm' "$STAGE_ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/MainActivity.java"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RC56 debug
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        run: gradle --no-daemon --stacktrace :bridge:app:assembleDebug

      - name: Restore release signing identity
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > bridge/app/furina-agent-release.jks
          chmod 600 bridge/app/furina-agent-release.jks

      - name: Build signed RC56
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.STAGE_ROOT }}
        env:
          FURINA_AGENT_KEYSTORE_PATH: ${{ env.STAGE_ROOT }}/bridge/app/furina-agent-release.jks
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :bridge:app:assembleRelease

      - name: Verify signer and build atomic snapshot
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE="$STAGE_ROOT/bridge/app/build/outputs/apk/release/app-release.apk"
          test -s "$SOURCE"
          cp "$SOURCE" "$APK_NAME"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          PACKAGE="$("$APKANALYZER" manifest application-id "$APK_NAME" | tr -d '\r')"
          CODE="$("$APKANALYZER" manifest version-code "$APK_NAME" | tr -d '\r')"
          NAME="$("$APKANALYZER" manifest version-name "$APK_NAME" | tr -d '\r')"
          SHA="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          CERT="$("$APKSIGNER" verify --verbose --print-certs "$APK_NAME")"
          SIGNER="$(printf '%s\n' "$CERT" | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$PACKAGE" = com.wynndev.furinaagentbridge
          test "$CODE" = 10056
          test "$NAME" = 1.0.0-rc56

          rm -rf /tmp/furinahub-prev /tmp/furina-snapshot-rc68
          mkdir -p /tmp/furinahub-prev /tmp/furina-snapshot-rc68
          gh release download furinahub-v1.0.0-rc55 -R "$GITHUB_REPOSITORY" -p bridge.json -D /tmp/furinahub-prev
          OLD_SIGNER="$(python3 -c 'import json; print(json.load(open("/tmp/furinahub-prev/bridge.json"))["signer_sha256"].replace(":","").lower())')"
          test "$OLD_SIGNER" = "$SIGNER"

          cp -a "$STAGE_ROOT/core" "$STAGE_ROOT/bridge" /tmp/furina-snapshot-rc68/
          rm -f /tmp/furina-snapshot-rc68/bridge/app/furina-agent-release.jks
          find /tmp/furina-snapshot-rc68 -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/furina-snapshot-rc68 -type f -name '*.pyc' -delete
          rm -rf /tmp/furina-snapshot-rc68/bridge/.gradle /tmp/furina-snapshot-rc68/bridge/app/build
          tar --sort=name --mtime='UTC 2026-08-23 00:00:00' --owner=0 --group=0 --numeric-owner \
            -cf "$SNAPSHOT_NAME" -C /tmp/furina-snapshot-rc68 core bridge
          SNAPSHOT_SHA="$(sha256sum "$SNAPSHOT_NAME" | awk '{print $1}')"

          export PACKAGE CODE NAME SHA SIGNER SNAPSHOT_SHA
          python3 - <<'PY'
          import json,os
          data={
            'version':os.environ['NAME'],
            'version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],
            'sha256':os.environ['SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'apk_url':'https://github.com/WynnDev-rill/furina/releases/download/furinahub-v1.0.0-rc56/FurinaHub-v1.0.0-rc56.apk',
          }
          open('bridge.json','w').write(json.dumps(data,indent=2)+'\n')
          bundle={
            'schema':2,
            'bundle_id':'furina-2026.08.23-rc68-rc56',
            'core_version':'1.0.0-rc68',
            'dependency_revision':'2026.08.23-r38',
            'bridge_version':os.environ['NAME'],
            'bridge_version_code':int(os.environ['CODE']),
            'package_name':os.environ['PACKAGE'],
            'apk_url':data['apk_url'],
            'apk_sha256':os.environ['SHA'],
            'signer_sha256':os.environ['SIGNER'],
            'snapshot_asset':'furina-core-bridge-rc68-rc56.tar',
            'snapshot_sha256':os.environ['SNAPSHOT_SHA'],
          }
          open('bundle.json','w').write(json.dumps(bundle,indent=2)+'\n')
          PY
          python3 - <<'PY'
          import json,tarfile
          b=json.load(open('bundle.json'))
          assert b['schema']==2 and len(b['snapshot_sha256'])==64
          with tarfile.open('furina-core-bridge-rc68-rc56.tar','r:') as a:
              names=a.getnames()
              assert 'core/furina_agent/version.py' in names
              assert 'bridge/app/build.gradle' in names
          print('FURINA_RC68_RC56_RELEASE_BUNDLE_OK')
          PY

      - name: Publish RC56 and RC68 r38 stable bundle
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry(){ for attempt in 1 2 3 4; do "$@" && return 0; sleep $((attempt*4)); done; return 1; }
          if ! gh release view "$HUB_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            retry gh release create "$HUB_TAG" "$APK_NAME" bridge.json bundle.json -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "FurinaHub v1.0.0-rc56" \
              --notes "RC56 removes the separate Kita navigation while preserving Partner Core. RC68/r38 makes furina update recover from a verified full snapshot and only marks the APK installed after RC56 actually launches." --prerelease
          else
            retry gh release upload "$HUB_TAG" "$APK_NAME" bridge.json bundle.json -R "$GITHUB_REPOSITORY" --clobber
          fi

          cp experiments/furina-agent-final/manifest.json manifest.json
          cp experiments/furina-agent-final/overrides/runtime-r38/install-body.sh furina-runtime-r38.sh
          cp experiments/furina-agent-final/overrides/rc68/apply.py core-rc68-apply.py
          cp experiments/furina-agent-final/overrides/android-rc56/apply.py android-rc56-apply.py
          cp experiments/furina-agent-final/install.sh furina-install.sh

          # Publish immutable payloads first. The installer is next; bundle.json
          # remains the final atomic channel pointer. r38 retries while that
          # pointer is transitioning, so a user cannot commit a mixed bundle.
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" \
            "$SNAPSHOT_NAME" furina-runtime-r38.sh core-rc68-apply.py android-rc56-apply.py --clobber
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" \
            manifest.json furina-install.sh --clobber
          retry gh release upload "$UPDATE_CHANNEL_TAG" -R "$GITHUB_REPOSITORY" bundle.json --clobber
          echo FURINAHUB_RC56_RC68_R38_PUBLISHED
