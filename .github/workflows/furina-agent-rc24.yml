name: Historical FurinaHub Android RC24 + Core RC40

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct historical RC40 and Android RC24
        shell: bash
        run: bash experiments/furina-agent-final/overrides/android-rc24/validate.sh
