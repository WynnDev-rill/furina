name: Furina 1.1.0 Diagnose
on:
  pull_request:
    branches: [experiment/furina-agent-termux]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct current private runtime
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/private-1.0.9/validate.sh
      - name: Inspect active runtime surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/furina-agent-final/overrides/private-1.1.0/diagnose.py /tmp/furina-agent-rc54-validate/termux
