name: RC15 Furina Complete Paste Smoke

on:
  push:
    branches:
      - experiment/furina-agent-termux
      - fix/furina-full-multiline-paste-rc15
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/rc15-full-paste-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paste-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble RC15 and verify complete multiline paste
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux

          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"

          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes()
              assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve()
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          PY

          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py apply-core-rc14.py apply-core-rc15.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done

          python3 -m compileall -q "$ROOT/core/furina_agent"
          python3 -m pip install -q 'rich>=13.9,<15' 'textual==8.2.8'

          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          import asyncio
          from textual import events
          from textual.app import App, ComposeResult
          from furina_agent.paste_input import FullPasteInput

          class PasteApp(App):
              def compose(self) -> ComposeResult:
                  yield FullPasteInput(id='composer', max_length=0)

          async def check():
              payload = 'START-PASTE\n' + ('baris panjang 0123456789 abcdefghijklmnopqrstuvwxyz\n' * 5000) + 'END-PASTE'
              assert len(payload) > 250_000
              app = PasteApp()
              async with app.run_test() as pilot:
                  composer = app.query_one('#composer', FullPasteInput)
                  composer.focus()
                  composer.post_message(events.Paste(payload))
                  await pilot.pause()
                  assert composer.value == payload
                  assert composer.value.startswith('START-PASTE\n')
                  assert composer.value.endswith('END-PASTE')
                  assert composer.value.count('\n') == 5001
                  assert composer.max_length == 0
              print('RC15_FULL_PASTE_OK', len(payload))

          asyncio.run(check())
          PY

          grep -q 'VERSION = "1.0.0-rc15"' "$ROOT/core/furina_agent/version.py"
          grep -q 'FullPasteInput' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'RC15: full multiline paste' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'class FullPasteInput(Input):' "$ROOT/core/furina_agent/paste_input.py"
          grep -q 'self.insert_text_at_cursor(text)' "$ROOT/core/furina_agent/paste_input.py"
          grep -q 'CORE_RC15_TRANSFORM_URL=' "$META/install.sh"
          grep -q "CORE_RC15_TRANSFORM_BLOB=\"$(git hash-object "$META/overrides/apply-core-rc15.py")\"" "$META/install.sh"
          grep -q 'apply-core-rc15.py' "$META/install.sh"
          grep -q 'run_quiet "Memasang Furina Core RC15"' "$META/install.sh"
          test "$(python3 -c 'import json; print(json.load(open("experiments/furina-agent-final/manifest.json"))["version"])')" = '1.0.0-rc15'
          bash -n "$META/install.sh"
          git diff --check
          echo RC15_COMPLETE_PASTE_SMOKE_OK
