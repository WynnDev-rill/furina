name: Furina 1.0.10 Diagnostic

on:
  push:
    branches: [fix/personality-hub-1.0.10]
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - '.github/workflows/furina-1.0.10-diagnose.yml'
      - 'experiments/furina-agent-final/overrides/private-1.0.10/**'
      - 'experiments/furina-agent-final/overrides/android-private-1.0.10/**'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct 1.0.9 and inspect runtime surfaces
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/private-1.0.9/validate.sh /tmp/furina-109
          python3 - <<'PY'
          from pathlib import Path
          import ast,re
          root=Path('/tmp/furina-109/core/furina_agent')
          def methods(path, cls=None, names=()):
              text=path.read_text(encoding='utf-8')
              tree=ast.parse(text)
              scope=tree.body
              if cls:
                  c=next((n for n in tree.body if isinstance(n,ast.ClassDef) and n.name==cls),None)
                  scope=c.body if c else []
              lines=text.splitlines()
              for n in scope:
                  if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and (not names or n.name in names):
                      print(f'\n===== {path.name}:{cls+"." if cls else ""}{n.name} =====')
                      print('\n'.join(lines[n.lineno-1:n.end_lineno]))
          print('\n===== CONFIG HEAD =====')
          print('\n'.join((root/'config.py').read_text().splitlines()[:320]))
          methods(root/'tui.py', names=('run_tui','settings','provider_and_model','change_model','chat','main'))
          methods(root/'hub.py','Runtime',('health','public_job','chat','start_chat','settings','change_model','model_catalog','update_settings','get_chat_progress'))
          methods(root/'hub.py','Handler',('do_GET','do_POST'))
          methods(root/'llm.py','LocalLLM',('_request_once','chat'))
          html=Path('/tmp/furina-109/bridge/app/src/main/assets/furinahub/index.html').read_text(encoding='utf-8')
          for needle in ['Personalisasi','personalis','Cek pembaruan','update','model','setInterval','setTimeout','/api/chat/progress','/api/model','/api/settings']:
              print(f'\n===== HTML SEARCH {needle!r} =====')
              for m in list(re.finditer(re.escape(needle),html,re.I))[:12]:
                  a=max(0,m.start()-700); b=min(len(html),m.end()+1400)
                  print(html[a:b].replace('><','>\n<'))
                  print('\n---')
          PY
