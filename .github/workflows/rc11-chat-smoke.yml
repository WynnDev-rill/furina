name: RC11 Chat Surface Smoke

on:
  push:
    branches:
      - experiment/furina-agent-termux
      - fix/furina-rc11-chat-runtime-padding
    paths:
      - 'experiments/furina-agent-final/overrides/core/furina_agent/chat_surface.py'
      - 'experiments/furina-agent-final/overrides/tests/smoke_chat_surface.py'
      - '.github/workflows/rc11-chat-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mount RC11 chat surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'rich>=13.9,<15' 'textual==8.2.8'
          CORE="$GITHUB_WORKSPACE/experiments/furina-agent-final/overrides/core"
          CHAT="$CORE/furina_agent/chat_surface.py"
          grep -q 'padding: 0 1;' "$CHAT"
          ! grep -q ', False)' "$CHAT"
          PYTHONPATH="$CORE" python3 "$GITHUB_WORKSPACE/experiments/furina-agent-final/overrides/tests/smoke_chat_surface.py"
