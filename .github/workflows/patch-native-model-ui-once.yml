name: One-time native model UI migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-native-model-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch native model UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/native.tsx')
          text = path.read_text()

          old_models = '''const FALLBACK_MODELS: NativeModel[] = [
            {
              id: "qwen35-4b-deckard-heretic-q4km",
              name: "Qwen3.5 4B Deckard Heretic",
              subtitle: "Uncensored · natural companion · Q4_K_M",
              expectedBytes: 2_708_805_792,
              recommended: true,
            },
          ];'''
          new_models = '''const FALLBACK_MODELS: NativeModel[] = [
            {
              id: "wifugpt-1.7b-q4km",
              name: "wifuGPT 1.7B",
              subtitle: "Uncensored · companion & roleplay · Q4_K_M",
              expectedBytes: 1_107_408_480,
              recommended: true,
            },
            {
              id: "qwen3-1.7b-heretic-q5km",
              name: "Qwen3 1.7B Heretic",
              subtitle: "Uncensored · natural companion · Q5_K_M",
              expectedBytes: 1_257_880_480,
              recommended: false,
            },
          ];'''

          old_copy = 'Deckard Heretic 4B tetap tersedia sebagai mesin offline. Dipakai saat mode Mesin AI diatur ke Lokal.'
          new_copy = 'Pilih wifuGPT 1.7B atau Qwen3 1.7B Heretic sebagai mesin offline. Setelah unduhan dan verifikasi selesai, model aktif bisa langsung diuji di percakapan.'

          old_download = '''      b.startModelDownload(model.id);
                toast.success(`Download ${model.name} dimulai di latar belakang`);'''
          new_download = '''      b.selectModel(model.id);
                setSelectedModel(model.id);
                b.startModelDownload(model.id);
                toast.success(`Download ${model.name} dimulai di latar belakang`);'''

          for label, old, new in [
              ('fallback models', old_models, new_models),
              ('model copy', old_copy, new_copy),
              ('auto-select download', old_download, new_download),
          ]:
              if old not in text:
                  raise SystemExit(f'Expected {label} pattern not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          grep -q 'wifuGPT 1.7B' src/routes/native.tsx
          grep -q 'Qwen3 1.7B Heretic' src/routes/native.tsx
          ! grep -q 'Deckard Heretic 4B tetap tersedia' src/routes/native.tsx
          grep -q 'setSelectedModel(model.id)' src/routes/native.tsx

      - name: Commit native UI migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/native.tsx
          git commit -m 'Update native local model choices to 1.7B companions'
          git push origin HEAD:main
