name: RC18 temporal release self-patch v3

on:
  push:
    branches:
      - agent/rc18-temporal-session-fix
    paths:
      - '.github/workflows/rc18-temporal-selfpatch-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc18-temporal-session-fix
          fetch-depth: 0

      - name: Apply corrected RC18 release wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import textwrap
          from pathlib import Path

          source = Path('.github/workflows/rc18-temporal-selfpatch-v2.yml').read_text(encoding='utf-8')
          code = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          code = textwrap.dedent(code)
          filtered = []
          for line in code.splitlines():
              stripped = line.strip()
              if stripped.startswith('marker=') or stripped.startswith('checks=') or stripped.startswith("w=once(w,marker"):
                  continue
              filtered.append(line)
          code = '\n'.join(filtered) + '\n'
          exec(compile(code, '<rc18-release-wiring>', 'exec'), {})
          PY
          bash -n experiments/furina-agent-final/install.sh
          git diff --check

      - name: Commit release wiring and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rc18-temporal-selfpatch.yml \
                .github/workflows/rc18-temporal-selfpatch-v2.yml \
                .github/workflows/rc18-temporal-selfpatch-v3.yml
          git config user.name "Wynn Dev"
          git config user.email "indonesiafilmku@gmail.com"
          git add experiments/furina-agent-final/install.sh \
                  experiments/furina-agent-final/manifest.json \
                  .github/workflows/furina-agent-bridge-experiment.yml \
                  .github/workflows/rc18-temporal-selfpatch.yml \
                  .github/workflows/rc18-temporal-selfpatch-v2.yml \
                  .github/workflows/rc18-temporal-selfpatch-v3.yml
          git commit -m "Wire RC18 temporal session release"
          git push origin HEAD:agent/rc18-temporal-session-fix
