name: Build Furina WebView APK

on:
  push:
    branches:
      - app/webview-2026-07-06
    paths:
      - 'webview-android/**'
      - '.github/workflows/build-furina-webview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-webview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes Android SDK cmdline-tools.
      # The legacy setup-android action tries to install the removed 'tools' package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APK
        run: gradle --no-daemon -p webview-android :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp webview-android/app/build/outputs/apk/debug/app-debug.apk dist/Furina-WebView-July6.apk
          sha256sum dist/Furina-WebView-July6.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Furina-WebView-July6
          path: dist/
      - name: Publish APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view furina-webview-july6 >/dev/null 2>&1; then
            gh release upload furina-webview-july6 dist/Furina-WebView-July6.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create furina-webview-july6 dist/Furina-WebView-July6.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Furina WebView — Lovable July 6 snapshot" \
              --notes "Installable standalone WebView APK. Opens https://preview--furina.lovable.app/ (hosted preview; requires site to remain accessible). Separate app ID from previous Furina APK. Debug signing is not a persistent production signature."
          fi
