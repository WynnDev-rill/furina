name: Temp sync RC13 installer
on:
  push:
    branches: [feature/furina-direct-device-control-rc13]
    paths:
      - '.github/workflows/tmp-rc13-sync-installer.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/furina-direct-device-control-rc13
      - name: Enable AndroidX and repin installer
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          TRANSFORM="$META/overrides/apply-bridge-rc8.py"
          INSTALLER="$META/install.sh"
          python3 - "$TRANSFORM" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          anchor='''    for p in (gradle, manifest, server, runtime, boot):\n        if not p.is_file():\n            raise SystemExit(f"missing Bridge RC8 source: {p}")\n\n'''
          addition='''    for p in (gradle, manifest, server, runtime, boot):\n        if not p.is_file():\n            raise SystemExit(f"missing Bridge RC8 source: {p}")\n\n    gradle_props = root / "gradle.properties"\n    props = gradle_props.read_text(encoding="utf-8") if gradle_props.exists() else ""\n    if not any(line.strip() == "android.useAndroidX=true" for line in props.splitlines()):\n        props = props.rstrip() + "\\nandroid.useAndroidX=true\\n"\n        gradle_props.write_text(props, encoding="utf-8")\n\n'''
          if 'android.useAndroidX=true' not in s:
              if s.count(anchor)!=1: raise SystemExit('Bridge RC8 gradle.properties anchor mismatch')
              s=s.replace(anchor,addition,1)
              p.write_text(s,encoding='utf-8')
          PY
          BRIDGE_SHA="$(git hash-object "$TRANSFORM")"
          python3 - "$INSTALLER" "$BRIDGE_SHA" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(encoding='utf-8'); sha=sys.argv[2]
          s,n=re.subn(r'BRIDGE_RC8_TRANSFORM_BLOB="[0-9a-f]{40}"',f'BRIDGE_RC8_TRANSFORM_BLOB="{sha}"',s,count=1)
          if n!=1: raise SystemExit('Bridge RC8 installer pin missing')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Wynn Dev'
          git config user.email 'indonesiafilmku@gmail.com'
          git add "$TRANSFORM" "$INSTALLER"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: enable AndroidX for Shizuku Bridge RC8'
          git push origin HEAD:feature/furina-direct-device-control-rc13
