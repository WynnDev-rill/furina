name: Temp sync RC13 installer
on:
  push:
    branches: [feature/furina-direct-device-control-rc13]
    paths:
      - '.github/workflows/tmp-rc13-sync-installer.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/furina-direct-device-control-rc13
      - shell: bash
        env:
          SETTINGS_B64: ""
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          python3 - "$META/overrides/apply-core-rc13.py" "$SETTINGS_B64" <<'PY'
          import base64,pathlib,sys
          p=pathlib.Path(sys.argv[1]); replacement=base64.b64decode(sys.argv[2]).decode(); s=p.read_text()
          start=s.index('    # Settings only: status stays outside chat to keep conversation clean.\n')
          end=s.index('    tui.write_text(t, encoding="utf-8")\n',start)+len('    tui.write_text(t, encoding="utf-8")\n')
          p.write_text(s[:start]+replacement+s[end:])
          PY
          CORE_SHA="$(git hash-object "$META/overrides/apply-core-rc13.py")"
          BRIDGE_SHA="$(git hash-object "$META/overrides/apply-bridge-rc8.py")"
          python3 - "$META/install.sh" "$CORE_SHA" "$BRIDGE_SHA" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(); core,bridge=sys.argv[2:]
          s,n=re.subn(r'CORE_RC13_TRANSFORM_BLOB="[0-9a-f]{40}"',f'CORE_RC13_TRANSFORM_BLOB="{core}"',s,count=1); assert n==1
          s,n=re.subn(r'BRIDGE_RC8_TRANSFORM_BLOB="[0-9a-f]{40}"',f'BRIDGE_RC8_TRANSFORM_BLOB="{bridge}"',s,count=1); assert n==1
          p.write_text(s)
          PY
          git config user.name 'Wynn Dev'
          git config user.email 'indonesiafilmku@gmail.com'
          git add "$META/overrides/apply-core-rc13.py" "$META/install.sh"
          git commit -m 'fix: make RC13 settings transform deterministic'
          git push origin HEAD:feature/furina-direct-device-control-rc13
