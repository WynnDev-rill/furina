name: Historical FurinaHub Android RC25 + Core RC41

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct historical RC41 and Android RC25
        shell: bash
        run: bash experiments/furina-agent-final/overrides/android-rc25/validate.sh
