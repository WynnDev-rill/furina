name: RC68 R38 Update Boundary Regression

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  workflow_dispatch:

jobs:
  boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify r38 bootstrap integrity
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          bash -n experiments/furina-agent-final/overrides/runtime-r38/install-body.sh
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/rc68/apply.py \
            experiments/furina-agent-final/overrides/android-rc56/apply.py
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          runtime=Path('experiments/furina-agent-final/overrides/runtime-r38/install-body.sh')
          installer=Path('experiments/furina-agent-final/install.sh')
          data=runtime.read_bytes()
          blob=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
          text=installer.read_text()
          m=re.search(r'^BODY_BLOB="([^"]+)"',text,re.M); assert m
          assert m.group(1)==blob,(m.group(1),blob)
          assert 'BODY_PATH="overrides/runtime-r38/install-body.sh"' in text
          assert 'RUNTIME_CONTRACT="furina-runtime/v4-channel-snapshot"' in text
          assert 'fetch_verified_body' in text
          assert 'schema not in (1,2)' in runtime.read_text()
          print('FURINA_R38_BOOTSTRAP_HASH_OK')
          PY

      - name: Run full updater and APK confirmation regression
        shell: bash
        run: |
          set -euo pipefail
          HOME="$RUNNER_TEMP/furina-home" FURINA_HOME="$RUNNER_TEMP/furina-home" \
            bash experiments/furina-agent-final/overrides/runtime-r38/validate.sh

      - name: Verify release boundary is atomic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/furinahub-rc51-core-rc63.yml').read_text()
          runtime=Path('experiments/furina-agent-final/overrides/runtime-r38/install-body.sh').read_text()
          rc68=Path('experiments/furina-agent-final/overrides/rc68/apply.py').read_text()
          rc56=Path('experiments/furina-agent-final/overrides/android-rc56/apply.py').read_text()
          installer=Path('experiments/furina-agent-final/install.sh').read_text()
          assert wf.rfind('bundle.json --clobber') > wf.rfind('furina-install.sh --clobber')
          assert wf.rfind('bundle.json --clobber') > wf.rfind('furina-runtime-r38.sh')
          assert "furina-core-bridge-rc68-rc56.tar" in wf
          assert "snapshot_sha256" in wf and "schema':2" in wf
          assert 'printf \'%s\\n\' "$BUNDLE_ID" >"$marker"' not in runtime
          assert 'furina-apk-confirm' in runtime and 'wrong-bundle' not in runtime
          assert '"Kita"' not in [x for x in rc68.splitlines() if 'choice = _choose("", ["Chat"' in x][-1]
          assert 'data-view="relationship"' in rc56
          assert 'FURINA_UPDATER_GENERATION="23"' in installer
          print('FURINA_RC68_R38_RELEASE_BOUNDARY_OK')
          PY
          git diff --check
