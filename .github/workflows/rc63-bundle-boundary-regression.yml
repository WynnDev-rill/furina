name: Furina Private 1.0.5 Boundary Regression

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  workflow_dispatch:

jobs:
  boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce updater and legacy recovery boundary
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/private-1.0.5/*.py \
            experiments/furina-agent-final/overrides/android-private-1.0.5/apply.py \
            experiments/furina-agent-final/conversation-quality-audit.py \
            experiments/furina-agent-final/overrides/runtime-private-1.0.1/build_client.py
          TMP="$(mktemp -d)"; trap 'rm -rf "$TMP"' EXIT
          python3 experiments/furina-agent-final/overrides/runtime-private-1.0.1/build_client.py \
            experiments/furina-agent-final/overrides/runtime-r39/update_client.py "$TMP/furina-update.py"
          python3 - <<'PY'
          from pathlib import Path
          installer=Path('experiments/furina-agent-final/install.sh').read_text()
          active='\n'.join(x for x in installer.splitlines() if not x.lstrip().startswith('#'))
          assert 'FURINA_INSTALLER_ID="furinahub-core-bootstrap-v2"' in installer
          assert 'FURINA_RUNTIME_CONTRACT="furina-runtime/v2"' in installer
          for token in ('FURINA_UPDATER_GENERATION="30"','VERSION="1.0.5"','DEPENDENCY_REVISION="2026.08.24-r45"','RUNTIME_CONTRACT="furina-runtime/v11-conversation-quality"','UPDATE_PROTOCOL="furina-update/1"','pkg install -y llama-cpp'):
              assert token in active,token
          assert '.gguf' not in active.lower() and 'wifugpt' not in active.lower()
          print('FURINA_PRIVATE_1_0_5_RECOVERY_BOUNDARY_OK')
          PY
          python3 - "$TMP/furina-update.py" <<'PY'
          from pathlib import Path
          import sys
          client=Path(sys.argv[1]).read_text()
          assert 'PROTOCOL = "furina-update/1"' in client and 'CLIENT_VERSION = "1.2.0"' in client
          assert 'safe_extract' in client and 'commit_snapshot' in client and 'maybe_reexec' in client
          assert 'def uninstall_termux' in client and '"hapus"' in client
          assert 'requests' not in client and 'pip install' not in client
          print('FURINA_PRIVATE_1_0_5_ONE_CLIENT_OK')
          PY
      - name: Test 1.0.5 reconstruction and quality contract
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/private-1.0.5/validate.sh
          python3 experiments/furina-agent-final/conversation-quality-audit.py /tmp/furina-agent-rc54-validate/termux
      - name: Enforce channel-last publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          wf=Path('.github/workflows/furinahub-rc51-core-rc63.yml').read_text()
          manifest=json.load(open('experiments/furina-agent-final/manifest.json'))
          publish=wf[wf.index('- name: Publish private 1.0.5 and stable update channel'):]
          last=publish.rfind('channel.json --clobber')
          assert last>publish.rfind('furina-install.sh') and last>publish.rfind('"$CLIENT_NAME"') and last>publish.rfind('"$SNAPSHOT_NAME"')
          assert manifest['version']=='1.0.5' and manifest['bridge_version']=='1.0.5'
          assert manifest['bundle_id']=='furina-2026.08.24-private-1.0.5'
          assert manifest['update_client_version']=='1.2.0'
          assert manifest['shared_personal_context'].startswith('provider-neutral')
          assert manifest['local_model_history'].startswith('assistant-history-opt-in')
          assert manifest['temporal_facts'].startswith('core-deterministic')
          assert manifest['hub_render_policy']=='live-chat-never-full-conversation-rerender'
          assert manifest['local_model_policy']=='on-demand-download-only-never-first-install'
          print('FURINA_PRIVATE_1_0_5_CHANNEL_LAST_OK')
          PY
          git diff --check
