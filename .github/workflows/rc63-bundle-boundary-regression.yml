name: Furina Single Pipeline Boundary Regression

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  workflow_dispatch:

jobs:
  boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce one active update path
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile experiments/furina-agent-final/overrides/runtime-r39/update_client.py
          python3 - <<'PY'
          from pathlib import Path
          installer=Path('experiments/furina-agent-final/install.sh').read_text()
          active='\n'.join(line for line in installer.splitlines() if not line.lstrip().startswith('#'))
          client=Path('experiments/furina-agent-final/overrides/runtime-r39/update_client.py').read_text()
          assert 'FURINA_INSTALLER_ID="furinahub-core-bootstrap-v2"' in installer
          assert 'UPDATE_PROTOCOL="furina-update/1"' in active
          assert 'CHANNEL_URL="$STABLE_RELEASE/channel.json"' in active
          assert 'BODY_BLOB=' not in active
          assert 'runtime-r38/install-body.sh' not in active
          assert 'fetch_verified_body' not in active
          assert 'Compatibility ledger' in installer
          assert 'FURINA_UPDATER_GENERATION="23"' in installer
          assert 'BUNDLE_ID="furina-2026.08.23-rc68-rc56"' in installer
          assert 'FURINA_RUNTIME_CONTRACT="furina-runtime/v2"' in installer
          assert 'PROTOCOL = "furina-update/1"' in client
          assert 'installed_is_current(root, channel)' in client
          assert 'maybe_reexec' in client
          assert 'commit_snapshot' in client
          assert 'safe_extract' in client
          assert 'requests' not in client and 'pip install' not in client
          assert client.count('sync_apk(') >= 2
          print('FURINA_ONE_ACTIVE_UPDATE_PATH_OK')
          PY

      - name: Gate deployed RC67 recovery bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, tarfile
          from pathlib import Path

          installer = Path('experiments/furina-agent-final/install.sh').read_text(encoding='utf-8')
          parts = sorted(Path('experiments/furina-agent-final/overrides/runtime-r37/snapshot-parts').glob('part-*'))
          assert parts, 'RC67 snapshot parts missing'
          archive = b''.join(p.read_bytes() for p in parts)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as tf:
              cli = tf.extractfile('core/furina_agent/cli.py').read().decode('utf-8')
          required = (
              'FURINA_INSTALLER_ID="furinahub-core-bootstrap-v2"',
              'FURINA_RUNTIME_CONTRACT="furina-runtime/v2"',
          )
          assert 'Recovery tidak dapat diambil.' in cli
          assert 'kontrak installer tidak lengkap' in cli
          for marker in required:
              assert marker in cli, f'deployed RC67 gate changed: {marker}'
              assert marker in installer, f'bootstrap cannot cross deployed RC67 gate: {marker}'
          print('FURINA_DEPLOYED_RC67_RECOVERY_GATE_OK')
          PY

      - name: Test install update no-op repair and APK confirmation
        shell: bash
        run: |
          set -euo pipefail
          HOME="$RUNNER_TEMP/furina-home" FURINA_HOME="$RUNNER_TEMP/furina-home" \
            bash experiments/furina-agent-final/overrides/runtime-r39/validate.sh

      - name: Enforce atomic publication boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/furinahub-rc51-core-rc63.yml').read_text()
          manifest=Path('experiments/furina-agent-final/manifest.json').read_text()
          publish=wf[wf.index('- name: Publish RC57 and single stable update channel'):]
          assert publish.rfind('channel.json --clobber') > publish.rfind('furina-install.sh')
          assert publish.rfind('channel.json --clobber') > publish.rfind('"$CLIENT_NAME"')
          assert publish.rfind('channel.json --clobber') > publish.rfind('"$SNAPSHOT_NAME"')
          assert 'bundle.json --clobber' not in publish
          assert 'furina-runtime-r38.sh' not in publish
          assert 'core-rc68-apply.py' not in publish
          assert 'android-rc56-apply.py' not in publish
          assert '"legacy_patch_chain": "build-time-only-not-device-update-path"' in manifest
          print('FURINA_ATOMIC_CHANNEL_LAST_OK')
          PY
          git diff --check
