name: Furina Private 1.0.3 Boundary Regression

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  workflow_dispatch:

jobs:
  boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce updater, installer and legacy recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          bash -n furina-agent-termux/experiments/furina-agent-final/install.sh
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          python3 -m py_compile \
            experiments/furina-agent-final/overrides/runtime-r39/update_client.py \
            experiments/furina-agent-final/overrides/runtime-private-1.0.1/build_client.py \
            experiments/furina-agent-final/overrides/private-1.0.3/apply.py \
            experiments/furina-agent-final/overrides/android-private-1.0.3/apply.py \
            experiments/furina-agent-final/fast-path-audit.py
          TMP="$(mktemp -d)"; trap 'rm -rf "$TMP"' EXIT
          python3 experiments/furina-agent-final/overrides/runtime-private-1.0.1/build_client.py \
            experiments/furina-agent-final/overrides/runtime-r39/update_client.py "$TMP/furina-update.py"
          python3 - <<'PY'
          from pathlib import Path
          installer=Path('experiments/furina-agent-final/install.sh').read_text()
          active='\n'.join(x for x in installer.splitlines() if not x.lstrip().startswith('#'))
          assert 'FURINA_INSTALLER_ID="furinahub-core-bootstrap-v2"' in installer
          assert 'FURINA_RUNTIME_CONTRACT="furina-runtime/v2"' in installer
          assert 'FURINA_UPDATER_GENERATION="28"' in active
          assert 'VERSION="1.0.3"' in active
          assert 'DEPENDENCY_REVISION="2026.08.24-r43"' in active
          assert 'RUNTIME_CONTRACT="furina-runtime/v9-local-fast-path"' in active
          assert 'UPDATE_PROTOCOL="furina-update/1"' in active
          assert 'pkg install -y llama-cpp' in active
          assert 'CHANNEL_URL="$STABLE_RELEASE/channel.json"' in active
          assert 'BODY_BLOB=' not in active and 'fetch_verified_body' not in active
          assert '.gguf' not in active.lower() and 'wifugpt' not in active.lower()
          print('FURINA_PRIVATE_1_0_3_RECOVERY_BOUNDARY_OK')
          PY
          python3 - "$TMP/furina-update.py" <<'PY'
          from pathlib import Path
          import sys
          client=Path(sys.argv[1]).read_text()
          assert 'PROTOCOL = "furina-update/1"' in client
          assert 'CLIENT_VERSION = "1.2.0"' in client
          assert 'class TerminalUI' in client
          assert 'safe_extract' in client and 'commit_snapshot' in client and 'maybe_reexec' in client
          assert 'def uninstall_termux' in client and '"hapus"' in client
          assert 'requests' not in client and 'pip install' not in client
          print('FURINA_PRIVATE_1_0_3_ONE_CLIENT_OK')
          PY

      - name: Test 1.0.3 reconstruction and local fast-path contract
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/furina-agent-final/overrides/private-1.0.3/validate.sh
          python3 experiments/furina-agent-final/fast-path-audit.py /tmp/furina-agent-rc54-validate/termux

      - name: Enforce channel-last publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          wf=Path('.github/workflows/furinahub-rc51-core-rc63.yml').read_text()
          manifest=json.load(open('experiments/furina-agent-final/manifest.json'))
          publish=wf[wf.index('- name: Publish private 1.0.3 and stable update channel'):]
          last=publish.rfind('channel.json --clobber')
          assert last > publish.rfind('furina-install.sh')
          assert last > publish.rfind('"$CLIENT_NAME"')
          assert last > publish.rfind('"$SNAPSHOT_NAME"')
          assert manifest['bundle_id']=='furina-2026.08.24-private-1.0.3'
          assert manifest['version']=='1.0.3' and manifest['bridge_version']=='1.0.3'
          assert manifest['update_client_version']=='1.2.0'
          assert manifest['local_model_policy']=='on-demand-download-only-never-first-install'
          assert manifest['intent_routing'].startswith('ordinary-chat-zero-llm')
          assert manifest['local_background_memory'].startswith('full-quality-deferred-120s')
          print('FURINA_PRIVATE_1_0_3_CHANNEL_LAST_OK')
          PY
          git diff --check
