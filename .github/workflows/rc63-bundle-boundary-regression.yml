name: RC67 Full Snapshot Boundary Regression

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/overrides/rc60/**'
      - 'experiments/furina-agent-final/overrides/runtime-r30/**'
      - 'experiments/furina-agent-final/overrides/rc61/**'
      - 'experiments/furina-agent-final/overrides/runtime-r32/**'
      - 'experiments/furina-agent-final/overrides/rc62/**'
      - 'experiments/furina-agent-final/overrides/rc63/**'
      - 'experiments/furina-agent-final/overrides/runtime-r33/**'
      - 'experiments/furina-agent-final/overrides/android-rc50/**'
      - 'experiments/furina-agent-final/overrides/android-rc51/**'
      - 'experiments/furina-agent-final/overrides/android-rc52/**'
      - 'experiments/furina-agent-final/overrides/rc64/**'
      - 'experiments/furina-agent-final/overrides/runtime-r34/**'
      - 'experiments/furina-agent-final/overrides/rc65/**'
      - 'experiments/furina-agent-final/overrides/runtime-r35/**'
      - 'experiments/furina-agent-final/overrides/android-rc53/**'
      - 'experiments/furina-agent-final/overrides/rc66/**'
      - 'experiments/furina-agent-final/overrides/runtime-r36/**'
      - 'experiments/furina-agent-final/overrides/android-rc54/**'
      - 'experiments/furina-agent-final/overrides/rc67/**'
      - 'experiments/furina-agent-final/overrides/runtime-r37/**'
      - 'experiments/furina-agent-final/overrides/android-rc55/**'
      - 'experiments/furina-agent-final/install.sh'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'

jobs:
  boundary-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate RC67 partner baseline and snapshot boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/furina-agent-final/overrides/rc60/apply.py
          python3 experiments/furina-agent-final/overrides/rc60/test_ast_boundary.py
          python3 -m py_compile experiments/furina-agent-final/overrides/rc61/apply.py
          bash -n experiments/furina-agent-final/overrides/runtime-r32/install-body.sh
          python3 -m py_compile experiments/furina-agent-final/overrides/rc63/apply.py
          python3 -m py_compile experiments/furina-agent-final/overrides/android-rc50/apply.py
          python3 -m py_compile experiments/furina-agent-final/overrides/android-rc51/apply.py
          python3 -m py_compile experiments/furina-agent-final/overrides/android-rc52/apply.py
          python3 -m py_compile experiments/furina-agent-final/overrides/android-rc53/apply.py
          bash -n experiments/furina-agent-final/overrides/runtime-r33/install-body.sh
          python3 -m py_compile experiments/furina-agent-final/overrides/rc64/apply.py
          bash -n experiments/furina-agent-final/overrides/runtime-r34/install-body.sh
          python3 -m py_compile experiments/furina-agent-final/overrides/rc65/apply.py
          bash -n experiments/furina-agent-final/overrides/runtime-r35/install-body.sh
          python3 -m py_compile experiments/furina-agent-final/overrides/rc66/apply.py
          python3 -m py_compile experiments/furina-agent-final/overrides/rc66/relationship_v3.py
          python3 -m py_compile experiments/furina-agent-final/overrides/android-rc54/apply.py
          bash -n experiments/furina-agent-final/overrides/runtime-r36/install-body.sh
          python3 -m py_compile experiments/furina-agent-final/overrides/rc67/apply.py
          python3 -m py_compile experiments/furina-agent-final/overrides/rc67/relationship_v4.py
          python3 -m py_compile experiments/furina-agent-final/overrides/android-rc55/apply.py
          bash -n experiments/furina-agent-final/overrides/runtime-r37/install-body.sh
          python3 - <<'PY'
          import hashlib,re
          from pathlib import Path
          root=Path('experiments/furina-agent-final')
          def blob(p):
              d=Path(p).read_bytes(); return hashlib.sha1(f"blob {len(d)}\0".encode()+d).hexdigest()
          def var(text,name):
              m=re.search(rf'^{re.escape(name)}="([^"]+)"', text, re.M); assert m,name; return m.group(1)
          apply=root/'overrides/rc67/apply.py'
          relationship=root/'overrides/rc67/relationship_v4.py'
          android=root/'overrides/android-rc55/apply.py'
          body=root/'overrides/runtime-r37/install-body.sh'
          legacy_apply=root/'overrides/rc62/apply.py'
          install=root/'install.sh'
          assert var(install.read_text(),'BODY_BLOB') == blob(body)
          assert var(install.read_text(),'RUNTIME_CONTRACT') == 'furina-runtime/v3-full-snapshot'
          assert var(body.read_text(),'FURINA_RUNTIME_CONTRACT') == 'furina-runtime/v3-full-snapshot'
          assert install.read_bytes() == Path('furina-agent-termux/experiments/furina-agent-final/install.sh').read_bytes()
          assert 'relationship_v4' in apply.read_text()
          assert 'relationship_mode' not in relationship.read_text()
          assert 'furina-2026.08.22-rc67-rc55' in body.read_text()
          assert 'sync_apk' in body.read_text()
          assert 'COMMIT_STARTED' in body.read_text()
          assert 'SNAPSHOT_SHA256' in body.read_text()
          assert 'validate_archive' in body.read_text()
          assert '$STABLE_RELEASE/bundle.json' in body.read_text()
          assert "'render_panel'" not in install.read_text()
          assert "'sync_apk'" in install.read_text()
          assert 'APPLY_BLOB' not in install.read_text()
          assert 'runtime-r36' not in body.read_text()
          assert 'foundation' not in body.read_text().lower()
          assert 'bootstrap_pattern = re.compile' in legacy_apply.read_text()
          assert 'system_pattern = re.compile' in legacy_apply.read_text()
          assert 'id="relationshipBaseline"' in android.read_text()
          print('FURINA_RC67_FULL_SNAPSHOT_BOUNDARY_OK')
          PY
