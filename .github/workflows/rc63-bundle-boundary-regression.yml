name: Furina Termux 1.1.25 Boundary Regression

on:
  pull_request:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  push:
    branches: [experiment/furina-agent-termux]
    paths:
      - 'experiments/furina-agent-final/**'
      - 'furina-agent-termux/experiments/furina-agent-final/install.sh'
      - '.github/workflows/furinahub-rc51-core-rc63.yml'
      - '.github/workflows/rc63-bundle-boundary-regression.yml'
  workflow_dispatch:

jobs:
  boundary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce Termux-only updater and adaptive memory boundary
        run: |
          set -euo pipefail
          bash -n experiments/furina-agent-final/install.sh
          cmp experiments/furina-agent-final/install.sh furina-agent-termux/experiments/furina-agent-final/install.sh
          TMP="$(mktemp -d)"
          python3 experiments/furina-agent-final/overrides/runtime-private-1.2.1/build_client.py experiments/furina-agent-final/overrides/runtime-r39/update_client.py "$TMP/furina-update.py"
          python3 - "$TMP/furina-update.py" <<'PY'
          import ast,sys
          from pathlib import Path
          client=Path(sys.argv[1]).read_text(); tree=ast.parse(client)
          updates=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='update']
          assert len(updates)==1
          update='\n'.join(client.splitlines()[updates[0].lineno-1:updates[0].end_lineno])
          assert 'install_core(' in update
          assert 'sync_apk(' not in update and 'changed_apk' not in update
          assert 'ensure_termux_properties' not in update and 'ensure_openconnector' not in update
          assert 'CLIENT_VERSION = "1.4.3"' in client
          assert 'FURINA_TERMUX_ONLY_UPDATER_116' in client
          launchers=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='launcher_texts')
          launcher_text='\n'.join(client.splitlines()[launchers.lineno-1:launchers.end_lineno])
          assert 'furina-hub' not in launcher_text and 'furina-apk-confirm' not in launcher_text
          parser_fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='build_parser')
          parser_text='\n'.join(client.splitlines()[parser_fn.lineno-1:parser_fn.end_lineno])
          assert 'confirm-apk' not in parser_text
          print('FURINA_TERMUX_120_ONE_CLIENT_OK')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          installer=Path('experiments/furina-agent-final/install.sh').read_text(); active='\n'.join(x for x in installer.splitlines() if not x.lstrip().startswith('#'))
          for token in ('FURINA_UPDATER_GENERATION="40"','VERSION="1.1.25"','DEPENDENCY_REVISION="2026.08.27-r75"','RUNTIME_CONTRACT="furina-runtime/v26-neutral-live-training-termux"'):
              assert token in active,token
          assert 'apk-only' not in active
          m=json.load(open('experiments/furina-agent-final/manifest.json'))
          assert m['hub_update_ownership']=='retired-not-distributed'
          workflow=Path('.github/workflows/furinahub-rc51-core-rc63.yml').read_text()
          assert 'assembleRelease' not in workflow and 'APK_NAME' not in workflow
          assert 'No APK is built or uploaded' in workflow
          print('FURINA_TERMUX_125_NO_APK_DISTRIBUTION_OK')
          PY
          validation_home="$(mktemp -d)"
          HOME="$validation_home" FURINA_HOME="$validation_home" bash experiments/furina-agent-final/overrides/private-1.2.6/validate.sh
          git diff --check
