name: Temp sync Furina scroll installer

on:
  push:
    branches:
      - fix/furina-chat-scroll-controls
    paths:
      - 'experiments/furina-agent-final/overrides/apply-ui-rc12-postfix.py'
      - '.github/workflows/tmp-sync-furina-scroll-installer.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/furina-chat-scroll-controls
      - name: Sync postfix blob pin into installer
        shell: bash
        run: |
          set -euo pipefail
          POSTFIX=experiments/furina-agent-final/overrides/apply-ui-rc12-postfix.py
          INSTALLER=experiments/furina-agent-final/install.sh
          NEW_SHA="$(git hash-object "$POSTFIX")"
          python3 - "$INSTALLER" "$NEW_SHA" <<'PY'
          import pathlib,re,sys
          path=pathlib.Path(sys.argv[1]); sha=sys.argv[2]
          text=path.read_text(encoding='utf-8')
          new,count=re.subn(r'UI_RC12_POSTFIX_BLOB="[0-9a-f]{40}"', f'UI_RC12_POSTFIX_BLOB="{sha}"', text, count=1)
          if count != 1:
              raise SystemExit('installer postfix pin marker missing')
          path.write_text(new, encoding='utf-8')
          PY
          if git diff --quiet -- "$INSTALLER"; then
            echo "Installer pin already synchronized"
            exit 0
          fi
          git config user.name "Wynn Dev"
          git config user.email "indonesiafilmku@gmail.com"
          git add "$INSTALLER"
          git commit -m "fix: pin chat scroll postfix in installer"
          git push origin HEAD:fix/furina-chat-scroll-controls
