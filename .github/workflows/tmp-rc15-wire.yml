name: Temp wire RC15 full paste
on:
  push:
    branches: [fix/furina-full-multiline-paste-rc15]
    paths: ['.github/workflows/tmp-rc15-wire.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/furina-full-multiline-paste-rc15
      - name: Wire RC15 installer and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          meta = Path('experiments/furina-agent-final')
          transform = meta / 'overrides/apply-core-rc15.py'
          blob = subprocess.check_output(['git','hash-object',str(transform)], text=True).strip()

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, got {count}')
              return text.replace(old, new, 1)

          p = meta / 'install.sh'
          s = p.read_text(encoding='utf-8')
          s = once(s, 'VERSION="1.0.0-rc14"', 'VERSION="1.0.0-rc15"', 'installer version')
          anchor = 'CORE_RC14_TRANSFORM_BLOB="d328c13404a01846a90bb8ad12e9bf858a323e19"\n'
          s = once(s, anchor, anchor + f'CORE_RC15_TRANSFORM_URL="$BASE/overrides/apply-core-rc15.py"\nCORE_RC15_TRANSFORM_BLOB="{blob}"\n', 'rc15 vars')
          loop = '    "$CORE_RC14_TRANSFORM_URL|$CORE_RC14_TRANSFORM_BLOB|apply-core-rc14.py"; do\n'
          s = once(s, loop, '    "$CORE_RC14_TRANSFORM_URL|$CORE_RC14_TRANSFORM_BLOB|apply-core-rc14.py" \\\n    "$CORE_RC15_TRANSFORM_URL|$CORE_RC15_TRANSFORM_BLOB|apply-core-rc15.py"; do\n', 'rc15 transform loop')
          s = once(s, 'direct_control.py long_input.py version.py tui.py; do', 'direct_control.py long_input.py paste_input.py version.py tui.py; do', 'paste file contract')
          s = once(s, 'grep -q \'VERSION = "1.0.0-rc14"\'', 'grep -q \'VERSION = "1.0.0-rc15"\'', 'staged version check')
          s = once(s, 'run_quiet "Memasang Furina Core RC14" 44 prepare_core', 'run_quiet "Memasang Furina Core RC15" 44 prepare_core', 'installer label')
          s = s.replace('RC14 sudah terpasang. Jalankan:', 'RC15 sudah terpasang. Jalankan:')
          p.write_text(s, encoding='utf-8')

          manifest_path = meta / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '1.0.0-rc14':
              raise SystemExit('unexpected manifest version')
          manifest['version'] = '1.0.0-rc15'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          bash -n experiments/furina-agent-final/install.sh
          git diff --check
      - name: Commit RC15 installer metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wynn Dev'
          git config user.email 'indonesiafilmku@gmail.com'
          git add experiments/furina-agent-final/install.sh experiments/furina-agent-final/manifest.json
          git commit -m 'build: wire Furina Core RC15 installer'
          git push origin HEAD:fix/furina-full-multiline-paste-rc15
