name: Build Furina Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/bootstrap-llama-android.sh'
      - 'scripts/overlays/**'
      - 'scripts/apply-*.py'
      - 'scripts/normalize-*.py'
      - 'scripts/fix-*.py'
      - 'scripts/public-repo-safety-gate.py'
      - 'scripts/furinahub-v2-gate.py'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/bootstrap-llama-android.sh'
      - 'scripts/overlays/**'
      - 'scripts/apply-*.py'
      - 'scripts/normalize-*.py'
      - 'scripts/fix-*.py'
      - 'scripts/public-repo-safety-gate.py'
      - 'scripts/furinahub-v2-gate.py'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-furina-apk.yml'
      - '.gitignore'
      - '.env.example'

permissions:
  contents: read
  id-token: write

concurrency:
  group: furina-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate public repository safety
        run: |
          python3 scripts/public-repo-safety-gate.py
          python3 scripts/furinahub-v2-gate.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate web companion route
        run: |
          cp .env.example .env
          npm install --no-audit --no-fund --prefer-offline
          npm run build
          test -s src/routes/native.tsx
          grep -q 'Qwen3.5 4B Deckard Heretic' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          ! grep -q 'Qwen3.5 9B' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          ! grep -qi 'gemma' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          grep -q 'generationJob = null' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'DB_VERSION = 5' android-wrapper/app/src/main/java/com/wynndev/furina/MemoryStore.kt
          grep -q 'class UnifiedAiEngine' android-wrapper/app/src/main/java/com/wynndev/furina/UnifiedAiEngine.kt
          grep -q 'interface AiProvider' android-wrapper/app/src/main/java/com/wynndev/furina/AiContracts.kt
          grep -q 'data class AiModelRef' android-wrapper/app/src/main/java/com/wynndev/furina/AiContracts.kt
          grep -q 'fun updateSessionSummary' android-wrapper/app/src/main/java/com/wynndev/furina/MemoryStore.kt
          grep -q 'contextWindowTokens' android-wrapper/app/src/main/java/com/wynndev/furina/ContextEngine.kt
          grep -q 'class SecureApiKeyStore' android-wrapper/app/src/main/java/com/wynndev/furina/OnlineAiConfig.kt
          grep -q 'AndroidKeyStore' android-wrapper/app/src/main/java/com/wynndev/furina/OnlineAiConfig.kt
          grep -q 'AES/GCM/NoPadding' android-wrapper/app/src/main/java/com/wynndev/furina/OnlineAiConfig.kt
          grep -q 'class OpenAiCompatibleProvider' android-wrapper/app/src/main/java/com/wynndev/furina/OpenAiCompatibleProvider.kt
          grep -q 'openrouter/free' android-wrapper/app/src/main/java/com/wynndev/furina/OpenAiCompatibleProvider.kt
          grep -q 'setAiMode' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'setOnlineAutoFallback' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'OnlineAiSettingsCard' src/routes/native.tsx
          grep -q 'Fallback otomatis model gratis' src/components/OnlineAiSettingsCard.tsx
          grep -q 'saveAppSettings' src/routes/native.tsx
          grep -q 'val transferActive = state == "downloading" || state == "paused"' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadManager.kt
          grep -q 'OneTimeWorkRequestBuilder<ModelDownloadWorker>' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadManager.kt
          grep -q 'setForeground(createForegroundInfo' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadWorker.kt
          grep -q 'setRequestProperty("Range"' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadWorker.kt
          grep -q 'fun prepareModel' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'DEFAULT_CONTEXT_SIZE    = 4096' scripts/overlays/ai_chat.cpp
          grep -q 'mmap load failed; retrying without mmap' scripts/overlays/ai_chat.cpp
          grep -q 'load_mode = LLAMA_LOAD_MODE_NONE' scripts/overlays/ai_chat.cpp
          grep -q 'throw IOException("llama.cpp gagal memproses prompt' scripts/overlays/InferenceEngineImpl.kt
          grep -q 'if (existing == expectedBytes) return' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadWorker.kt
          grep -q 'ModelDownloadCancelReceiver' android-wrapper/app/src/main/AndroidManifest.xml
          ! grep -q 'engine.destroy()' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'transition-transform duration-300 ease-out' src/routes/native.tsx
          grep -q 'setDecorFitsSystemWindows(window, true)' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.kt
          grep -q 'windowOptOutEdgeToEdgeEnforcement' android-wrapper/app/src/main/res/values-v35/styles.xml
          grep -q 'android:extractNativeLibs="true"' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'jniLibs.useLegacyPackaging = true' android-wrapper/app/build.gradle
          grep -q 'reasoning_budget_tokens' scripts/overlays/ai_chat.cpp
          grep -q 'configureReasoningBudget' scripts/overlays/InferenceEngineImpl.kt
          grep -q 'loadedIdentityFingerprint' android-wrapper/app/src/main/java/com/wynndev/furina/LocalLlamaProvider.kt
          grep -q 'ReasoningStreamFilter' android-wrapper/app/src/main/java/com/wynndev/furina/LocalLlamaProvider.kt
          grep -q 'verifySerialized' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadManager.kt
          grep -q 'observeUserTurn' android-wrapper/app/src/main/java/com/wynndev/furina/UnifiedAiEngine.kt
          grep -q 'companionStateContext' android-wrapper/app/src/main/java/com/wynndev/furina/ContextEngine.kt
          grep -q 'MessageMarkdown' src/routes/native.tsx
          grep -q 'PrivateContextStreamFilter' android-wrapper/app/src/main/java/com/wynndev/furina/LocalLlamaProvider.kt
          grep -q 'prepareModel(activeSessionId, name, effectivePersona)' src/routes/native.tsx
          grep -q 'api.mymemory.translated.net/get' src/lib/furina.functions.ts
          grep -q 'Layanan terjemahan tidak menghasilkan teks Jepang' src/lib/furina.functions.ts
          grep -q 'qwen/qwen3.6-27b' android-wrapper/app/src/main/java/com/wynndev/furina/OnlineAiConfig.kt
          grep -q 'openai/gpt-oss-20b' android-wrapper/app/src/main/java/com/wynndev/furina/OnlineAiConfig.kt
          ! grep -q 'llama-3.1-8b-instant' android-wrapper/app/src/main/java/com/wynndev/furina/OnlineAiConfig.kt
          ! grep -q 'llama-3.3-70b-versatile' android-wrapper/app/src/main/java/com/wynndev/furina/OnlineAiConfig.kt
          ! grep -q '"groq/compound"' android-wrapper/app/src/main/java/com/wynndev/furina/OnlineAiConfig.kt
          grep -q 'javaScriptCanOpenWindowsAutomatically = false' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.kt
          grep -q 'isTrustedAppUri' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.kt
          grep -q 'STREAM_DISPATCH_MIN_CHARS = 48' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'STREAM_DISPATCH_MAX_DELAY_MS = 72L' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'EVIDENCE_ENROLLMENT_TOKEN' android-wrapper/app/build.gradle
          grep -q 'furina_engineering_evidence_v1' android-wrapper/app/src/main/java/com/wynndev/furina/DeviceEvidenceBridge.kt
          grep -q 'loginRequired", false' android-wrapper/app/src/main/java/com/wynndev/furina/DeviceEvidenceBridge.kt
          grep -q 'resetConversationStateKeepingModel' android-wrapper/app/src/main/java/com/wynndev/furina/LocalLlamaProvider.kt
          grep -q 'block(localProvider)' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          test "$(grep -c 'provider.prepare(model, context)' android-wrapper/app/src/main/java/com/wynndev/furina/DeviceBehavioralBenchmark.kt)" -eq 1
          ! grep -q 'provider.prepare(model, resetContext)' android-wrapper/app/src/main/java/com/wynndev/furina/DeviceBehavioralBenchmark.kt
          grep -q 'control_enrollment' engineering/device-evidence/edge-function/index.ts
          ! grep -q 'requireOwnerUser' engineering/device-evidence/edge-function/index.ts
          ! grep -q 'auth.getSession' src/components/FurinaDeviceEvidenceAgent.tsx

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Restore pinned llama.cpp Android AAR cache
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: android-wrapper/app/libs/llama-android.aar
          key: llama-android-aar-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh', 'scripts/overlays/**', 'scripts/apply-*.py', 'scripts/normalize-*.py', 'scripts/fix-*.py') }}

      - name: Install Android native toolchain
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"
          sudo apt-get update -qq
          sudo apt-get install -y ccache

      - name: Restore native compiler cache
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: furina-llama-ccache-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh', 'scripts/overlays/**', 'scripts/apply-*.py', 'scripts/normalize-*.py', 'scripts/fix-*.py') }}
          restore-keys: |
            furina-llama-ccache-${{ runner.os }}-ndk29-

      - name: Build pinned llama.cpp Android AAR
        if: steps.llama-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          bash scripts/bootstrap-llama-android.sh
          test -s android-wrapper/app/libs/llama-android.aar
          ccache --show-stats

      - name: Save pinned llama.cpp Android AAR cache
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android-wrapper/app/libs/llama-android.aar
          key: llama-android-aar-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh', 'scripts/overlays/**', 'scripts/apply-*.py', 'scripts/normalize-*.py', 'scripts/fix-*.py') }}

      - name: Verify llama.cpp Android AAR
        run: test -s android-wrapper/app/libs/llama-android.aar

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore stable Furina signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: android-wrapper
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > app/furina-release.jks
          chmod 600 app/furina-release.jks
          test -s app/furina-release.jks

      - name: Prepare device evidence enrollment
        id: evidence-enrollment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          HASH="$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "token_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Validate Android build for external fork
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        working-directory: android-wrapper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/src/main/res/drawable
          cp ../public/icon-192.png app/src/main/res/drawable/furina_icon.png
          gradle --no-daemon --stacktrace --build-cache testDebugUnitTest lintRelease assembleDebug 2>&1 | tee ../gradle-build.log

      - name: Build stable signed Furina APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: android-wrapper
        shell: bash
        env:
          FURINA_GIT_SHA: ${{ github.sha }}
          FURINA_EVIDENCE_ENROLLMENT_TOKEN: ${{ steps.evidence-enrollment.outputs.token }}
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FURINA_KEYSTORE_PASSWORD"
          test -n "$FURINA_KEY_ALIAS"
          test -n "$FURINA_KEY_PASSWORD"
          set -o pipefail
          mkdir -p app/src/main/res/drawable
          cp ../public/icon-192.png app/src/main/res/drawable/furina_icon.png
          gradle --no-daemon --stacktrace --build-cache testDebugUnitTest lintRelease assembleRelease 2>&1 | tee ../gradle-build.log

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FurinaHub-Tests-${{ github.run_number }}
          path: |
            android-wrapper/app/build/test-results/
            android-wrapper/app/build/reports/tests/
            android-wrapper/app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Gradle-Log-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify stable APK identity, signing, and permissions
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          APK=android-wrapper/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q '69b11ec474d557c92de2bc329cccbaaac488d0dcb99c9b1ba78f6c5e1d9cd1a7' apk-signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.wynndev.furina'" apk-badging.txt
          grep -q "application-label:'FurinaHub'" apk-badging.txt
          grep -Eq "application-icon-[0-9]+:'res/.+\\.png'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' apk-permissions.txt
          cp "$APK" FurinaHub-V2.apk
          ls -lh FurinaHub-V2.apk

      - name: Upload Furina stable APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: FurinaHub-V2-${{ github.run_number }}
          path: FurinaHub-V2.apk
          if-no-files-found: error
          retention-days: 90

      - name: Register official evidence enrollment hash
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TOKEN_HASH: ${{ steps.evidence-enrollment.outputs.token_hash }}
          TARGET_COMMIT: ${{ github.sha }}
          EVIDENCE_ENDPOINT: https://fxebamfwewsvtscrbwxk.supabase.co/functions/v1/furina-device-evidence
        run: |
          set -euo pipefail
          test -n "$TOKEN_HASH"
          export EXPIRES_AT="$(date -u -d '+90 days' '+%Y-%m-%dT%H:%M:%SZ')"
          python3 - <<'PY'
          import json, os
          body = {
              "action": "control_enrollment",
              "targetCommit": os.environ["TARGET_COMMIT"],
              "tokenHash": os.environ["TOKEN_HASH"],
              "expiresAt": os.environ["EXPIRES_AT"],
          }
          with open("evidence-enrollment.json", "w", encoding="utf-8") as fh:
              json.dump(body, fh)
          PY
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=furina-device-evidence")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_JSON")"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @evidence-enrollment.json \
            "$EVIDENCE_ENDPOINT" > evidence-enrollment-response.json
          python3 - <<'PY'
          import json
          data = json.load(open("evidence-enrollment-response.json", encoding="utf-8"))
          if data.get("ok") is not True:
              raise SystemExit(f"evidence enrollment rejected: {data}")
          print("Official evidence enrollment registered for exact main build.")
          PY
