name: Build Furina Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-furina-apk.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-furina-apk.yml'

permissions:
  contents: read

concurrency:
  group: furina-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate web companion route
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s src/routes/native.tsx
          grep -q 'Qwen3.5 4B Uncensored' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          grep -q 'Qwen3.5 9B Uncensored' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          ! grep -qi 'gemma' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          grep -q 'generationJob = null' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'DB_VERSION = 3' android-wrapper/app/src/main/java/com/wynndev/furina/MemoryStore.kt
          grep -q 'class UnifiedAiEngine' android-wrapper/app/src/main/java/com/wynndev/furina/UnifiedAiEngine.kt
          grep -q 'interface AiProvider' android-wrapper/app/src/main/java/com/wynndev/furina/AiContracts.kt
          grep -q 'fun updateSessionSummary' android-wrapper/app/src/main/java/com/wynndev/furina/MemoryStore.kt
          grep -q 'saveAppSettings' src/routes/native.tsx
          grep -q 'val transferActive = state == "downloading" || state == "paused"' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadManager.kt
          grep -q 'OneTimeWorkRequestBuilder<ModelDownloadWorker>' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadManager.kt
          grep -q 'setForeground(createForegroundInfo' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadWorker.kt
          grep -q 'setRequestProperty("Range"' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadWorker.kt
          grep -q 'fun prepareModel' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'DEFAULT_CONTEXT_SIZE    = 4096' scripts/overlays/ai_chat.cpp
          grep -q 'mmap load failed; retrying without mmap' scripts/overlays/ai_chat.cpp
          grep -q 'load_mode = LLAMA_LOAD_MODE_NONE' scripts/overlays/ai_chat.cpp
          grep -q 'throw IOException("llama.cpp gagal memproses prompt' scripts/overlays/InferenceEngineImpl.kt
          grep -q 'if (existing == expectedBytes) return' android-wrapper/app/src/main/java/com/wynndev/furina/ModelDownloadWorker.kt
          grep -q 'ModelDownloadCancelReceiver' android-wrapper/app/src/main/AndroidManifest.xml
          ! grep -q 'engine.destroy()' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'transition-transform duration-300 ease-out' src/routes/native.tsx
          grep -q 'setDecorFitsSystemWindows(window, true)' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.kt
          grep -q 'windowOptOutEdgeToEdgeEnforcement' android-wrapper/app/src/main/res/values/styles.xml
          grep -q 'android:extractNativeLibs="true"' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'jniLibs.useLegacyPackaging = true' android-wrapper/app/build.gradle
          grep -q 'reasoning_budget_tokens' scripts/overlays/ai_chat.cpp
          grep -q 'configureReasoningBudget' scripts/overlays/InferenceEngineImpl.kt
          grep -q 'loadedIdentityFingerprint' android-wrapper/app/src/main/java/com/wynndev/furina/LocalLlamaProvider.kt
          grep -q 'ReasoningStreamFilter' android-wrapper/app/src/main/java/com/wynndev/furina/LocalLlamaProvider.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Restore pinned llama.cpp Android AAR cache
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: android-wrapper/app/libs/llama-android.aar
          key: llama-android-aar-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh', 'scripts/overlays/**') }}

      - name: Install Android native toolchain
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build pinned llama.cpp Android AAR
        if: steps.llama-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
        run: |
          bash scripts/bootstrap-llama-android.sh
          test -s android-wrapper/app/libs/llama-android.aar

      - name: Save pinned llama.cpp Android AAR cache
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android-wrapper/app/libs/llama-android.aar
          key: llama-android-aar-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh', 'scripts/overlays/**') }}

      - name: Verify llama.cpp Android AAR
        run: test -s android-wrapper/app/libs/llama-android.aar

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore stable Furina signing key
        working-directory: android-wrapper
        run: |
          base64 --decode furina-release.jks.b64 > app/furina-release.jks
          test -s app/furina-release.jks

      - name: Build stable signed Furina APK
        working-directory: android-wrapper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/src/main/res/drawable
          cp ../public/icon-192.png app/src/main/res/drawable/furina_icon.png
          gradle --no-daemon --stacktrace clean assembleRelease 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Gradle-Log-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify stable APK identity, signing, and permissions
        run: |
          APK=android-wrapper/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -q '69b11ec474d557c92de2bc329cccbaaac488d0dcb99c9b1ba78f6c5e1d9cd1a7' apk-signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.wynndev.furina'" apk-badging.txt
          grep -q "application-label:'Furina'" apk-badging.txt
          grep -Eq "application-icon-[0-9]+:'res/.+\\.png'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' apk-permissions.txt
          cp "$APK" Furina-Stable.apk
          ls -lh Furina-Stable.apk

      - name: Upload Furina stable APK
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Stable-${{ github.run_number }}
          path: Furina-Stable.apk
          if-no-files-found: error
          retention-days: 90
