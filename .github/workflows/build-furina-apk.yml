name: Build Furina Offline Qwen APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-furina-apk.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-furina-apk.yml'

permissions:
  contents: read

concurrency:
  group: furina-offline-qwen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate web companion route
        run: |
          npm ci --no-audit --no-fund
          npm run build
          grep -q 'Qwen3.5 4B Uncensored' src/routes/native.tsx
          grep -q 'Qwen3.5 9B Uncensored' src/routes/native.tsx
          ! grep -qi 'gemma' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build pinned llama.cpp Android AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
        run: |
          bash scripts/bootstrap-llama-android.sh
          test -s android-wrapper/app/libs/llama-android.aar

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build installable Furina APK
        working-directory: android-wrapper
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK identity and permissions
        run: |
          APK=android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.wynndev.furina'" apk-badging.txt
          grep -q "application-label:'Furina'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          cp "$APK" Furina-Offline-Qwen.apk
          ls -lh Furina-Offline-Qwen.apk

      - name: Upload Furina APK
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Offline-Qwen-${{ github.run_number }}
          path: Furina-Offline-Qwen.apk
          if-no-files-found: error
          retention-days: 90
