name: Build Furina Offline Qwen APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-furina-apk.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-furina-apk.yml'

permissions:
  contents: read

concurrency:
  group: furina-offline-qwen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate web companion route
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s src/routes/native.tsx
          grep -q 'Qwen3.5 4B Uncensored' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          grep -q 'Qwen3.5 9B Uncensored' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          ! grep -qi 'gemma' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          grep -q '55e05aba5a4e1e2d6c4919753a68941c4ad4cb11' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          grep -q 'a5ebf434dfbf9646d1bb97a469c1d8f69e4feb2e' android-wrapper/app/src/main/java/com/wynndev/furina/ModelCatalog.kt
          grep -q 'generationJob = null' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt
          grep -q 'DB_VERSION = 2' android-wrapper/app/src/main/java/com/wynndev/furina/MemoryStore.kt
          grep -q 'furina-before-restore' android-wrapper/app/src/main/java/com/wynndev/furina/MemoryStore.kt
          grep -q 'saveAppSettings' src/routes/native.tsx
          grep -q 'tokensPerSecond' android-wrapper/app/src/main/java/com/wynndev/furina/FurinaBridge.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Restore pinned llama.cpp Android AAR cache
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: android-wrapper/app/libs/llama-android.aar
          key: llama-android-aar-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh') }}

      - name: Install Android native toolchain
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Build pinned llama.cpp Android AAR
        if: steps.llama-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
        run: |
          bash scripts/bootstrap-llama-android.sh
          test -s android-wrapper/app/libs/llama-android.aar

      - name: Save pinned llama.cpp Android AAR cache
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android-wrapper/app/libs/llama-android.aar
          key: llama-android-aar-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh') }}

      - name: Verify llama.cpp Android AAR
        run: test -s android-wrapper/app/libs/llama-android.aar

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build installable Furina APK
        working-directory: android-wrapper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/src/main/res/drawable
          cp ../public/icon-192.png app/src/main/res/drawable/furina_icon.png
          gradle --no-daemon --stacktrace clean assembleDebug 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Gradle-Log-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK identity and permissions
        run: |
          APK=android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.wynndev.furina'" apk-badging.txt
          grep -q "application-label:'Furina'" apk-badging.txt
          grep -Eq "application-icon-[0-9]+:'res/.+\\.png'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          cp "$APK" Furina-Offline-Qwen.apk
          ls -lh Furina-Offline-Qwen.apk

      - name: Upload Furina APK
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Offline-Qwen-${{ github.run_number }}
          path: Furina-Offline-Qwen.apk
          if-no-files-found: error
          retention-days: 90
