name: Build Furina APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-furina-apk.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore release signing key
        working-directory: android-wrapper
        run: base64 --decode furina-release.jks.b64 > furina-release.jks

      - name: Build signed release APK
        working-directory: android-wrapper
        env:
          FURINA_KEYSTORE_PASSWORD: FurinaRelease2026!
          FURINA_KEY_PASSWORD: FurinaRelease2026!
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android-wrapper/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp android-wrapper/app/build/outputs/apk/release/app-release.apk Furina.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Release-${{ github.run_number }}
          path: Furina.apk
          if-no-files-found: error
          retention-days: 90
