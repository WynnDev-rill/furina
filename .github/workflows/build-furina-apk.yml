name: Build Furina Stable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/bootstrap-llama-android.sh'
      - 'scripts/overlays/**'
      - 'scripts/apply-*.py'
      - 'scripts/normalize-*.py'
      - 'scripts/fix-*.py'
      - 'scripts/public-repo-safety-gate.py'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/**'
      - 'android-wrapper/**'
      - 'scripts/bootstrap-llama-android.sh'
      - 'scripts/overlays/**'
      - 'scripts/apply-*.py'
      - 'scripts/normalize-*.py'
      - 'scripts/fix-*.py'
      - 'scripts/public-repo-safety-gate.py'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-furina-apk.yml'
      - '.gitignore'
      - '.env.example'

permissions:
  contents: read
  id-token: write

concurrency:
  group: furina-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate public repository safety
        run: python3 scripts/public-repo-safety-gate.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate web companion route
        run: |
          cp .env.example .env
          npm install --no-audit --no-fund --prefer-offline
          npm run build
          test -s src/routes/native.tsx

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore pinned llama.cpp Android AAR cache
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: android-wrapper/app/libs/llama-android.aar
          key: llama-android-aar-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh', 'scripts/overlays/**', 'scripts/apply-*.py', 'scripts/normalize-*.py', 'scripts/fix-*.py') }}

      - name: Install Android native toolchain
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"
          sudo apt-get update -qq
          sudo apt-get install -y ccache

      - name: Restore native compiler cache
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: furina-llama-ccache-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh', 'scripts/overlays/**', 'scripts/apply-*.py', 'scripts/normalize-*.py', 'scripts/fix-*.py') }}
          restore-keys: |
            furina-llama-ccache-${{ runner.os }}-ndk29-

      - name: Build pinned llama.cpp Android AAR
        if: steps.llama-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          bash scripts/bootstrap-llama-android.sh
          test -s android-wrapper/app/libs/llama-android.aar
          ccache --show-stats

      - name: Save pinned llama.cpp Android AAR cache
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android-wrapper/app/libs/llama-android.aar
          key: llama-android-aar-${{ runner.os }}-ndk29-${{ hashFiles('scripts/bootstrap-llama-android.sh', 'scripts/overlays/**', 'scripts/apply-*.py', 'scripts/normalize-*.py', 'scripts/fix-*.py') }}

      - name: Verify llama.cpp Android AAR
        run: test -s android-wrapper/app/libs/llama-android.aar

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore stable Furina signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: android-wrapper
        env:
          FURINA_RELEASE_KEYSTORE_B64: ${{ secrets.FURINA_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$FURINA_RELEASE_KEYSTORE_B64"
          printf '%s' "$FURINA_RELEASE_KEYSTORE_B64" | base64 --decode > app/furina-release.jks
          chmod 600 app/furina-release.jks
          test -s app/furina-release.jks

      - name: Validate Android build for external fork
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        working-directory: android-wrapper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p app/src/main/res/drawable
          cp ../public/icon-192.png app/src/main/res/drawable/furina_icon.png
          gradle --no-daemon --stacktrace --build-cache lintRelease assembleDebug 2>&1 | tee ../gradle-build.log

      - name: Build stable signed Furina APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: android-wrapper
        shell: bash
        env:
          FURINA_GIT_SHA: ${{ github.sha }}
          FURINA_KEYSTORE_PASSWORD: ${{ secrets.FURINA_KEYSTORE_PASSWORD }}
          FURINA_KEY_ALIAS: ${{ secrets.FURINA_KEY_ALIAS }}
          FURINA_KEY_PASSWORD: ${{ secrets.FURINA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FURINA_KEYSTORE_PASSWORD"
          test -n "$FURINA_KEY_ALIAS"
          test -n "$FURINA_KEY_PASSWORD"
          set -o pipefail
          mkdir -p app/src/main/res/drawable
          cp ../public/icon-192.png app/src/main/res/drawable/furina_icon.png
          gradle --no-daemon --stacktrace --build-cache lintRelease assembleRelease 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Gradle-Log-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify stable APK identity, signing, and permissions
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          APK=android-wrapper/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.wynndev.furina'" apk-badging.txt
          grep -q "application-label:'Furina'" apk-badging.txt
          cp "$APK" Furina-Stable.apk
          ls -lh Furina-Stable.apk

      - name: Upload Furina stable APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Stable-${{ github.run_number }}
          path: Furina-Stable.apk
          if-no-files-found: error
          retention-days: 90
