name: Validate Mirei UX and Build APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android-wrapper/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-furina-apk.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android-wrapper/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-furina-apk.yml'

permissions:
  contents: read

concurrency:
  group: mirei-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build production web application
        run: npm run build

      - name: Validate companion and UX systems
        run: |
          node -e "const p=require('./package.json'); for (const name of ['three','@react-three/fiber','@react-three/drei','@pixiv/three-vrm']) if (!p.dependencies[name]) throw new Error('Missing '+name)"
          grep -q 'aihorde.net/api/v2' src/lib/companion/ai-horde.ts
          grep -q 'api.tts.quest/v3/voicevox/synthesis' src/lib/companion/voice.ts
          grep -q 'instant local fallback' src/routes/index.tsx
          grep -q 'RelationshipState' src/lib/companion/types.ts
          grep -q 'CompanionStage' src/routes/index.tsx
          grep -q 'InochiCompanionStage' src/routes/index.tsx
          test -s public/mirei-polish.css
          grep -q 'mirei-polish.css' public/mirei-cleanup.js
          grep -q 'prefers-reduced-motion' public/mirei-polish.css
          grep -q 'android.permission.INTERNET' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'adjustResize' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'MireiNative' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java
          grep -q 'furina-pi.vercel.app' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java
          grep -q 'LEGACY_PROTECTED_HOST' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java
          grep -q 'setBlockNetworkLoads(false)' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java
          grep -q 'pauseTimers' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java
          ! grep -q 'android_asset/offline' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable final APK
        working-directory: android-wrapper
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK permissions and package
        run: |
          APK=android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions "$APK" | tee apk-permissions.txt
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' apk-permissions.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "application-label:'Mirei'" apk-badging.txt

      - name: Package final APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk Mirei-Final.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Mirei-Final-${{ github.run_number }}
          path: Mirei-Final.apk
          if-no-files-found: error
          retention-days: 90
