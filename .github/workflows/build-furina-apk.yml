name: Validate Offline Furina and Build APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'public/**'
      - 'android-wrapper/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/build-furina-apk.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'public/**'
      - 'android-wrapper/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/build-furina-apk.yml'

permissions:
  contents: read

concurrency:
  group: furina-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Validate offline-only architecture
        run: |
          test -s shared/furina-profile.json
          node -e "JSON.parse(require('fs').readFileSync('shared/furina-profile.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('android-wrapper/app/src/main/assets/model_catalog.json','utf8'))"
          test -s android-wrapper/app/src/main/assets/offline/index.html
          test -s android-wrapper/app/src/main/assets/offline/app.css
          test -s android-wrapper/app/src/main/assets/offline/enhanced.css
          test -s android-wrapper/app/src/main/assets/offline/preflight.js
          test -s android-wrapper/app/src/main/assets/offline/app.js
          test -s android-wrapper/app/src/main/assets/offline/ui.js
          test -s android-wrapper/app/src/main/assets/offline/furina-background.jpg
          node --check android-wrapper/app/src/main/assets/offline/preflight.js
          node --check android-wrapper/app/src/main/assets/offline/app.js
          node --check android-wrapper/app/src/main/assets/offline/ui.js
          grep -q "connect-src 'self'" android-wrapper/app/src/main/assets/offline/index.html
          grep -q 'setBlockNetworkLoads(true)' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java
          grep -q 'ActivityResultContracts.OpenDocument' android-wrapper/app/src/main/java/com/wynndev/furina/ModelManagerActivity.java
          grep -q 'GENERATION_TIMEOUT_MS' android-wrapper/app/src/main/java/com/wynndev/furina/OfflineModelEngine.java
          grep -q 'IDENTITAS DAN PERILAKU WAJIB' android-wrapper/app/src/main/java/com/wynndev/furina/OfflineModelEngine.java
          grep -q 'UnifiedMainActivity' android-wrapper/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' android-wrapper/app/src/main/AndroidManifest.xml
          ! grep -R -E 'ai\.gateway\.lovable\.dev|supabase\.co|api\.tts\.quest|furina-pi\.vercel\.app' \
            src android-wrapper/app/src/main public --exclude='Furina.apk' --exclude='update.json'
          ! grep -R -E 'downloadUrl|projectorUrl' android-wrapper/app/src/main/assets/model_catalog.json
          ! grep -q '@/integrations/lovable' src/routes/index.tsx
          ! grep -q 'useServerFn' src/routes/index.tsx

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch llama.cpp source for compilation
        run: |
          rm -rf android-wrapper/app/src/main/cpp/llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git android-wrapper/app/src/main/cpp/llama.cpp

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and verify release signing key
        working-directory: android-wrapper
        env:
          FURINA_KEYSTORE_PASSWORD: FurinaRelease2026!
        run: |
          base64 --decode furina-release.jks.b64 > furina-release.jks
          keytool -list -keystore furina-release.jks -storepass "$FURINA_KEYSTORE_PASSWORD" -alias furina

      - name: Build signed offline release APK
        working-directory: android-wrapper
        env:
          FURINA_KEYSTORE_PASSWORD: FurinaRelease2026!
          FURINA_KEY_PASSWORD: FurinaRelease2026!
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK signature and permissions
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android-wrapper/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions android-wrapper/app/build/outputs/apk/release/app-release.apk | tee apk-permissions.txt
          ! grep -q 'android.permission.INTERNET' apk-permissions.txt

      - name: Rename APK
        run: cp android-wrapper/app/build/outputs/apk/release/app-release.apk Furina-Offline.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Offline-${{ github.run_number }}
          path: Furina-Offline.apk
          if-no-files-found: error
          retention-days: 90
