name: Build Furina APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-furina-apk.yml'

permissions:
  contents: read

concurrency:
  group: furina-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore proven Android shell
        run: |
          git restore --source=615fc4633f11d52ff47ac7c80b21b81e03033aa3 -- android-wrapper
          sed -i 's/android:label="Mirei"/android:label="Furina"/' android-wrapper/app/src/main/AndroidManifest.xml

      - name: Verify Furina identity and production URL
        run: |
          grep -q 'applicationId '\''com.wynndev.furina'\''' android-wrapper/app/build.gradle
          grep -q 'android:label="Furina"' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'https://furina-pi.vercel.app/' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: android-wrapper
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK=android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.wynndev.furina'" apk-badging.txt
          grep -q "application-label:'Furina'" apk-badging.txt
          cp "$APK" Furina.apk

      - name: Upload Furina APK
        uses: actions/upload-artifact@v4
        with:
          name: Furina-${{ github.run_number }}
          path: Furina.apk
          if-no-files-found: error
          retention-days: 90
