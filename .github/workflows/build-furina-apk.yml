name: Validate Furina and Build APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'android-wrapper/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-furina-apk.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'android-wrapper/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-furina-apk.yml'

permissions:
  contents: write

concurrency:
  group: furina-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Validate canonical personality and offline UI
        run: |
          test -s shared/furina-profile.json
          node -e "JSON.parse(require('fs').readFileSync('shared/furina-profile.json','utf8'))"
          test -s android-wrapper/app/src/main/assets/offline/index.html
          test -s android-wrapper/app/src/main/assets/offline/app.css
          test -s android-wrapper/app/src/main/assets/offline/preflight.js
          test -s android-wrapper/app/src/main/assets/offline/app.js
          test -s android-wrapper/app/src/main/assets/offline/furina-background.jpg
          node --check android-wrapper/app/src/main/assets/offline/preflight.js
          node --check android-wrapper/app/src/main/assets/offline/app.js
          grep -q 'app.css' android-wrapper/app/src/main/assets/offline/index.html
          grep -q 'preflight.js' android-wrapper/app/src/main/assets/offline/index.html
          grep -q 'app.js' android-wrapper/app/src/main/assets/offline/index.html
          grep -q 'Content-Security-Policy' android-wrapper/app/src/main/assets/offline/index.html
          grep -q 'furina-profile.json' android-wrapper/app/src/main/assets/offline/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch llama.cpp source
        run: |
          rm -rf android-wrapper/app/src/main/cpp/llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git android-wrapper/app/src/main/cpp/llama.cpp

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and verify release signing key
        working-directory: android-wrapper
        env:
          FURINA_KEYSTORE_PASSWORD: FurinaRelease2026!
        run: |
          base64 --decode furina-release.jks.b64 > furina-release.jks
          keytool -list -keystore furina-release.jks -storepass "$FURINA_KEYSTORE_PASSWORD" -alias furina

      - name: Apply Java compatibility patch
        run: sed -i 's/setTextAllCaps(false)/setAllCaps(false)/g' android-wrapper/app/src/main/java/com/wynndev/furina/ModelManagerActivity.java

      - name: Build signed release APK
        working-directory: android-wrapper
        env:
          FURINA_KEYSTORE_PASSWORD: FurinaRelease2026!
          FURINA_KEY_PASSWORD: FurinaRelease2026!
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android-wrapper/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp android-wrapper/app/build/outputs/apk/release/app-release.apk Furina.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Furina-Release-${{ github.run_number }}
          path: Furina.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish native updater files
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p public
          cp Furina.apk public/Furina.apk
          APK_SHA=$(sha256sum Furina.apk | awk '{print $1}')
          cat > public/update.json <<EOF
          {
            "latestVersionCode": ${{ github.run_number }},
            "minimumSupportedVersionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://furina-pi.vercel.app/Furina.apk",
            "sha256": "$APK_SHA",
            "notes": "Pembaruan Furina: UI terpadu, Lovable AI, model offline, persona bersama, dan memori bersama."
          }
          EOF

      - name: Commit updater files for Vercel
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add public/Furina.apk public/update.json
          if git diff --cached --quiet; then
            echo "Updater files unchanged"
          else
            git commit -m "Publish Furina native update ${{ github.run_number }}"
            git push origin HEAD:main
          fi
