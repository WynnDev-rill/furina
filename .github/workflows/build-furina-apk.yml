name: Validate 3D Companion and Build APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'public/**'
      - 'android-wrapper/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-furina-apk.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'public/**'
      - 'android-wrapper/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-furina-apk.yml'

permissions:
  contents: read

concurrency:
  group: mirei-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Validate companion foundation
        run: |
          node -e "const p=require('./package.json'); for (const name of ['three','@react-three/fiber','@react-three/drei','@pixiv/three-vrm']) if (!p.dependencies[name]) throw new Error('Missing '+name)"
          grep -q 'aihorde.net/api/v2' src/lib/companion/ai-horde.ts
          grep -q 'CompanionStage' src/routes/index.tsx
          grep -q 'android.permission.INTERNET' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android-wrapper/app/src/main/AndroidManifest.xml
          grep -q 'setBlockNetworkLoads(false)' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java
          ! grep -q 'android_asset/offline' android-wrapper/app/src/main/java/com/wynndev/furina/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android prototype
        working-directory: android-wrapper
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK permissions
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions android-wrapper/app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          grep -q 'android.permission.INTERNET' apk-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' apk-permissions.txt

      - name: Rename APK
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk Mirei-Stage1-Prototype.apk

      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: Mirei-Stage1-${{ github.run_number }}
          path: Mirei-Stage1-Prototype.apk
          if-no-files-found: error
          retention-days: 30
