name: Temp RC13 bridge inspect
on:
  push:
    branches: [feature/furina-direct-device-control-rc13]
    paths: ['.github/workflows/tmp-rc13-inspect.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/src.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          rm -rf /tmp/src && mkdir -p /tmp/src && tar -xzf "$ARCHIVE" -C /tmp/src
          ROOT=/tmp/src/termux/bridge/app/src/main/java/com/wynndev/furinaagentbridge
          echo '=== LocalBridgeServer.java ==='; cat "$ROOT/LocalBridgeServer.java"
          echo '=== BridgeRuntime.java ==='; cat "$ROOT/BridgeRuntime.java"
          echo '=== BootReceiver.java ==='; cat "$ROOT/BootReceiver.java"
          echo '=== FurinaAccessibilityService action area ==='; sed -n '1,210p' "$ROOT/FurinaAccessibilityService.java"
