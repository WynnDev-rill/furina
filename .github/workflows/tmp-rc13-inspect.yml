name: Temp RC13 validation
on:
  push:
    branches: [feature/furina-direct-device-control-rc13]
    paths: ['.github/workflows/tmp-rc13-inspect.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assemble transformed source and validate Core
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/src.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          rm -rf /tmp/src && mkdir -p /tmp/src && tar -xzf "$ARCHIVE" -C /tmp/src
          patch -p0 -d /tmp/src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/src < "$META/patches/runtime-online-agent.patch"
          ROOT=/tmp/src/termux
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]); dst=pathlib.Path(sys.argv[2]); m=json.loads((src/'manifest.json').read_text())
          def sha(d): return hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          for i in m['files']:
              d=(src/i['path']).read_bytes(); assert sha(d)==i['git_blob_sha']; t=dst/i['target']; t.parent.mkdir(parents=True,exist_ok=True); t.write_bytes(d)
          PY
          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py; do python3 "$META/overrides/$f" "$ROOT"; done
          python3 -m compileall -q "$ROOT/core/furina_agent"
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          from furina_agent.prospective import extract_prospectives
          from furina_agent.direct_control import DirectDeviceControl
          due=extract_prospectives('ingatkan aku minum 5 menit lagi', now=1_700_000_000)[0][1]
          assert 299 <= due-1_700_000_000 <= 301, due
          class Store:
              def log_event(self,*a,**k): pass
          class Cfg:
              device_control_mode='shizuku'; direct_control_enabled=True
          class Bridge:
              def __init__(self): self.calls=[]
              def control(self,a): self.calls.append(('control',a)); return {'ok':True}
              def apps(self): return {'apps':[{'label':'YouTube','package':'com.google.android.youtube'}]}
              def action(self,a): self.calls.append(('action',a)); return {'ok':True}
              def screen(self): return {'nodes':[]}
          b=Bridge(); d=DirectDeviceControl(Cfg(),Store(),b)
          assert d.try_execute('buka YouTube').handled
          assert b.calls[-1][1]['type']=='open_app'
          assert not d.try_execute('kirim pesan ke Wynn').handled
          print('RC13_DIRECT_CORE_TEST_OK')
          PY
          grep -q 'VERSION = "1.0.0-rc13"' "$ROOT/core/furina_agent/version.py"
          grep -q 'config_revision: int = 10' "$ROOT/core/furina_agent/config.py"
          grep -q '"Kontrol perangkat"' "$ROOT/core/furina_agent/tui.py"
          ! grep -q 'self.reminders.start()' "$ROOT/core/furina_agent/companion.py"
          grep -q 'Shizuku.bindUserService' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/PrivilegedControl.java"
          grep -q 'ReminderScheduler.restoreAll' "$ROOT/bridge/app/src/main/java/com/wynndev/furinaagentbridge/BootReceiver.java"
          grep -q 'versionCode 10008' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc8'" "$ROOT/bridge/app/build.gradle"
          grep -q 'SCHEDULE_EXACT_ALARM' "$ROOT/bridge/app/src/main/AndroidManifest.xml"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Bridge RC8
        working-directory: /tmp/src/termux
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :bridge:app:assembleDebug
          test -f bridge/app/build/outputs/apk/debug/app-debug.apk
          echo RC13_BRIDGE_BUILD_OK
