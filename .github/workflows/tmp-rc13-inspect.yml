name: Temp RC13 bridge inspect
on:
  push:
    branches: [feature/furina-direct-device-control-rc13]
    paths: ['.github/workflows/tmp-rc13-inspect.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/src.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          rm -rf /tmp/src && mkdir -p /tmp/src && tar -xzf "$ARCHIVE" -C /tmp/src
          patch -p0 -d /tmp/src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/src < "$META/patches/runtime-online-agent.patch"
          ROOT=/tmp/src/termux
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]); dst=pathlib.Path(sys.argv[2]); m=json.loads((src/'manifest.json').read_text())
          def sha(d): return hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          for i in m['files']:
              d=(src/i['path']).read_bytes(); assert sha(d)==i['git_blob_sha']; t=dst/i['target']; t.parent.mkdir(parents=True,exist_ok=True); t.write_bytes(d)
          PY
          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py; do python3 "$META/overrides/$f" "$ROOT" >/dev/null; done
          echo '=== COMPANION ==='; cat "$ROOT/core/furina_agent/companion.py"
          echo '=== CONFIG RC9 AREAS ==='; grep -n -A45 -B10 'config_revision\|fast_path_enabled' "$ROOT/core/furina_agent/config.py"
          echo '=== SETTINGS ==='; grep -n -A80 -B5 'def _settings' "$ROOT/core/furina_agent/tui.py"
          echo '=== CHAT RESPOND WORKER ==='; grep -n -A70 -B5 'def _respond' "$ROOT/core/furina_agent/chat_surface.py"
          echo '=== PROSPECTIVE ==='; sed -n '1,100p' "$ROOT/core/furina_agent/prospective.py"
