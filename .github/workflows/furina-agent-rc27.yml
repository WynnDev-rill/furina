name: Historical FurinaHub Android RC27 + Core RC43

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct historical RC43 and Android RC27
        shell: bash
        run: bash experiments/furina-agent-final/overrides/android-rc27/validate.sh
