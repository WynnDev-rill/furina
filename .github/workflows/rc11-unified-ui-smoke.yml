name: RC13 Furina Termux UI + Direct Control Smoke

on:
  push:
    branches:
      - experiment/furina-agent-termux
      - feature/furina-direct-device-control-rc13
    paths:
      - 'experiments/furina-agent-final/**'
      - '.github/workflows/rc11-unified-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble final Core and validate RC13
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/furina-agent-final.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          rm -rf /tmp/furina-agent-src && mkdir -p /tmp/furina-agent-src
          tar -xzf "$ARCHIVE" -C /tmp/furina-agent-src
          ROOT=/tmp/furina-agent-src/termux
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/furina-agent-src < "$META/patches/runtime-online-agent.patch"
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]).resolve(); dst=pathlib.Path(sys.argv[2]).resolve()
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          def sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for item in manifest['files']:
              data=(src/item['path']).read_bytes(); assert sha(data)==item['git_blob_sha'], item['path']
              target=(dst/item['target']).resolve(); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          PY
          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py apply-core-rc8.py apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done
          python3 -m compileall -q "$ROOT/core/furina_agent"
          python3 -m pip install -q 'rich>=13.9,<15' 'textual==8.2.8'
          PYTHONPATH="$ROOT/core" python3 -c 'import furina_agent.tui; from furina_agent.chat_surface import run_chat_surface; from furina_agent.tool_runtime import AgentToolRuntime; from furina_agent.direct_control import DirectDeviceControl'
          PYTHONPATH="$ROOT/core" python3 "$META/overrides/tests/smoke_chat_surface.py"
          PYTHONPATH="$ROOT/core" python3 - <<'PY'
          from furina_agent.prospective import extract_prospectives
          from furina_agent.direct_control import DirectDeviceControl
          now=1_700_000_000
          due=extract_prospectives('ingatkan aku minum 5 menit lagi', now=now)[0][1]
          assert 299 <= due-now <= 301
          class Store:
              def log_event(self,*a,**k): pass
          class Cfg:
              device_control_mode='normal'; direct_control_enabled=True
          class Bridge:
              def __init__(self): self.calls=[]
              def control(self,a): self.calls.append(a); return {'ok':True}
              def apps(self): return {'apps':[{'label':'YouTube','package':'com.google.android.youtube'}]}
              def action(self,a): self.calls.append(a); return {'ok':True}
              def screen(self): return {'nodes':[]}
          b=Bridge(); d=DirectDeviceControl(Cfg(),Store(),b)
          assert d.try_execute('buka YouTube').handled
          assert b.calls[-1]['type']=='open_app'
          assert not d.try_execute('kirim pesan ke Wynn').handled
          print('RC13_DIRECT_SMOKE_OK')
          PY

          grep -q 'VERSION = "1.0.0-rc13"' "$ROOT/core/furina_agent/version.py"
          grep -q 'config_revision: int = 10' "$ROOT/core/furina_agent/config.py"
          grep -q 'device_control_mode: str = "normal"' "$ROOT/core/furina_agent/config.py"
          test "$(grep -c '^def _main_menu(console) -> str:$' "$ROOT/core/furina_agent/tui.py")" = 1
          grep -q 'ChatApp().run(mouse=False)' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q '↑↓ scroll  ·  Esc kembali  ·  /back' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'Binding("up", "scroll_up", "", show=False, priority=True)' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'Binding("shift+up", "history_up", "", show=False, priority=True)' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q 'direct = self.session.try_direct(text)' "$ROOT/core/furina_agent/chat_surface.py"
          grep -q '"Kontrol perangkat"' "$ROOT/core/furina_agent/tui.py"
          ! grep -q 'self.reminders.start()' "$ROOT/core/furina_agent/companion.py"
          grep -q 'class _ThemedConsole:' "$ROOT/core/furina_agent/tui.py"
          grep -q 'ACCENT = "#5de4c7"' "$ROOT/core/furina_agent/tui.py"
          grep -q '\["Chat", "Memory", "Provider", "Settings", "System", "Update", "Exit"\]' "$ROOT/core/furina_agent/tui.py"
          grep -q 'apply-core-rc13.py' "$META/install.sh"
          grep -q 'apply-bridge-rc8.py' "$META/install.sh"
          grep -q "CORE_RC13_TRANSFORM_BLOB=\"$(git hash-object "$META/overrides/apply-core-rc13.py")\"" "$META/install.sh"
          grep -q "BRIDGE_RC8_TRANSFORM_BLOB=\"$(git hash-object "$META/overrides/apply-bridge-rc8.py")\"" "$META/install.sh"
          grep -q 'verify_dependencies()' "$META/install.sh"
          grep -q 'PYTHONPATH="$SRC/core" python -m compileall' "$META/install.sh"
          bash -n "$META/install.sh"
          echo RC13_TERMUX_DIRECT_UI_OK
