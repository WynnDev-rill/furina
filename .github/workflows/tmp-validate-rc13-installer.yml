name: Temp validate RC13 installer repair
on:
  push:
    branches: [fix/rc13-installer-bridge-version-check]
    paths: ['.github/workflows/tmp-validate-rc13-installer.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble RC13 and verify installer gate
        shell: bash
        run: |
          set -euo pipefail
          META=experiments/furina-agent-final
          ARCHIVE=/tmp/src.tar.gz
          : > "$ARCHIVE"
          for chunk in "$META"/source-*.b64; do base64 --decode "$chunk" >> "$ARCHIVE"; done
          rm -rf /tmp/src && mkdir -p /tmp/src && tar -xzf "$ARCHIVE" -C /tmp/src
          patch -p0 -d /tmp/src < "$META/patches/api30-inputstream.patch"
          patch -p0 -d /tmp/src < "$META/patches/runtime-online-agent.patch"
          ROOT=/tmp/src/termux
          python3 "$META/overrides/apply-bridge-primitives-rc5.py" "$ROOT"
          python3 - "$META/overrides" "$ROOT" <<'PY'
          import hashlib,json,pathlib,sys
          src=pathlib.Path(sys.argv[1]); dst=pathlib.Path(sys.argv[2]); m=json.loads((src/'manifest.json').read_text())
          def sha(d): return hashlib.sha1(f'blob {len(d)}\0'.encode()+d).hexdigest()
          for i in m['files']:
              d=(src/i['path']).read_bytes(); assert sha(d)==i['git_blob_sha']; t=dst/i['target']; t.parent.mkdir(parents=True,exist_ok=True); t.write_bytes(d)
          PY
          for f in apply-bridge-rc4.py apply-universal-agent-rc5.py apply-core-rc6.py apply-core-rc6-postfix.py apply-bridge-rc6.py apply-core-rc7.py apply-bridge-rc7.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done
          python3 -W error::SyntaxWarning "$META/overrides/apply-core-rc8.py" "$ROOT"
          for f in apply-core-rc8-postfix.py apply-core-rc9.py apply-ui-rc10.py apply-ui-rc10-hotfix.py apply-core-rc11.py apply-ui-rc12.py apply-ui-rc12-postfix.py apply-core-rc13.py apply-bridge-rc8.py; do
            python3 "$META/overrides/$f" "$ROOT"
          done
          python3 -m compileall -q "$ROOT/core/furina_agent"
          grep -q 'VERSION = "1.0.0-rc13"' "$ROOT/core/furina_agent/version.py"
          grep -q 'versionCode 10008' "$ROOT/bridge/app/build.gradle"
          grep -q "versionName '1.0.0-rc8'" "$ROOT/bridge/app/build.gradle"
          grep -q "versionCode 10008" "$META/install.sh"
          ! grep -q "versionCode 10007" "$META/install.sh"
          grep -q "versionName '1.0.0-rc8'" "$META/install.sh"
          test "$(git hash-object "$META/overrides/apply-core-rc8.py")" = "$(sed -n 's/^CORE_RC8_TRANSFORM_BLOB="\([0-9a-f]\{40\}\)"$/\1/p' "$META/install.sh")"
          bash -n "$META/install.sh"
          echo RC13_INSTALLER_REPAIR_OK
